[package]
name = "rust_predictor"
version = "0.1.0"
edition = "2021"
authors = ["StoryBrain AI"]
license = "MIT"
description = "Rust-accelerated crypto prediction and fractal pattern extension for StoryBrain AI"

[lib]
name = "rust_predictor"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rand = "0.8.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
