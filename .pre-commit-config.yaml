repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Bumped 2026-09: ruff v0.9.0 -> v0.11.0 for UP/SIM fixes; keep in sync with CI.
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Bumped 2026-09: mypy v1.11.2 -> v1.15.0 to match strict gate; rust_predictor exclude dropped (dir removed).
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--strict]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
