<header class="fixed top-0 inset-x-0 z-50 bg-base-100/95 backdrop-blur-md border-b border-base-300 transition-colors" id="mainHeader">
  <div class="max-w-[1240px] mx-auto px-4 sm:px-6">
    <nav id="siteNavbar" class="flex items-center justify-between h-16">
      
      <!-- Brand Logo (Cal.com Style) -->
      <a href="/" aria-label="StoryBrain AI — Home" class="flex items-center gap-2.5 group shrink-0">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-primary-content font-bold text-sm shadow-xs transition-transform group-hover:scale-105">
          S
        </div>
        <span class="font-display font-semibold text-[17px] tracking-tight text-base-content hidden sm:inline">
          StoryBrain<span class="text-base-content/50 ml-1 font-normal text-sm">AI</span>
        </span>
      </a>

      <!-- Desktop Nav Pill Group (Signature Cal.com component) -->
      <div class="hidden lg:flex items-center">
        <div class="nav-pill-group">
          <a href="/" class="category-tab {% if request.url.path in ['/', ''] %}active{% endif %}">
            Home
          </a>
          <a href="/tools" class="category-tab {% if request.url.path.startswith('/tool') or request.url.path.endswith('/tools') %}active{% endif %}">
            All Tools
          </a>
          
          <!-- Categories Dropdown inside pill group -->
          <div class="dropdown dropdown-hover dropdown-bottom">
            <button type="button" tabindex="0" class="category-tab flex items-center gap-1.5" aria-haspopup="true" aria-expanded="false">
              Categories
              <svg aria-hidden="true" width="12" height="12" class="w-3 h-3 text-base-content/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <ul tabindex="0" class="dropdown-content menu rounded-xl z-50 w-60 p-2 mt-2 bg-base-100 border border-base-300 shadow-lg">
              <li><a href="/ai-tools" class="rounded-lg py-2 text-sm font-medium">AI & Crypto</a></li>
              <li><a href="/image-tools" class="rounded-lg py-2 text-sm font-medium">Image Processing</a></li>
              <li><a href="/calculators" class="rounded-lg py-2 text-sm font-medium">Calculators</a></li>
              <li><a href="/developer-tools" class="rounded-lg py-2 text-sm font-medium">Developer & SEO</a></li>
              <li><a href="/business-tools" class="rounded-lg py-2 text-sm font-medium">Business & Operations</a></li>
              <li><a href="/productivity-tools" class="rounded-lg py-2 text-sm font-medium">Productivity & Utilities</a></li>
            </ul>
          </div>

          <a href="/blog" class="category-tab {% if request.url.path.startswith('/blog') %}active{% endif %}">
            Blog
          </a>
        </div>
      </div>
      
      <!-- Desktop Right Cluster: Search, Theme, Primary CTA -->
      <div class="hidden lg:flex items-center gap-2.5">
        {% set is_root_home = request.url.path in ['/', ''] %}
        <button type="button" id="searchToggleDesktop" aria-haspopup="dialog" aria-controls="searchDialog" aria-expanded="false" class="{% if is_root_home %}hidden {% endif %}flex items-center gap-2 px-3 py-1.5 h-9 rounded-md bg-base-200/60 border border-base-300 hover:border-base-content/40 text-base-content/60 hover:text-base-content transition-colors group cursor-pointer text-xs">
          <svg width="14" height="14" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="font-medium">Search tools…</span>
          <kbd class="px-1 py-0.2 rounded bg-base-100 border border-base-300 text-[10px] font-mono">⌘K</kbd>
        </button>

        <!-- Theme Toggle -->
        <button type="button" class="btn-cal-icon-circle theme-toggle text-base-content/70 hover:text-base-content" id="themeToggleDesktop" aria-label="Toggle theme">
          <svg aria-hidden="true" width="16" height="16" class="w-4 h-4 theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg aria-hidden="true" width="16" height="16" class="w-4 h-4 theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>

        <!-- Primary CTA Button (Cal.com #111111 button) -->
        <a href="/tools" class="btn-cal-primary text-xs tracking-tight">
          All Tools
        </a>
      </div>

      <!-- Mobile Controls -->
      <div class="flex lg:hidden items-center gap-1.5">
        <button type="button" id="searchToggleMobile" aria-haspopup="dialog" aria-controls="searchDialog" aria-expanded="false" aria-label="Search" class="btn-cal-icon-circle text-base-content/70">
          <svg width="16" height="16" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button type="button" class="btn-cal-icon-circle theme-toggle text-base-content/70" id="themeToggleMobile" aria-label="Toggle theme">
          <svg aria-hidden="true" width="16" height="16" class="w-4 h-4 theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg aria-hidden="true" width="16" height="16" class="w-4 h-4 theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
        <label for="mobileDrawer" role="button" tabindex="0" class="btn-cal-icon-circle text-base-content/70 cursor-pointer" aria-label="Menu">
          <svg width="16" height="16" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </label>
      </div>

    </nav>
  </div>
</header>
