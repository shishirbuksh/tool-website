<header class="fixed top-0 inset-x-0 pt-4" style="z-index: 9999;" id="mainHeader">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav id="siteNavbar" class="apple-glass relative flex items-center justify-between h-14 px-4 sm:px-5 rounded-full shadow-sm transition-all duration-300">
      <a href="/" aria-label="StoryBrain AI Home" class="flex items-center gap-2.5 group interactive-spring">
        <div class="w-8 h-8 rounded-full bg-base-content flex flex-shrink-0 items-center justify-center text-base-100 font-bold transition-transform duration-200">S</div>
        <span class="font-bold tracking-tight text-[15px] hidden sm:block">
          <span class="text-base-content">STORYBRAIN</span><span class="text-primary">AI</span>
        </span>
      </a>

      <!-- Desktop Nav -->
      <div class="hidden lg:flex items-center bg-base-content/5 p-1 rounded-full border border-base-content/5">
        <a href="/" class="px-4 py-1.5 rounded-full text-[13.5px] font-medium transition-colors {% if request.url.path == '/' %}bg-base-content/10 text-base-content{% else %}text-base-content/70 hover:text-base-content hover:bg-base-content/5{% endif %}">Home</a>
        <a href="/tools" class="px-4 py-1.5 rounded-full text-[13.5px] font-medium transition-colors {% if request.url.path.startswith('/tool') %}bg-base-content/10 text-base-content{% else %}text-base-content/70 hover:text-base-content hover:bg-base-content/5{% endif %}">All Tools</a>
        <a href="/blog" class="px-4 py-1.5 rounded-full text-[13.5px] font-medium transition-colors {% if request.url.path.startswith('/blog') %}bg-base-content/10 text-base-content{% else %}text-base-content/70 hover:text-base-content hover:bg-base-content/5{% endif %}">Blog</a>
        <div class="dropdown dropdown-hover dropdown-end">
          <button tabindex="0" class="px-4 py-1.5 rounded-full text-[13.5px] font-medium text-base-content/70 hover:text-base-content hover:bg-base-content/5 transition-colors flex items-center gap-1.5 min-target" aria-haspopup="true" aria-expanded="false">
            Categories
            <svg aria-hidden="true" class="w-3 h-3 transition-transform duration-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <ul tabindex="0" class="dropdown-content menu rounded-2xl z-[1] w-56 p-2 mt-2.5 apple-glass shadow-lg">
            <li><a href="/ai-tools" class="rounded-xl py-2.5 text-sm font-medium">AI & Crypto</a></li>
            <li><a href="/image-tools" class="rounded-xl py-2.5 text-sm font-medium">Image Processing</a></li>
            <li><a href="/calculators" class="rounded-xl py-2.5 text-sm font-medium">Calculators</a></li>
            <li><a href="/developer-tools" class="rounded-xl py-2.5 text-sm font-medium">Developer & SEO</a></li>
            <li><a href="/business-tools" class="rounded-xl py-2.5 text-sm font-medium">Business & Operations</a></li>
            <li><a href="/productivity-tools" class="rounded-xl py-2.5 text-sm font-medium">Productivity & Utilities</a></li>
          </ul>
        </div>
      </div>
      
      <!-- Desktop Search & Theme -->
      <div class="hidden lg:flex items-center gap-2">
        <button id="searchToggleDesktop" class="interactive-spring flex items-center gap-3 px-3 py-1.5 rounded-full bg-base-content/5 border border-base-content/5 hover:bg-base-content/10 transition-colors text-base-content/60 group">
          <svg class="w-3.5 h-3.5 group-hover:text-base-content transition-colors" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <span class="text-[13px] font-medium group-hover:text-base-content transition-colors">Search 100+ tools...</span>
          <kbd class="px-1.5 py-0.5 rounded bg-base-content/10 text-[10px] font-mono group-hover:bg-base-content/20 transition-colors">⌘K</kbd>
        </button>
        <button class="interactive-spring min-h-[36px] min-w-[36px] flex items-center justify-center rounded-full bg-base-content/5 border border-base-content/5 hover:bg-base-content/10 text-base-content/70 hover:text-base-content theme-toggle" id="themeToggleDesktop" aria-label="Toggle theme">
          <svg aria-hidden="true" class="w-4 h-4 theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg aria-hidden="true" class="w-4 h-4 theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>

      <!-- Mobile Right Side -->
      <div class="flex lg:hidden items-center gap-1.5">
        <button id="searchToggleMobile" class="interactive-spring min-h-[40px] min-w-[40px] flex items-center justify-center rounded-full bg-base-content/5 border border-base-content/5 text-base-content/70 hover:text-base-content">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button class="interactive-spring min-h-[40px] min-w-[40px] flex items-center justify-center rounded-full bg-base-content/5 border border-base-content/5 text-base-content/70 hover:text-base-content theme-toggle" id="themeToggleMobile" aria-label="Toggle theme">
          <svg aria-hidden="true" class="w-4 h-4 theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          <svg aria-hidden="true" class="w-4 h-4 theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </button>
      </div>
    </nav>
  </div>
</header>
