      desc: Goal Seek finds the price needed for a target profit at a given margin. Discount Impact shows how discounts erode margin. Cost Change simulates cost increases/decreases. Volume Compensator shows the volume needed after a price cut to maintain profit.
    - title: Scenario Comparison
      desc: Compare three pricing strategies side by side. Enter cost, price, and volume for Conservative, Moderate, and Aggressive scenarios to see revenue, profit, and margin for each.
    - title: Price Sensitivity
      desc: Enter cost, base price, and step % to see profit, margin, and markup at five price levels. Find the optimal price point for maximum profitability.
    - title: Markup ↔ Margin Converter
      desc: Enter either a margin or markup percentage to instantly see the equivalent value. The Quick Reference table shows common margin-markup pairs for rapid lookup.
    howto_calculate: <p><strong>Margin Calculation:</strong> Profit Margin = (Revenue − Cost) / Revenue × 100. This shows what percentage of your selling price is profit.</p><p><strong>Markup Calculation:</strong> Markup = (Revenue − Cost) / Cost × 100. This shows how much you added above cost.</p><p><strong>Selling Price from Margin:</strong> Revenue = Cost / (1 − Margin%). Divide the cost by 1 minus the desired margin percentage to get the required selling price.</p><p><strong>Break-Even:</strong> Break-Even Units = Fixed Costs / (Selling Price − Variable Cost per Unit). The contribution margin (price minus variable cost) shows how much each unit contributes to covering fixed costs.</p><p><strong>Discount Impact:</strong> Effective Margin = (Discounted Price − Cost) / Discounted Price × 100. A discount reduces both price and margin percentage.</p><p><strong>Volume Compensator:</strong> Needed Volume = Current Profit / (New Price − Variable Cost). Shows how many units at the new lower price
      generate the same total profit.</p><p>All calculations run in your browser — no data is sent to any server.</p>
    about_title: About the Profit Margin Calculator
    about_body: '<p>The <strong>Profit Margin &amp; Markup Calculator</strong> converts product cost and selling price into gross profit dollars, profit margin percentage, and cost markup percentage—plus revenue needed to hit desired target margins without confusing margin for markup.</p><h3>Margin vs. Markup Worked Pricing Example</h3><p>Suppose wholesale cost is <strong>$60</strong> and you retail at <strong>$100</strong>. Profit is $40. Your <strong>Markup on Cost is 66.7%</strong> (<code>$40 &divide; $60</code>), whereas your <strong>Gross Profit Margin is 40.0%</strong> (<code>$40 &divide; $100</code>). Businesses frequently lose money by intending a 40% profit margin, marking up $60 cost by 40% to $84, and discovering after fees that real margin is only 28.6% (<code>$24 &divide; $84</code>). Formula to price accurately for margin <code>M</code>: <code>Price = Cost &divide; (1 &minus; M)</code>.</p><h3>Margins Across Business Models</h3><ul><li><strong>Retail &amp; E-Commerce:</strong>
      Healthy gross margins often span 40%–65% before ad spend and shipping subsidies.</li><li><strong>Marketplaces &amp; Payment Fees:</strong> Deduct 2.9% + $0.30 Stripe fees and 8%–15% channel commissions inside Cost of Goods Sold (COGS).</li><li><strong>Margin Always Stays Below 100%:</strong> Markup has no upper ceiling (200%, 500%), while true gross margin can never reach 100% unless cost is zero.</li></ul>'
    related_slugs:
