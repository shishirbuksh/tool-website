    faqs:
    - q: How does a government exam age calculator calculate cutoff eligibility?
      a: Exam commissions check your exact chronological age in years, months, and days on an official cutoff date—commonly August 1 for UPSC CSE and SSC CGL/CHSL or January 1 for SSC GD and RRB NTPC—and compare your date of birth against permissible earliest and latest birth dates.
    - q: What are the UPSC age limit, birth-date window, and maximum attempts?
      a: General/EWS candidates must be between 21 and 32 years on August 1 with up to 6 attempts. OBC-NCL candidates receive 3 years relaxation (up to 35 years, 9 attempts), SC/ST receive 5 years (up to 37 years, unlimited attempts), and PwBD candidates receive 10 to 15 years relaxation.
    - q: How does OBC, SC, and ST age relaxation work for SSC CGL and SSC GD?
      a: Standard central government recruitment adds +3 years upper-age relaxation for OBC-NCL, +5 years for SC/ST, +10 years for PwBD (General), +13 years for PwBD (OBC), and +15 years for PwBD (SC/ST) across SSC CGL (18–27/30/32), CHSL (18–27), and SSC GD (18–23).
    - q: Does OBC or SC/ST age relaxation apply to UPSC NDA, CDS, or Agniveer?
      a: No. Defence entrance examinations including UPSC NDA (16.5 to 19.5 years), CDS, AFCAT, and Agniveer enforce strict birth-date windows with zero caste/category upper-age relaxation. Our tool flags defence presets automatically so you never get misleading results.
    - q: What is the minimum age limit for NEET UG medical admission?
      a: Under NTA guidelines, NEET UG candidates must be at least 17 years old at the time of admission or attain 17 years on or before December 31 of the admission year. There is currently no upper age limit for appearing in NEET UG.
    - q: Why does cutoff eligibility say "must not have attained 32 years" on 1 August?
      a: Under Indian recruitment rules, if you turn 32 on August 1 (for example, born on August 1, 1994 for an August 1, 2026 cutoff), you have already attained 32 years on the cutoff date and are over-age. Candidates born on or after August 2, 1994 remain eligible.
    - q: Can I check multiple recruitment exams at once from one Date of Birth?
      a: Yes. Alongside the detailed single-exam verdict and 5-year upcoming attempt forecast, the bottom comparison table instantly checks your Date of Birth and reservation category across 12 major Indian recruitment notifications simultaneously and exports a clean PDF report.
    howto_steps:
    - step: 1
      title: Select an Official Exam Notification Preset
      desc: Choose UPSC CSE, SSC CGL, SSC CHSL, SSC GD, IBPS PO, SBI PO, RRB NTPC, NDA, NEET UG, or custom limits.
