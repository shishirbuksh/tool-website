    howto_calculate: 'The countdown uses the Bitcoin halving schedule: a halving occurs every 210,000 blocks. The last halving was at block 840,000 on April 19, 2024. At an average block time of 600 seconds (10 minutes), the next halving at block 1,050,000 is estimated at 126,000,000 seconds (~4 years) after the previous one. Progress is calculated as the time elapsed since the last halving divided by the total cycle duration.'
    about_title: About the Crypto Halving Countdown
    about_body: '<p>The <strong>Bitcoin Halving Countdown</strong> tracks current block height, remaining blocks until the next <code>210,000</code>-block epoch boundary, and the programmatic issuance schedule down to the 21 million BTC cap.</p><h3>Protocol Issuance Math Across Halving Epochs</h3><p>Bitcoin enforces supply issuance inside consensus rules: starting at 50 BTC per block in January 2009, the block subsidy halves every 210,000 blocks via right bit-shift integer division. Epoch 2 dropped rewards to 25 BTC (2012), Epoch 3 to 12.5 BTC (2016), Epoch 4 to 6.25 BTC (2020), and Epoch 5 on April 19, 2024 (block <code>840,000</code>) cut issuance to <strong>3.125 BTC per block</strong>—roughly 450 BTC mined daily at 10-minute intervals. Block <code>1,050,000</code> lowers the subsidy again to <strong>1.5625 BTC</strong>.</p><h3>Why Calendar Dates Drift Around the 10-Minute Target</h3><ul><li><strong>Difficulty Retarget Lag:</strong> Bitcoin adjusts mining difficulty every 2,016 blocks
      (~14 days). Rapidly expanding global ASIC hashrate temporarily accelerates block discovery to ~9.5 minutes, pulling the halving date earlier.</li><li><strong>Miner Revenue Transition:</strong> As block subsidies shrink over decades, transaction fees inside block space become an increasingly larger share of network security revenue.</li></ul>'
