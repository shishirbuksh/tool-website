    faqs:
    - q: How is fixed deposit maturity calculated for quarterly compounding?
      a: Banks typically compound Indian FDs quarterly using A = P * (1 + r/4)^(4*t), reinvesting interest each quarter so returns earn interest in later periods.
    - q: Should I choose cumulative FD or regular monthly/quarterly payout?
      a: Choose cumulative FD if you want maximum long-term maturity growth, or non-cumulative monthly/quarterly payouts if you rely on steady cash income.
    - q: How does TDS affect my Fixed Deposit returns?
      a: When total bank FD interest crosses annual exemption thresholds, banks deduct TDS (10% with PAN), slightly reducing compounding on net reinvested gains.
    - q: Can I compare senior citizen FD rates against regular rates?
      a: Yes. Enter standard vs senior citizen rates (typically +0.50% higher) side by side to see exact extra interest at maturity.
    - q: How does FD certainty compare to SIP mutual fund projections?
      a: Fixed deposits guarantee a contracted rate with zero market volatility, whereas equity SIP returns fluctuate with markets and generally target higher long-term inflation beaters.
    - q: Is my FD deposit amount sent or logged online?
      a: No. Every fixed deposit maturity schedule, TDS deduction estimate, and inflation-adjusted yield calculates completely privately inside your browser without uploads.
    howto_steps:
    - title: Enter Deposit Details
