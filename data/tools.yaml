    about_title: About the Social Media Post Preview
    about_body: <p>The <strong>Social Media Post &amp; Link Card Previewer</strong> displays side-by-side mockups of how articles, product launches, and Open Graph banners appear inside feeds on LinkedIn, X (Twitter), Facebook, and Discord—before sharing publicly.</p><h3>Feed Truncation &amp; Crop Safe Zones Across Platforms</h3><p>LinkedIn truncates desktop link headlines near ~119 characters and switches vertical crops aggressively on mobile, while X Summary Large Image cards enforce a strict ~2:1 horizontal aspect ratio. Testing card titles (under 60–65 characters) and 1200 &times; 630px visuals in preview catches clipped product names, awkward hyphen wraps, and low-contrast overlay badges prior to campaign launches.</p><h3>Pre-Flight Launch Checklist</h3><ul><li><strong>Separate Copy From Headline:</strong> Don't repeat the exact link title word-for-word in the first line of your post caption—use the caption for context or a hook.</li><li><strong>Verify Live Crawler Access:</strong>
      Ensure firewalls like Cloudflare do not challenge <code>facebookexternalhit</code> or <code>LinkedInBot</code> user agents with bot interstitials.</li></ul><h3>Mobile vs. Desktop Feed Crop Verification</h3><p>Over 75% of LinkedIn and X timeline views happen on narrow phone screens—avoid tiny 12px chart labels inside Open Graph banners; bold 48px+ headlines stay crisp even when shrunk inside mobile chat cards.</p>
