    howto_calculate: <p><strong>Ad Revenue:</strong> Monthly = Views × CPM/1000 × MonetizedRatio × AdFactor</p><p><strong>MonetizedRatio</strong> = Engagement% × (WatchTime/8min) capped at 1</p><p><strong>AdFactor</strong> = 1 + (AdPods-1) × 0.15 (max +3 pods)</p><p><strong>Channel Value:</strong> MonthlyRev × (12 + Growth%×0.5) capped at 36×</p><p><strong>Growth:</strong> MonthlyViews = Current × (1 + Growth%)^Year</p><p><strong>Total Revenue:</strong> AdRev + Memberships + SuperChat + Merchandise + Affiliate</p><p><strong>Compare:</strong> Each scenario uses the same ad revenue formula with independent inputs.</p>
    about_title: About the YouTube Money Calculator
    about_body: <p>The <strong>YouTube Revenue Calculator (Long-Form + Shorts)</strong> estimates net creator payouts after YouTube's Partner Program revenue splits—modeling monetized playback ratios, category CPM tiers, mid-roll video length boosts, and optional sponsorship upside.</p><h3>Long-Form Watch Page vs. Shorts Revenue Mechanics</h3><p>Under YouTube Partner Program (YPP) terms, creators retain <strong>55% of Watch Page AdSense revenue</strong> on long-form videos (where ~40%–65% of views trigger monetized ad impressions), whereas Shorts creators pool audio-adjusted revenue and receive <strong>45%</strong>—yielding typical Shorts RPMs of <strong>$0.03–$0.09 per 1,000 views</strong> versus <strong>$2–$15+ RPM</strong> for 8+ minute educational or finance videos. Consequently, 1 million Finance long-form views can out-earn 50 million Shorts views.</p><h3>Levers That Actually Lift Channel RPM</h3><ul><li><strong>8-Minute Mid-Roll Threshold:</strong> Videos crossing 8 minutes qualify
      for natural mid-roll ad breaks, frequently lifting Watch Page RPM by 35%–70%.</li><li><strong>Viewer Country Mix:</strong> US, UK, Canada, Germany, and Australia watch time typically commands 4×–8× higher advertiser bids than global averages.</li><li><strong>YPP Threshold Reminders:</strong> Full Watch Page monetization requires 1,000 subscribers plus either 4,000 valid public watch hours (12 months) or 10 million public Shorts views (90 days).</li></ul>
