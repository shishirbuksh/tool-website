    faqs:
    - q: Where do I upload the generated robots.txt file?
      a: Place the plain-text robots.txt file directly in your domain root directory so it resolves at https://yourdomain.com/robots.txt with HTTP 200 status.
    - q: Can I block AI training crawlers like GPTBot while keeping Googlebot allowed?
      a: 'Yes. Add a User-agent: GPTBot or CCBot block with Disallow: / while leaving User-agent: * or User-agent: Googlebot set to Allow: /.'
    - q: Do wildcards (*) and end-of-URL anchors ($) work in robots.txt?
      a: 'Yes. Googlebot and Bingbot support * for wildcard sequences and $ to match exact URL endings, such as Disallow: /*.pdf$.'
    - q: Does robots.txt prevent sensitive pages from appearing in Google?
      a: Not by itself — robots.txt blocks crawling, not indexing of linked URLs. Use a meta noindex tag or HTTP X-Robots-Tag header to drop a page from search results.
    - q: Should I include my XML sitemap URL inside robots.txt?
      a: 'Yes. Adding a Sitemap: https://example.com/sitemap.xml line helps every search crawler locate your canonical URL index.'
    - q: Are my site URLs or crawl paths saved?
      a: No. Rules generate and validate strictly inside your browser tab and never touch our servers.
    howto_steps:
    - title: Add Allow and Disallow Rules
      desc: Type paths per user-agent with wildcard and dollar-anchor support.
    - title: Set Sitemaps and Delays
      desc: Attach sitemap URLs and crawl-delay so polite bots pace themselves.
    - title: Copy robots.txt
      desc: Copy the file content to your site root and verify with Search Console.
    howto_calculate: '<p>Rules group by user-agent with Allow and Disallow paths, where the longest matching rule wins, followed by a Sitemap line. The output validates directive spelling and warns on broad blocks like Disallow: /.</p>'
    about_title: About the Robots.txt Generator
    about_body: '<p>Our <strong>free robots.txt generator</strong> helps developers and site owners create syntax-checked <code>robots.txt</code> files in seconds — without accidentally blocking Googlebot or breaking CSS/JS asset rendering.</p>

      <h3>Quick Rules for a Clean robots.txt File</h3>

      <ul><li><strong>Target Specific Crawlers:</strong> Configure separate <code>Allow</code> and <code>Disallow</code> paths for Googlebot, Bingbot, GPTBot, ClaudeBot, PerplexityBot, or wildcard <code>*</code>.</li><li><strong>Declare Your Sitemap:</strong> Append an absolute <code>Sitemap: https://yourdomain.com/sitemap.xml</code> line at the bottom so search engines discover updated URLs automatically.</li><li><strong>Avoid Disallowing Crucial Assets:</strong> Never block <code>/static/</code>, CSS, or JavaScript folders required to render your layout for Mobile-First Indexing.</li></ul>'
