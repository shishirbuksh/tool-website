    name: Debt Calculator
    icon: calculator
    category: Calculators
    description: Compare snowball and avalanche debt payoff methods. See payoff dates, interest saved, and monthly plans. Free, runs in-browser. Become debt-free years sooner.
    keywords:
    - free debt payoff calculator online
    - debt snowball vs avalanche simulator
