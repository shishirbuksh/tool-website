    app_category: FinanceApplication
    sitemap_priority: 0.8
    date_modified: '2026-10-02'
    faqs:
    - q: How are crypto taxes calculated?
      a: 'Crypto taxes are calculated as capital gains: sale proceeds minus cost basis. Short-term gains (held under 1 year) are taxed at your ordinary income rate. Long-term gains (held over 1 year) have lower rates of 0%, 15%, or 20% depending on your income.'
    - q: What is the difference between short-term and long-term capital gains?
      a: Short-term gains are from assets held less than one year and are taxed at your regular income tax rate (10-37%). Long-term gains are from assets held more than one year and are taxed at 0%, 15%, or 20%. Long-term rates are much lower.
    - q: What is cost basis in crypto?
      a: Cost basis is what you paid for the cryptocurrency, including any purchase fees. When you sell, your gain or loss is the difference between the sale price and your cost basis. Keeping accurate records of your cost basis is essential for tax reporting.
    - q: How can I reduce my crypto taxes?
      a: Hold for over one year to qualify for lower long-term rates. Harvest tax losses by selling underperforming assets to offset gains. Consider donating crypto to charity or using a crypto IRA for tax-advantaged investing.
    - q: Do I need to report crypto on my taxes?
      a: In most countries, yes. In the US, the IRS considers crypto as property, so sales, trades, and even crypto-to-crypto transactions are taxable events. You must report them on your tax return regardless of the amount.
    - q: How are short term vs long term crypto gains taxed?
      a: Most countries tax short-term disposals as income and long-term holdings at lower capital-gains rates after a holding threshold. Enter buy price, sell price, dates and fees to estimate both buckets. Estimates only, confirm with a qualified tax professional.
    - q: How is FIFO cost basis calculated for crypto sales?
      a: FIFO matches each sale against your oldest unsold purchase lot first. Enter lots in buy order with quantity, price and fees, and the tool assigns cost to each disposal plus remaining inventory. Keep dated records for review.
    - q: What counts as a taxable crypto event?
      a: Selling for fiat, swapping coin to coin, spending crypto, and receiving staking, mining or airdrop income commonly count, while wallet-to-wallet transfers usually do not. Log every event with date, value and fees for your professional.
    - q: How does India vs US crypto tax treatment differ?
      a: India applies 30 percent flat tax on VDA gains plus 1 percent TDS with no loss offset. The US treats crypto as property with short vs long term rates plus income events. This tool organizes both views for review. Estimates only, not tax advice.
    - q: How do I estimate crypto taxes owed before filing?
      a: Enter each sale's proceeds, cost basis with fees, and holding period. The estimator applies short vs long term rates or India's flat 30 percent plus TDS, then totals what you may owe. Use it to plan quarterly payments. Estimates only, not tax advice.
    howto_steps:
    - title: Enter cost basis
      desc: Enter the total amount you paid for the crypto, including fees.
    - title: Enter sale proceeds
      desc: Enter the total amount you received when you sold the crypto.
    - title: Select holding period
      desc: Choose short-term (under 1 year) or long-term (over 1 year) for the correct tax rate.
    - title: Review tax estimate
      desc: See your estimated capital gains tax, effective rate, and after-tax profit.
    - title: Enter Lots
      desc: Add each buy lot with date, quantity, price and fees in purchase order for FIFO matching.
    - title: Add Disposals
      desc: Enter each sale, swap or spend with date, proceeds and fees to assign cost basis per lot.
    - title: Review Tax Buckets
      desc: Check short vs long term gains, income events and fee totals, then export the dated packet for your tax professional.
    howto_calculate: The calculator determines your capital gain as sale proceeds minus cost basis. It applies the short-term ordinary income tax brackets or long-term capital gains rates based on holding period and filing status. The gain is stacked on top of your annual income to find the marginal tax rate. This is an estimate only. Consult a tax professional for your specific situation.
