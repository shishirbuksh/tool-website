    about_title: About the Crypto DCA Calculator
    about_body: '<p>The <strong>Crypto DCA Calculator</strong> models recurring dollar-cost averaging schedules—daily, weekly, or monthly buys—against lump-sum deployment for Bitcoin, Ethereum, Solana, or diversified token baskets.</p><h3>Worked Comparison Example: $200 Monthly Over 36 Months</h3><p>Suppose you invest <strong>$200 per month for 3 years</strong> ($7,200 total principal) while an asset grows at an illustrative 12% annualized rate with a 0.25% spot exchange fee per buy. Each deposit buys fewer coins during local spikes and more coins during drawdowns, lowering average entry cost below the arithmetic mean of periodic prices. Deducting the 0.25% trading fee reduces net deployed capital to $199.50 per interval, totaling $18 in cumulative spot fees—whereas high-spread retail apps charging 2% consume $144 over the same schedule.</p><h3>Where Periodic Accumulation Helps—and Where It Trails</h3><ul><li><strong>Sideways &amp; Volatile Markets:</strong> Regular fixed-dollar buys systematically
      lower average cost basis when prices oscillate sharply before recovering.</li><li><strong>Sustained Bull Trends:</strong> In monotonically rising markets, a day-one lump sum deploys capital earlier and historically outperforms periodic entries.</li><li><strong>Spread &amp; Withdrawal Drag:</strong> Check maker/taker rates and network withdrawal minimums before automating micro-buys (e.g., $10 daily buys can suffer disproportionately from UTXO dust fees).</li></ul>'
