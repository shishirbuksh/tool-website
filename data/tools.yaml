      desc: Type the amount and choose exclusive (add GST) or inclusive (extract GST) mode.
    - title: Pick a GST rate
      desc: Select 0%, 0.25%, 3%, 5%, 18% or 40%, or enter a custom rate. Results update instantly with a CGST/SGST or IGST breakdown.
    - title: Itemize an invoice
      desc: Add multiple line items with different rates and quantities, then review the taxable value, total GST and grand total.
    howto_calculate: 'Exclusive GST: GST = amount × rate ÷ 100; total = amount + GST. Inclusive GST: base = amount ÷ (1 + rate ÷ 100); GST = amount − base. For intra-state supplies, CGST = SGST = GST ÷ 2. For inter-state supplies, IGST = GST. The invoice itemizer applies the same formulas per line, then sums taxable value, GST and totals. Rates come from the schedule effective 22 September 2025; cess and special entries are not modelled automatically.'
    about_title: About the GST Calculator
    about_body: <p>The GST Calculator is a free browser-based tool for estimating Indian Goods and Services Tax in INR. It supports 0%, 0.25%, 3%, 5%, 18% and 40% rates, exclusive and inclusive modes, intra-state CGST+SGST or inter-state IGST breakdowns, and a multi-item invoice itemizer.</p><p>Calculations and history stay in your browser; no amount, rate or invoice item is uploaded. The rates reflect the main GST schedule effective 22 September 2025 and were reviewed on 2 November 2026. This is an educational estimating tool, not tax advice or a filing determination — confirm the HSN/SAC entry and current notifications before acting.</p>
