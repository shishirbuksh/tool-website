    about_body: '<p>The <strong>JSON Formatter, Validator &amp; Minifier</strong> pretty-prints nested payloads with 2-space or 4-space indentation, compresses whitespace for compact HTTP transport, detects exact RFC 8259 syntax failures by line and column, and sorts keys cleanly for diffing.</p><h3>Top 4 Real-World Syntax Errors Caught Instantly</h3><p>When copying config snippets from JavaScript objects or logs into strict REST payloads, four subtle bugs break parsers repeatedly: <strong>1)</strong> trailing commas after the last array item or key (<code>{"a":1,}</code>), <strong>2)</strong> single-quoted strings instead of double quotes, <strong>3)</strong> unquoted object keys, and <strong>4)</strong> pasted <code>//</code> comments or unescaped newline characters inside strings. Fixing them against RFC 8259 before committing prevents silent production webhook rejections.</p><h3>Formatting vs. Minifying Workflow</h3><ul><li><strong>Sort Keys Before Diffing:</strong> Alphabetizing object
      keys makes comparing two API staging vs. production responses effortless in Git diffs.</li><li><strong>Zero Payload Logging:</strong> Production customer records and JWT webhook bodies never touch remote servers.</li><li><strong>Tree Depth &amp; Size Summary:</strong> Inspect key counts and raw vs. minified byte savings immediately.</li></ul>'
