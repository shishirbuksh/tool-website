      a: The Crypto Fear and Greed Index measures market sentiment on a scale of 0 to 100. A low score means investors are fearful (bearish), while a high score means they are greedy (bullish). It is updated daily by Alternative.me using volatility, volume, social media, and other data.
    - q: How is the Fear & Greed Index calculated?
      a: 'The index uses six weighted factors: Volatility (25%), Market Momentum/Volume (25%), Social Media Sentiment (15%), Surveys (15%), Bitcoin Dominance (10%), and Google Trends (10%). Each factor is scored and combined into a single daily number from 0 to 100.'
    - q: What does Extreme Fear mean?
      a: Extreme Fear (0–24) means investors are panicking and selling. Historically, extreme fear levels have been buying opportunities for long-term investors because the market is oversold and due for a rebound.
    - q: What does Extreme Greed mean?
      a: Extreme Greed (75–100) means FOMO is driving the market higher. When everyone is greedy, there may be few buyers left, which can signal a market top. It is often a sign to take profits or be cautious.
    - q: How can I use the Fear & Greed Index?
      a: 'Use the index as a contrarian signal: buy when fear is high and prices are low, sell or hold when greed is extreme. Combine it with other analysis tools for better entry and exit timing in crypto markets.'
    - q: Where does the Crypto Fear Greed Index Tracker get its data?
      a: Scores blend volatility, momentum, surveys and dominance from public crypto feeds, refreshed live each session while your settings stay local in the browser.
