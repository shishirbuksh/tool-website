    about_title: About the Mortgage Overpayment Calculator
    about_body: '<p>The <strong>Mortgage Overpayment Calculator</strong> models regular monthly extra principal payments and one-time annual lump sums across your amortization table—revealing exact interest saved, years shaved off payoff, and month-by-month remaining balance curves.</p><h3>Worked Overpayment Example: +$250/Month on a $350,000 Mortgage</h3><p>Suppose you hold a <strong>$350,000 30-year mortgage at 6.50% APR</strong> (scheduled P&amp;I payment <strong>$2,212.24/month</strong>, scheduled total interest <strong>$446,406</strong>). Adding just <strong>$250/month extra directly toward principal</strong> eliminates <strong>6 years and 5 months</strong> of payments and saves <strong>$112,840 in lifetime interest</strong>—yielding a guaranteed tax-free 6.50% return on every extra dollar paid.</p><h3>Checklist Before Submitting Extra Principal</h3><ul><li><strong>Specify ''Apply to Principal Only'':</strong> Some servicers treat extra cash as ''paid ahead'' on next month''s scheduled
      payment rather than reducing compounding principal immediately.</li><li><strong>Check Annual Prepayment Caps:</strong> Fixed-rate UK/EU/CA mortgages frequently limit fee-free overpayments to 10% of outstanding balance per year.</li><li><strong>Compare Against High-APR Debt &amp; 401(k) Match:</strong> Retire 20% credit cards and capture full employer retirement matches before prepaying sub-5% mortgages.</li></ul><h3>Liquidity Check Before Locking Equity</h3><p>Extra principal payments reduce mortgage debt permanently—you cannot easily withdraw prepaid equity without refinancing or opening a HELOC. Maintain 3–6 months of accessible emergency savings before committing aggressive monthly overpayments.</p>'
