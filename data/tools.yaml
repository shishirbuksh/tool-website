    about_title: About the CSS Gradient Generator
    about_body: <p>The <strong>CSS Linear, Radial &amp; Conic Gradient Generator</strong> lets frontend engineers adjust unlimited color stops, stop positions, angles, and repeating patterns visually—exporting concise CSS background rules with zero bloat.</p><h3>Preventing 'Muddy Gray Dead Zones' Between Hue Transitions</h3><p>Transitioning linearly in sRGB directly between saturated opposites—such as vivid cyan (<code>#06B6D4</code>) and bright coral (<code>#F43F5E</code>)—passes straight across desaturated muddy gray near the 50% midpoint. Dropping an intermediate hue stop (e.g., vibrant violet <code>#8B5CF6</code> at 50%) or adding CSS Level 4 <code>in oklch</code> color interpolation preserves vibrant luminosity across the entire blend.</p><h3>Practical UI Gradient Uses</h3><ul><li><strong>Subtle Hero Mesh &amp; Border Glows:</strong> Ultra-subtle 3%–8% lightness shifts elevate flat cards cleanly without distracting readers.</li><li><strong>Conic Progress Rings:</strong> Combine <code>conic-gradient()</code>
