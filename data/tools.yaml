    faqs:
    - q: How do I calculate how many classes I can safely bunk without dropping below 75%?
      a: Divide (100 × Attended − Target% × Held) by Target% and round down to the nearest whole number. For example, with 85 attended out of 100 lectures at a 75% rule, floor((8500 − 7500) ÷ 75) equals 13 safe bunks, keeping you at 75.22%.
    - q: How many classes must I attend continuously to reach 75% attendance?
      a: When below target, use ceil((Target% × Held − 100 × Attended) ÷ (100 − Target%)). For 60 attended out of 100 at 75%, you need ceil(1500 ÷ 25) = 60 consecutive classes, bringing you cleanly to 120 out of 160 (75.00%).
    - q: Does the attendance calculator support 65%, 80%, 85%, or 90% rules?
      a: Yes. Alongside the default 75% college threshold, quick target pills let you switch instantly to 65%, 80%, 85%, or 90%, or enter any custom requirement from 1% to 99%. A comparison matrix displays your bunk cushion or shortfall across every rule at once.
