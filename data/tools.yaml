    - q: Is it better to shorten the mortgage term or lower monthly payments?
      a: Keeping the same required payment while overpaying (term reduction) saves significantly more interest and makes you mortgage-free years earlier.
    - q: 'Monthly overpayment vs annual lump sum: which saves more?'
      a: Overpaying earlier and more frequently saves slightly more because principal drops right away instead of accruing extra months of daily or monthly interest.
