      desc: Copy the generated @keyframes rule and animation property with one click. Paste directly into your stylesheet.
    howto_calculate: <p>The CSS Animation Generator creates standard CSS <code>@keyframes</code> rules by interpolating the user's per-stop property values. Each keyframe stop is formatted with its percentage, and the property values are serialized into proper CSS declarations (transform functions, color, border-radius, filter, opacity). The animation shorthand is assembled from the timing panel values (duration, easing, delay, iteration, direction, fill mode). The preview uses the browser's native CSS animation engine for pixel-perfect, real-time playback.</p>
    about_title: About the CSS Animation Generator
    about_body: <p>The CSS Animation Generator is a free online tool for creating, previewing, and exporting CSS @keyframes animations. Use the visual timeline to add and arrange keyframe stops, then set per-stop properties — opacity, translateX/Y, rotate, scaleX/Y, background-color, border-radius, and CSS filter effects. Configure timing, delay, iteration count, direction, fill mode, and easing (including custom cubic-bezier curves).</p><p>Choose from 8 curated presets (Fade In, Slide Up, Bounce, Pulse, Shake, Spin, Wiggle, Flip) to get started quickly, then fine-tune individual values. The live preview loops your animation in real-time on a configurable background (light, dark, gradient, or checkerboard).</p><p>Built with privacy in mind, all processing happens directly in your browser. No sign-up required, no data stored, no tracking. Simply open the tool, create your animation, and copy the ready-to-use CSS code.</p>
