  sip-calculator:
    name: SIP Calculator
    icon: trending-up
    category: Calculators
    description: Calculate mutual fund SIP growth, invested total and maturity value with expected returns, step-up, inflation adjustment and year-wise projections. Free.
    keywords:
    - free sip calculator online
    - sip calculator with step up india
    - sip maturity estimator monthly online
    - sip calculator no signup free
