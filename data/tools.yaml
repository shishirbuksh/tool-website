    sitemap_priority: 0.9
    date_modified: '2026-10-02'
    faqs:
    - q: What is MRR (Monthly Recurring Revenue) and how is it calculated?
      a: MRR equals your active paying customers multiplied by average monthly recurring revenue per user (ARPU), normalized to a monthly basis—excluding one-time setup fees.
    - q: How do Net New MRR and SaaS Quick Ratio work?
      a: Net New MRR = New MRR + Expansion MRR − Churned/Contraction MRR. Dividing (New + Expansion) by Churned MRR gives your Quick Ratio, where 4+ signals strong capital-efficient growth.
    - q: How is ARR derived from MRR for startup valuation?
      a: Multiply ending Monthly Recurring Revenue by 12 to get Annual Recurring Revenue (ARR), the baseline SaaS valuation and growth multiple benchmark.
    - q: What is a healthy monthly logo and revenue churn rate for SaaS?
      a: Enterprise B2B SaaS targets under 1% monthly churn, while SMB SaaS often sits around 3%–5% unless expansion upgrades create net-negative dollar churn.
    - q: Is the MRR Calculator free with no signup?
      a: Yes. Model unlimited SaaS cohorts, churn sensitivities, and 12-month MRR charts directly in your browser without registering.
    - q: Are my startup revenue metrics kept private?
      a: Yes. All SaaS revenue and customer figures calculate solely in browser JavaScript and are never uploaded or saved remotely.
    howto_steps:
    - title: Enter Customer Data
      desc: Type your current customer count, ARPU, and monthly churn rate.
    - title: Add Growth Drivers
      desc: Enter new customers per month, expansion rate (upsells), contraction rate (downgrades), and gross margin.
    - title: Compare Scenarios
      desc: Try Steady, Growth, or Hypergrowth presets. Export the monthly projection table as CSV.
    howto_calculate: '<p>The calculator computes: <strong>Gross MRR = Customers x ARPU</strong>, <strong>Net New MRR = New MRR + Expansion MRR − Churned MRR − Contraction MRR</strong>, <strong>Net MRR = Gross MRR x Gross Margin</strong>, and <strong>Quick Ratio = (New + Expansion) / (Churned + Contraction)</strong>. The projection applies these rates iteratively each month, compounding growth and churn over time.</p><p>All calculations run in your browser — no data is sent to any server.</p>'
    about_title: About the MRR Calculator
    about_body: '<p>The <strong>SaaS MRR &amp; ARR Calculator</strong> breaks Monthly Recurring Revenue into New, Expansion, Contraction, and Churned MRR movements, computing Net MRR Growth, Annual Recurring Revenue (ARR = MRR &times; 12), and Net Revenue Retention (NRR) hints.</p><h3>Worked SaaS Cohort Example: Churn Drag vs. Expansion</h3><p>Imagine starting the month at <strong>$80,000 MRR</strong> (400 customers &times; $200 ARPU). Adding 30 new accounts adds <strong>+$6,000 New MRR</strong> and upgrades add <strong>+$2,400 Expansion MRR</strong>, while 12 cancellations remove <strong>-$2,400 Churned MRR</strong> and downgrades remove -$600. <strong>Net New MRR is +$5,400</strong>, finishing at <strong>$85,400 MRR ($1.025M ARR)</strong>—showing how 3% monthly logo churn consumes 40% of hard-won new sales.</p><h3>MRR Accounting Discipline for Clean Reporting</h3><ul><li><strong>Exclude One-Time Setup Fees:</strong> Implementation fees, consulting, and hardware sales inflate MRR artificially
      and confuse investors.</li><li><strong>Prorate Annual Contracts by 1/12:</strong> A $1,200 annual subscription counts as $100/month MRR, never $1,200 in closing month.</li><li><strong>Track Expansion Separately:</strong> Healthy B2B SaaS offsets logo churn through seat or usage expansion (NRR &gt; 105%).</li></ul>'
