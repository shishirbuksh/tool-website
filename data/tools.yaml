      a: Select an HTTP method (GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS), enter a URL, add optional headers and body, then click Send or press Ctrl+Enter. The response status, headers, and body are displayed below.
    - q: What HTTP methods are supported?
      a: GET, POST, PUT, PATCH, DELETE, HEAD, and OPTIONS. The body section is hidden for GET and HEAD requests since they don't support request bodies.
    - q: How do auth presets work?
      a: Open the Authentication section and select Basic Auth, Bearer Token, or API Key. Fill in the credentials and they automatically populate the Authorization header. Switch back to None to remove auth headers.
    - q: How do I save and reload requests?
      a: Click the Save button next to Send to save the current request with a name. Switch to the Saved tab to browse, load, or delete saved requests. You can also Export all as JSON and Import collections.
    - q: Can I generate code from my request?
      a: Yes. Click the Code button next to Send to open the code snippet generator. Choose from cURL, Python (requests), or JavaScript (fetch). Copy the generated code with one click.
    - q: How do I add custom headers?
      a: Click the + Add Header button below the Headers section. Enter the header name (e.g., Authorization) and value (e.g., Bearer token). Default headers Content-Type and Accept are pre-filled.
    - q: What request body types are supported?
      a: JSON (auto-formatted), Form Data (key-value pairs converted to URL-encoded format), Text (raw text), and None (no body). Select the type from the Body dropdown.
    - q: How do I add query parameters?
      a: Open the Query Parameters section. Add key-value pairs and they are automatically appended to the URL.
    - q: Is there a request history?
      a: Yes. Switch to the History tab to see past requests with method, URL, status, and response time. Click any entry to replay it. History is stored in your browser (localStorage) and persists across sessions.
    - q: How do I export the current request as a cURL command?
      a: Click the cURL button in the response toolbar to copy the current request as a cURL command to your clipboard.
