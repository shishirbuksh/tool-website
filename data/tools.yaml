    about_title: About the International GPA & German Bavarian Grade Converter
    about_body: "<p>The International GPA &amp; German Grade Converter works as a complete <strong>10 point CGPA to 4.0 GPA calculator</strong> and <strong>CGPA to German grade uni assist calculator</strong> for study-abroad applicants targeting Germany, the United States, Canada, the UK, Europe, and Australia.</p> <h3>Study-Abroad Grading Engines Included</h3> <ul>\n  <li><strong>German Grade Calculator Bavarian Formula:</strong> Computes exact German 1.0–5.0 scores from 10-point CGPA, percentage, US 4.0 GPA, or any international Nmax/Nmin grading system—plus a reverse solver for target admission cutoffs.</li>\n  <li><strong>WES 4.0 GPA Calculator Indian Transcript &amp; Percentage to 4.0 GPA Converter:</strong> Compares direct proportional scaling <code>(CGPA ÷ 10) × 4</code> against credit-weighted US subject grade equivalents (<code>4.0 / 3.7 / 3.3 / 3.0</code>) across up to 15 courses.</li>\n  <li><strong>Indian CGPA to Canadian 4.33 GPA Calculator &amp; UK Honours Grade Converter from\
      \ CGPA:</strong> Simultaneously displays Canadian A+ (4.33/4.0) scales and UK First Class / Upper Second (2:1) degree classifications alongside Australian 7-point GPA.</li>\n  <li><strong>ECTS to 4.0 GPA Converter Online &amp; University Percentage Toggle:</strong> Shows European ECTS A–F labels side by side and lets you apply CBSE (×9.5), VTU/MAKAUT (C − 0.75) × 10, Mumbai University (7.1C + 11), GTU, or SPPU formulas first.</li>\n</ul> <h3>10-Point CGPA to German Bavarian &amp; International Scale Reference (Nmin = 4.0)</h3> <table class=\"table\">\n  <thead>\n    <tr><th>10-Point CGPA</th><th>German Bavarian Grade</th><th>German Standing</th><th>US 4.0 (Proportional / WES Est.)</th><th>UK Honours</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>9.5 / 10</td><td>1.25</td><td>Sehr gut (Very Good)</td><td>3.80 / 4.00</td><td>First Class (1st)</td></tr>\n    <tr><td>9.0 / 10</td><td>1.50</td><td>Sehr gut (Very Good)</td><td>3.60 / 4.00</td><td>First Class (1st)</td></tr>\n    <tr><td>8.5\
      \ / 10</td><td>1.75</td><td>Gut (Good)</td><td>3.40 / 4.00</td><td>First Class (1st)</td></tr>\n    <tr><td>8.0 / 10</td><td>2.00</td><td>Gut (Good)</td><td>3.20 / 4.00</td><td>First Class (1st)</td></tr>\n    <tr><td>7.0 / 10</td><td>2.50</td><td>Gut (Good)</td><td>2.80 / 4.00</td><td>First / Upper Second</td></tr>\n    <tr><td>6.0 / 10</td><td>3.00</td><td>Befriedigend (Satisfactory)</td><td>2.40 / 3.30</td><td>Upper Second (2:1)</td></tr>\n  </tbody>\n</table> <p>Prepare your complete application inside our <a href=\"/student-tools\">Student Hub</a> alongside the <a href=\"/tool/cgpa-percentage-calculator\">CGPA &amp; SGPA Converter</a>, <a href=\"/tool/passing-marks-calculator\">Passing Marks Calculator</a>, <a href=\"/tool/marks-percentage-calculator\">Marks Percentage Calculator</a>, <a href=\"/tool/attendance-calculator\">75% Attendance Calculator</a>, and <a href=\"/tool/word-counter\">Essay &amp; SOP Word Counter</a>.</p>"
