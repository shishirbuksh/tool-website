    about_title: About the Crypto Trend Analyzer
    about_body: <p>The <strong>Crypto Trend Analyzer</strong> combines 7-day and 30-day momentum shifts, moving-average crossovers, volume context, and sentiment weighting into a single structured educational scorecard.</p><h3>Why Multi-Timeframe Momentum Beats Single-Candle Noise</h3><p>Evaluating a 7-day bounce in isolation frequently misreads dead-cat rallies inside broader 30-day downtrends. Pairing 7-day velocity with 30-day trend direction, volume confirmation, and aggregate Fear &amp; Greed reading reveals whether buying volume actually supports price expansion or whether thin weekend liquidity is exaggerating short-term moves.</p><h3>Boundaries of Momentum &amp; RSI Scoring</h3><ul><li><strong>Lagging Nature of Averages:</strong> Moving-average crossovers confirm established shifts rather than predicting inflection tops or bottoms.</li><li><strong>Overbought Persistence:</strong> During strong inflows, assets can stay above standard RSI 70 thresholds for weeks without immediately
      reversing.</li><li><strong>Independent Risk Controls:</strong> Never size positions from an automated trend index without explicit stop-loss liquidity and macro awareness.</li></ul><h3>Why Multi-Timeframe Confluence Filters Noise</h3><p>A golden cross on a 15-minute chart frequently triggers whipsaw losses if daily and weekly trend structure still points downward. Always align shorter tactical momentum indicators against higher-timeframe support and volume profile shifts.</p>
