    about_body: <p>The <strong>Cryptographic Hash Generator (MD5, SHA-1, SHA-256, SHA-512)</strong> generates instant deterministic lowercase/uppercase hexadecimal digests from UTF-8 text or local files for release checksum verification, SRI integrity, and webhook HMAC troubleshooting—entirely offline via browser Web Crypto.</p><h3>Choosing the Right Hash Function &amp; Security Boundaries</h3><p>A cryptographic hash produces a fixed-length fingerprint—256 bits (64 hex chars) for <strong>SHA-256</strong>, 512 bits for <strong>SHA-512</strong>—where changing a single comma produces a completely unrelated digest (the avalanche effect). Use <strong>SHA-256 or SHA-512</strong> for software release checksums and TLS verification; treat legacy <strong>MD5 (128-bit)</strong> and <strong>SHA-1 (160-bit)</strong> purely as backward-compatible non-cryptographic file identifiers, as practical collision attacks broke both years ago.</p><h3>Password Storage Warning</h3><ul><li><strong>Never Hash Passwords
