    - q: When should a startup trigger cost cuts to hit Default Alive?
      a: Paul Graham's Default Alive test compares current revenue growth rate against current net expenses; if projected revenue crosses expenses before cash hits zero with a 6-month buffer, you do not strictly need outside capital to survive.
    - q: How many months of runway do venture investors expect after a round?
      a: Most seed and Series A plans target 18 to 24 months of net runway so the company has 12–15 months to build metrics before spending 4–6 months raising the next round.
