    about_title: About the Page Grader
    about_body: '<p>The <strong>HTML Page SEO Grader &amp; Technical Audit Tool</strong> scores pasted page HTML or markup fields across 6 weighted pillars: Meta Tags (20%), Content Structure (25%), Readability (15%), Headings Hierarchy (15%), Links/Anchor Text (10%), and Image Alt Attributes (15%).</p><h3>How Weighted On-Page Audits Spot Silent Ranking Blockers</h3><p>Even deeply researched articles bleed organic impressions when simple markup defects ship to production: duplicate or skipped <code>&lt;h1&gt;</code> &rarr; <code>&lt;h3&gt;</code> heading jumps, empty image <code>alt=""</code> attributes on explanatory charts, generic <em>''click here''</em> internal links, or thin 160-word bodies missing canonical links. Checking raw HTML catches template bugs before indexing.</p><h3>Using Pasted Markup Scores Wisely</h3><ul><li><strong>Inspect Rendered Output Too:</strong> Compare final DOM HTML in browser DevTools if your frontend injects meta tags dynamically via JavaScript.</li><li><strong>Fix
