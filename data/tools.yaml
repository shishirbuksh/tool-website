    about_title: About the CSS Box Shadow Generator
    about_body: <p>The <strong>CSS Box Shadow Generator</strong> builds crisp multi-layer elevation shadows using live X/Y offsets, blur radius, spread radius, RGBA tinting, and optional <code>inset</code> inner bevels—exporting clean cross-browser CSS declarations.</p><h3>Why Layered Shadows Look Cleaner Than Single Heavy Shadows</h3><p>A single <code>0 20px 40px rgba(0,0,0,0.4)</code> shadow often looks muddy and pasted-on. Real optical lighting pairs a tight contact ambient shadow (e.g., <code>0 1px 3px rgba(15,23,42,0.08)</code>) with a wider diffused directional layer (<code>0 12px 24px -6px rgba(15,23,42,0.12)</code>) using negative spread to narrow lateral bleed while feeling grounded on white or tinted cards.</p><h3>Performance Notes for Interactive Interfaces</h3><ul><li><strong>Avoid Animating Large Blur Shadows Directly:</strong> Transitioning <code>box-shadow</code> triggers repaint cycles; animate opacity on a pre-shadowed <code>::after</code> pseudo-element for 60fps hover
