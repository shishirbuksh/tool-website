    faqs:
    - q: How does the Page Grader work?
      a: You enter a URL and optional target keyword. The tool fetches the page's HTML via a secure proxy and analyzes meta tags, content, readability, heading structure, technical SEO elements, and links. Each category gets a score (0-100), weighted into a total grade.
    - q: Is my URL stored or logged?
      a: No. The page is fetched server-side through a security-filtered proxy that blocks private IPs and caps response size. No data is logged, stored, or shared. All scoring happens in your browser.
    - q: What checks does the grader run?
      a: '20+ checks across 6 categories: Meta Tags (title, description, OG, Twitter cards), Content (word count, keyword usage), Readability (FKGL score, sentence length, passive voice), Structure (heading hierarchy, image alt texts), Technical (page size, schema.org, viewport), and Links (internal/external link balance).'
    - q: What is a good Page Grader score?
      a: 80-100 is excellent (green). 50-79 needs improvement (amber). 0-49 requires significant work (red). Each category shows individual scores so you know exactly what to fix.
    - q: Can I export the report?
      a: Yes. Use the Print button to generate a printer-friendly report, or save as PDF from your browser's print dialog.
    howto_steps:
    - title: Enter a URL
      desc: Paste the full URL (including https://) of the page you want to grade.
    - title: Add a Keyword (Optional)
      desc: Enter your target keyword to check keyword placement and density.
    - title: Click Analyze
      desc: The tool fetches the page and runs 20+ SEO checks across 6 categories.
    - title: Review Your Score
      desc: Check your overall score (0-100) and grade (A-F), plus each category breakdown.
    - title: Fix Issues
      desc: Expand each category to see specific pass/warning/fail checks with actionable guidance.
    - title: Export the Report
      desc: Click Print / PDF to generate a clean report for sharing or record-keeping.
    about_title: About the Page Grader
    about_body: <p>The Page Grader is a comprehensive on-page SEO scoring tool that analyzes any webpage against 20+ best-practice checks. It gives you a single score from 0-100 so you can quickly assess how well a page is optimized.</p> <p>Unlike subscription-based SEO tools that cost $99+/month, this grader is completely free and private. All processing happens in your browser after the page HTML is fetched through a secure proxy.</p> <p>Use it to audit your own content before publishing, check competitor pages for benchmarking, or generate client-ready reports with the PDF export feature.</p>
    related_slugs:
    - serp-preview-meta-analyzer
    - social-media-post-preview
    - seo-writing-assistant
    - keyword-data-analyzer
    - meta-tag-generator
    howto_calculate: 'The overall score is a weighted average of 6 categories: Meta Tags (20%), Content (25%), Readability (15%), Structure (20%), Technical SEO (10%), and Links (10%). Each category score is calculated from individual checks that are graded pass, warning, or fail. The readability score uses the Flesch-Kincaid Grade Level formula: 0.39 &times; (words &divide; sentences) + 11.8 &times; (syllables &divide; words) &minus; 15.59.'
