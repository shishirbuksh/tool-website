    faqs:
    - q: How many marks are needed in an external exam out of 70 to pass AKTU?
      a: Most AKTU ordinances require a separate minimum of 30% in the external paper (21 out of 70) plus at least 40% combined across internals and externals (40 out of 100). If your internal score is 18 out of 30, you need max(21, 40 − 18) = 22 out of 70 in externals.
    - q: What is the VTU internal and external passing marks rule under 50 + 50 schemes?
      a: Visvesvaraya Technological University (VTU) schemes evaluate Continuous Internal Evaluation (CIE out of 50) and Semester End Exam (SEE out of 50). Students typically must satisfy the separate CIE minimum (40% = 20/50), SEE minimum (35% = 18/50), and overall 40% aggregate (40/100).
    - q: How does Mumbai University 20 + 80 passing rule work?
      a: Mumbai University CBCS courses require clearing both components independently—at least 40% in internals (8 out of 20) and 40% in the semester-end external paper (32 out of 80)—so high internal scores cannot compensate for scoring below 32 in the external exam.
    - q: How are CBSE Class 10 and Class 12 passing marks calculated for theory and practical?
      a: CBSE Class 10 requires an overall combined 33% aggregate across 80 theory + 20 internal marks (33/100 total), whereas CBSE Class 12 requires passing theory and practical/internal individually with 33% in each part (24/70 theory and 10/30 practical for science subjects).
    - q: Why do dual passing rules say Internal Short even when I could pass overall?
      a: Universities with separate CIE minimums (such as VTU 20/50, SPPU 12/30, or Mumbai University 8/20) disqualify students whose internal marks fall below the internal floor, regardless of how high they score in the external paper.
    - q: Can I plan passing requirements across all subjects in my semester at once?
      a: Yes. Switch to the Semester Subject Planner tab, enter your internal marks for up to 10 subjects, and immediately see the exact minimum external score required to clear every subject under your selected rule.
    - q: Can I calculate the percentage required on a weighted final exam for a target course grade?
      a: Yes. Open the Weighted Final % Target tab, input your current coursework percentage, your final exam weight (for example 60%), and your desired course percentage to see the exact final exam score needed for 50%, 60%, 70%, 80%, and 90% grades.
