      a: Mumbai University CBCS courses require clearing both components independently—at least 40% in internals (8 out of 20) and 40% in the semester-end external paper (32 out of 80)—so high internal scores cannot compensate for scoring below 32 in the external exam.
    - q: How are CBSE Class 10 and Class 12 passing marks calculated for theory and practical?
      a: CBSE Class 10 requires an overall combined 33% aggregate across 80 theory + 20 internal marks (33/100 total), whereas CBSE Class 12 requires passing theory and practical/internal individually with 33% in each part (24/70 theory and 10/30 practical for science subjects).
    - q: Why do dual passing rules say Internal Short even when I could pass overall?
