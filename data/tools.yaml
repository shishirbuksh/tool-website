    faqs:
    - q: How does annual contribution escalation grow a retirement balance?
      a: Automatically increasing monthly deposits by 2%–5% each year lets savings rise alongside career raises, compounding heavier contributions during middle earning decades without cutting year-one take-home cash.
    - q: What is the 4% Safe Withdrawal Rule and when should it be lower?
      a: Derived from the Trinity Study for 30-year retirements, withdrawing 4% of day-one portfolio value (adjusted yearly for inflation) historically survived 95%+ of 30-year periods; early retirees (40–50 year horizons) often use 3.25%–3.5%.
    - q: Should I model pre-inflation or inflation-adjusted investment returns?
      a: If entering a nominal 8% market return, deduct ~2.5%–3% inflation to inspect ~5% real returns so final nest-egg numbers match today's grocery and housing purchasing power.
    - q: Does this retirement model include Social Security or state pensions?
      a: This estimator models personal investment compounding independently; add guaranteed pension/Social Security payouts mentally to calculate net portfolio drawdown needed.
