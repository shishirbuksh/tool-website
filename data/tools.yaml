      a: A crypto portfolio analyzer helps you track all your cryptocurrency holdings in one place. You enter each asset, its amount, buy price, and current price to see your total invested value, current value, profit or loss, and allocation percentages.
    - q: How do I calculate crypto P&L?
      a: P&L (Profit and Loss) is calculated as (current price - buy price) × amount held. A positive number means profit, negative means loss. This tool also shows total portfolio P&L and percentage return.
    - q: What is allocation percentage?
      a: Allocation percentage shows how much of your total portfolio value each cryptocurrency represents. For example, if Bitcoin is 60% of your portfolio value and Ethereum is 20%, those are your allocation percentages.
    - q: Why is diversification important in crypto?
      a: Crypto markets are highly volatile. Diversifying across different assets reduces your risk because losses in one coin may be offset by gains in another. A balanced portfolio typically includes 5-10 different assets.
    - q: How often should I update my portfolio?
      a: You should update your portfolio whenever you buy or sell crypto. Reviewing your P&L and allocation monthly helps you stay on top of your investments and make informed rebalancing decisions.
    - q: Where does the Crypto Portfolio Analyzer get its data?
      a: No live feed required unless you refresh quotes. The analyzer weights the holdings and cost basis you add, so allocation mirrors your own books. All math runs in your browser and nothing uploads.
    - q: How accurate are the predictions?
      a: Summaries organize YOUR holdings with transparent allocation math, not market forecasts. Rebalance views update as you edit. Educational tracking only, never financial advice.
