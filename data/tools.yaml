    name: Profit Margin Calculator
    icon: calculator
    category: Calculators
    description: Calculate gross profit, margin, markup, and selling price from cost and revenue. Built for retail and e-commerce. Free, no sign-up. VAT-ready outputs included.
    keywords:
    - free profit margin calculator online
