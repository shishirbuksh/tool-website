    - q: How is e-Way Bill validity calculated from distance in km?
      a: For non-ODC cargo, GST rules grant 1 day of validity for up to 200 km of travel distance, plus 1 additional day for every subsequent 200 km or part thereof.
    - q: When is generating a GST e-Way Bill mandatory?
      a: An e-Way Bill is generally required whenever goods valued above ₹50,000 move inter-state (or above state-specific intra-state thresholds) by motorized conveyance.
    - q: What is the difference between Part-A and Part-B validity?
      a: Part-A logs consignment/invoice value details (valid 15 days before transport starts), while full validity clock begins once Part-B vehicle details are updated.
    - q: When can an active e-Way Bill be extended before expiry?
      a: Transporters can extend validity within 8 hours before or 8 hours after expiry from the GST portal if cargo remains in transit due to unavoidable delays.
    - q: Are over-dimensional cargo (ODC) or multimodal rules supported?
      a: Yes. Switch transport mode to compare regular road/rail/air 200-km/day slabs against specialized 20-km/day ODC validity calculations.
