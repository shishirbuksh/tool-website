    - q: How do lenders determine how much loan I can afford?
      a: Lenders evaluate your gross monthly income, existing monthly debt obligations, credit tier, down payment, and debt-to-income (DTI) caps—commonly 36% to 43%.
    - q: What is the 28/36 housing affordability rule?
      a: It suggests keeping housing costs (principal, interest, taxes, insurance) at or under 28% of gross monthly pay, and total debt payments under 36%.
    - q: How does increasing my down payment raise borrowing power?
      a: A larger down payment shrinks your loan principal, reduces monthly payments, and eliminates private mortgage insurance (PMI) once equity hits 20%.
    - q: Does this calculator include property taxes, insurance, and PMI?
      a: Yes. Include tax, home insurance, and PMI inputs to see a realistic all-in monthly housing payment alongside max loan principal.
    - q: Should I borrow the maximum amount a lender pre-approves?
      a: Usually no—leave monthly breathing room in your budget for property taxes, maintenance repairs, insurance premiums, savings goals, and unexpected income changes.
    - q: Is any financial data sent to a server when I calculate?
      a: No. Your income, recurring debt obligations, interest rate, and down payment numbers stay 100% private inside your browser with zero server storage.
