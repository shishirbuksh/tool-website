    name: International GPA & German Grade Converter
    title: CGPA to 4.0 GPA & German Grade Converter — Bavarian, WES, UK, ECTS
    meta_title: 10-Point CGPA to 4.0 GPA & German Grade Calculator
    description: Convert 10-point Indian CGPA or percentage into German grade (Modified Bavarian Formula for uni-assist), US 4.0 WES GPA, Canada 4.33, UK Honours & ECTS.
    category: Calculators
