    - q: How does the AI Text Summarizer work?
      a: It uses TextRank, a graph-based ranking algorithm. Each sentence is scored based on its similarity to all other sentences, and the most central sentences are selected. Everything runs in your browser.
    - q: Is my text sent to any server?
      a: No. All processing happens entirely in your browser. Your text is never uploaded, stored, or transmitted. You can work completely offline after the page loads.
    - q: Can I manually choose which sentences to include?
      a: Yes. After summarizing, open the Sentence Ranking panel. Every sentence is listed with its TextRank score. Check or uncheck sentences to customize the summary in real time.
    - q: What summarization modes are available?
      a: 'Three modes: Short (2-3 key sentences), Medium (paragraph-length summary, ~25% of original), and Detailed (bullet-point summary, ~40% of original).'
    - q: Can I control the summary length?
      a: Yes. In Medium mode, use the compression slider to adjust the summary from 10% to 50% of the original text length. You can also fine-tune by toggling individual sentences in the Sentence Ranking panel.
    - q: What is TextRank?
      a: TextRank is a graph-based ranking algorithm inspired by Google's PageRank. It builds a graph where sentences are nodes and similarity scores are edges, then iteratively computes which sentences are most central to the text.
    - q: What is the maximum text length?
      a: You can summarize up to 5,000 characters per session. There are no daily limits and no sign-up required.
    - q: Can I copy or export the summary?
      a: Yes. Click the Copy button to copy the summary to your clipboard. Export as .txt or .doc file.
