    howto_calculate: '<p>The tool builds text gradients by combining <code>background: linear-gradient(...)</code> with <code>background-clip:text</code>, <code>-webkit-background-clip:text</code>, <code>color:transparent</code> and <code>-webkit-text-fill-color:transparent</code>. The background paints the gradient box, background-clip clips it to the glyph shapes, and transparent fill lets the gradient show through the letters.</p>'
    about_title: About the CSS Gradient Text Generator
    about_body: '<p>The <strong>CSS Gradient Text Generator</strong> crafts multi-stop headline gradients powered by <code>background-clip: text</code> and <code>-webkit-background-clip: text</code> paired with safe transparent fill properties and accessible solid-color fallbacks.</p><h3>Why Gradient Text Fails Invisibly Without Proper Fallbacks</h3><p>Gradient headings work by painting a linear gradient behind the box, clipping it to glyph outlines via <code>-webkit-background-clip: text</code>, and turning ink transparent via <code>color: transparent</code> (or <code>-webkit-text-fill-color: transparent</code>). If applied on a wide block element (<code>width: 100%</code>) wrapping a short word, most of the gradient stretches off into blank whitespace! Setting <code>display: inline-block</code> ensures all color stops map tightly across the actual headline width.</p><h3>Accessibility &amp; Cross-Browser Reminders</h3><ul><li><strong>Every Stop Needs Contrast:</strong> Check both ends AND
      midpoints of your gradient against the page canvas so bright pastel middle stops stay legible.</li><li><strong>Reserve for Large Display Typography:</strong> Gradient fills read crisply at &ge; 28px bold weights; keep 14px–16px body prose in solid high-contrast ink.</li></ul><h3>Cross-Browser Safari &amp; Print Rendering Checks</h3><p>Always include a clean solid fallback <code>color</code> declaration ahead of transparent gradient fill properties, and consider resetting gradient headlines back to solid dark ink inside <code>@media print</code> stylesheets so printed PDFs never appear blank.</p>'
