    app_category: BusinessApplication
    sitemap_priority: 0.7
    date_modified: '2026-10-02'
    faqs:
    - q: How do you calculate break-even ROAS from product gross margin?
      a: Divide 1 by your gross margin percentage before ad spend (for example, a 40% margin yields 1 / 0.40 = 2.50x break-even ROAS).
    - q: Why can an ad campaign have a high CTR yet unprofitable CPA?
      a: Curiosity-bait headlines attract cheap clicks that bounce on the product page; CPA depends on both CPC and downstream checkout conversion rate (CPA = CPC / CVR).
    - q: What is the formula for CPM, CPC, and Conversion Rate?
      a: CPM = (Spend / Impressions) × 1,000; CPC = Spend / Clicks; Conversion Rate = (Conversions / Clicks) × 100.
    - q: Why evaluate Mer vs. Platform-Reported ROAS together?
      a: Ad platforms frequently overlap on view-through attribution; tracking total blended revenue against total ad spend catches inflated channel reporting.
    - q: Can agencies audit client exports here without OAuth logins?
      a: Yes. Paste raw spend, click, and revenue totals locally without exposing client Meta Business Manager or Google Ads credentials.
    - q: How does the what-if simulator test scaling budget safely?
      a: It adjusts target CPC or conversion rate incrementally so you see margin sensitivity before doubling daily ad spend.
    howto_steps:
    - title: Enter campaign data
      desc: Fill in your ad spend, impressions, clicks, conversions, and revenue from your ad platform.
    - title: Review health scores
      desc: Each metric shows a Good/Fair/Poor badge based on industry benchmarks.
    - title: Check campaign health
      desc: The overall health score gives you a quick snapshot of your campaign performance.
    - title: Use the simulator
      desc: Adjust the budget slider to see how changes in spend might affect your key metrics.
    - title: Optimize your campaigns
      desc: Focus on improving metrics with Poor ratings first for the biggest impact.
    - title: Enter Campaign Metrics
      desc: Type your ad spend, impressions, clicks, and conversions into the input fields.
    - title: Review ROAS and Funnel
      desc: See ROAS, CTR, CPC, CPA, and conversion rates update instantly, with a funnel view from impressions to conversions.
    - title: Optimize Spend
      desc: Adjust budgets or bids and compare scenarios to find the spend level that maximizes ROAS while keeping CPA on target.
    howto_calculate: All metrics are derived from your inputs. CTR = clicks / impressions. CPC = spend / clicks. CPM = spend / impressions x 1000. CPA = spend / conversions. ROAS = revenue / spend. Conversion rate = conversions / clicks. Health scores compare each metric against industry benchmarks.
    about_title: About the Ad Performance Analyzer
    about_body: '<p>The <strong>Ad Performance Analyzer</strong> audits paid search, Meta, TikTok, and display campaigns from raw spend, impressions, clicks, conversions, and attributed revenue—computing CTR, CPC, CPM, CPA, CVR, and break-even ROAS inside your browser.</p><h3>Worked Unit Economics Example: 3.5x Headline ROAS vs. Real Profit</h3><p>Suppose an ecommerce campaign spends <strong>$2,000</strong> across 100,000 impressions, generating 2,500 clicks (<code>2.5% CTR</code>, <code>$0.80 CPC</code>, <code>$20 CPM</code>) and 70 orders (<code>2.8% CVR</code>, <code>$28.57 CPA</code>) totaling $7,000 revenue (<strong>3.5x ROAS</strong>). If product COGS, shipping, and payment fees consume 65% of revenue (leaving a 35% gross margin), break-even ROAS equals <code>1 / 0.35 = 2.86x</code>—meaning 3.5x generates <code>($7,000 × 0.35) − $2,000 = $450</code> net contribution profit, while campaigns below 2.86x silently lose money despite looking positive on top-line revenue.</p><h3>Diagnosing
      Which Funnel Stage Is Leaking</h3><ul><li><strong>Low CTR (&lt;1% Search / &lt;0.8% Social):</strong> Creative fatigue, weak hook, or overly broad keyword match is driving high CPM without qualified clicks.</li><li><strong>Strong CTR + High CPA:</strong> Ad promise mismatches landing-page pricing, mobile page speed lags, or checkout friction drops conversion rate below 1.5%.</li></ul>'
