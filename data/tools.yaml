    - q: Why does a 20% drop followed by a 20% increase leave less than the original value?
      a: The 20% gain applies to a smaller 80% base (80 × 1.20 = 96), leaving a 4% net shortfall; recovering a 20% loss requires a +25% gain.
    - q: What is the difference between percentage change and percentage points?
      a: Moving from 10% to 15% is a +5 percentage point shift (arithmetic difference), which represents a +50% relative percentage increase ((15 - 10) / 10).
    - q: How do I reverse-calculate a pre-tax price from a tax-inclusive total?
      a: Divide the final amount by (1 + tax rate as decimal). For example, to strip 15% tax from $115, compute 115 / 1.15 = $100 pre-tax, rather than multiplying 115 by 0.85.
    - q: Does the calculator handle negative baselines in percent-change mode?
      a: Standard percentage change divides by |A| (absolute baseline) or flags zero baselines explicitly to prevent division-by-zero confusion.
