    about_title: About the CSS Animation Generator
    about_body: '<p>The <strong>CSS Animation &amp; @keyframes Generator</strong> previews fade, slide, bounce, pulse, spin, and custom Bezier easing animations visually and generates production-ready <code>@keyframes</code> CSS with duration, delay, direction, fill-mode, and iteration controls.</p><h3>GPU-Composited Properties vs. Layout-Thrashing Mistakes</h3><p>Animating layout geometry such as <code>top</code>, <code>left</code>, <code>width</code>, or <code>margin</code> forces the browser to recompute document layout every frame (16.6 ms budget), causing visible stutter on mid-tier phones. Restricting keyframes to compositor-friendly <code>transform</code> (<code>translate3d</code>, <code>scale</code>, <code>rotate</code>) and <code>opacity</code> keeps motion locked at 60–120fps on GPU layers.</p><h3>Accessibility &amp; Motion Hygiene</h3><ul><li><strong>Respect Reduced-Motion Users:</strong> Always wrap decorative motion inside <code>@media (prefers-reduced-motion: reduce)</code>
