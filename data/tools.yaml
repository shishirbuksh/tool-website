    about_body: '<p>The <strong>Browser Image Compressor (JPEG, WebP &amp; PNG)</strong> shrinks oversized camera photos and hero banners locally inside HTML5 Canvas—comparing original vs. compressed byte weight and visual clarity side-by-side before download.</p><h3>Worked Web Performance Example: Shrinking a 4.2 MB Phone Photo to 145 KB</h3><p>Upload a raw <strong>4032 &times; 3024 px iPhone JPEG (4.2 MB)</strong> straight into a blog post or job application portal and visitors burn megabytes waiting for Largest Contentful Paint (LCP). Limiting max edge width to <strong>1600 px</strong> and re-encoding as <strong>WebP at Quality 80</strong> cuts payload to roughly <strong>145 KB (96.5% smaller)</strong> while remaining visually indistinguishable at normal Retina viewing zoom.</p><h3>Choosing Quality Thresholds by Format</h3><ul><li><strong>WebP vs. JPEG at Q75–Q85:</strong> WebP typically delivers 25%–35% smaller files than baseline JPEG at equivalent SSIM visual quality while retaining
