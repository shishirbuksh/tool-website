    about_title: About the Password Generator
    about_body: '<p>The <strong>CSPRNG Password &amp; Passphrase Generator</strong> builds high-entropy random credentials using hardware-backed <code>window.crypto.getRandomValues()</code>—displaying true bits-of-entropy strength alongside Diceware-style readable options and ambiguous-character exclusion (<code>0/O</code>, <code>1/l/I</code>).</p><h3>NIST Entropy Reality: Why Length Beats Weird Substitutions</h3><p>Swapping <code>P@ssw0rd!</code> adds barely ~20 effective bits of crack resistance because modern GPU rule-lists try leetspeak instantly. By contrast, a truly random <strong>16-character mixed password</strong> spans <code>~104 bits</code> of uniform search space (<code>94^16</code> possibilities), and even an offline 100-billion-guess/sec rig would need trillions of years to exhaust. Following NIST SP 800-63B, prioritize <strong>length (16+ chars or 4–5 random words)</strong> paired with unique passwords stored per site inside a password manager.</p><h3>Zero-Exposure Guarantee</h3><ul><li><strong>Never
      Sent Over Wire:</strong> Generated keys originate solely inside your OS Web Crypto CSPRNG with zero server round-trips or analytics hooks.</li><li><strong>Exclude Lookalikes When Typing Manually:</strong> Toggle off <code>O/0/I/l/1</code> when provisioning Wi-Fi keys or recovery codes read aloud over calls.</li></ul><h3>Rotating Exposed Credentials Quickly</h3><p>Whenever a merchant breach compromises an old account, never recycle variations like appending <code>!2026</code> to the leaked password. Generate an entirely fresh 16-character random credential stored uniquely inside your password vault alongside MFA.</p>'
