    - title: Enter Income and Debts
      desc: Type monthly income, existing EMIs, interest rate and desired tenure in years.
    - title: Check Affordable EMI
      desc: See max EMI at the 40% income rule with safe borrowing range highlighted.
    - title: Derive Loan Principal
      desc: Review affordable house price and principal from salary with standard debt-to-income benchmarks.
    howto_calculate: <p>Max EMI equals <code>income × 0.40 − existing debts</code>. Principal inverts EMI math via <code>P = EMI × ((1+r)^n − 1) / (r × (1+r)^n)</code> with reducing balance. Lenders then apply FOIR haircuts, insurance and fees.</p>
    about_title: About the Loan Affordability Calculator
    about_body: '<p>The <strong>Loan Affordability &amp; Safe Borrowing Calculator</strong> inverts bank FOIR (Fixed Obligation to Income Ratio) and DTI underwriting rules—accounting for existing EMIs, interest rate, tenure, and down payment—to estimate your realistic sanction limit.</p><h3>Worked Underwriting Example: ₹1,20,000 Monthly Income With Car EMI</h3><p>Most banks cap total monthly debt EMIs near <strong>40%–45% of net monthly income</strong> (standard DTI ceiling). With <strong>₹1,20,000</strong> monthly take-home pay and an existing <strong>₹14,000 car EMI</strong>, a conservative 40% ceiling leaves <code>48,000 &minus; 14,000 = ₹34,000</code> in free EMI capacity. At <strong>8.75% over 20 years</strong>, ₹34,000/month supports roughly a <strong>₹38.48 lakh loan</strong>; adding a 20% down payment (₹9.62 lakh) places total affordable property value near <strong>₹48.1 lakh</strong>.</p><h3>Hidden Ownership Costs Banks Leave Out of Sanction Letters</h3><ul><li><strong>Stamp Duty,
      Registration &amp; Closing Fees:</strong> Keep 6%–9% cash liquid outside your down payment so closing doesn''t drain emergency savings.</li><li><strong>Property Taxes, HOA &amp; Repairs:</strong> Budget 1%–1.5% of home value annually for upkeep and community dues.</li><li><strong>Rate-Shock Stress Test:</strong> Verify you can comfortably pay EMI even if floating rates climb +1.5% above initial sanction.</li></ul>'
