    name: Crypto Password Generator
    icon: bitcoin
    category: AI & Crypto
    description: Generate cryptographically secure passwords and wallet keys with entropy controls, length options, strength meter and fully private local creation. No signup.
    keywords:
    - free crypto password generator online
    - how to make strong wallet password
    - random seed phrase safety tips
    - wallet password generator for crypto no signup
