    faqs:
    - q: What is a SHA-256 hash generator?
      a: A SHA-256 hash generator converts text into a fixed 64-character fingerprint. The same input always gives the same hash, while tiny changes create a completely different output for integrity checks.
    - q: How do I generate MD5 or SHA-1 checksums?
      a: Paste text into the input box, select MD5, SHA-1, SHA-256 or SHA-512, and the checksum appears instantly. Copy the result for records. Everything runs locally with no upload or account needed.
    - q: Can I verify file checksums online?
      a: Yes. Generate the hash of pasted text or checksum strings and compare with the publisher's published hash to confirm files are unchanged. For large private files, prefer local hashing without upload.
    - q: Is hashing my string private without upload?
      a: Yes. All calculations happen in your browser with JavaScript. Text never leaves your device and is never sent to any server, so passwords hash safely even offline after loading.
    - q: What is the SHA-256 vs MD5 speed difference?
      a: MD5 is faster with a shorter 32-character hash, while SHA-256 is slower but stronger at 64 characters. Use MD5 only for non-security fingerprints and SHA-256 or SHA-512 where safety matters more than speed.
    - q: How do I make a bulk hash list?
      a: Paste multiple lines with one string per line, then generate hashes for the whole list at once. Each input appears beside its hash for copying, useful for test data and checksum records.
