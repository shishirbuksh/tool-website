    about_title: About the Age Calculator
    about_body: <p>The <strong>Chronological Age Calculator</strong> computes exact age in years, months, and days—plus total weeks, hours, and days until your next birthday—for civil eligibility, passport applications, insurance underwriting, and school cutoff verification.</p><h3>Worked Calendar Example Across Unequal Month Lengths</h3><p>Suppose a person born on <strong>January 31, 2000</strong> checks their age on <strong>March 1, 2026</strong>. Because February 2026 has 28 days (not a leap year), advancing 26 full years reaches January 31, 2026, adding 1 calendar month reaches February 28, and adding 1 remaining day yields <strong>26 years, 1 month, 1 day</strong> (and 9,526 total elapsed days including leap days in 2000, 2004, 2008, 2012, 2016, 2020, and 2024).</p><h3>Gregorian Leap-Year &amp; Cutoff Rules Applied</h3><ul><li><strong>True Century Leap Rule:</strong> Years such as 2000 are leap years (divisible by 400), whereas 1900 and 2100 are common 365-day years.</li><li><strong>Exact
      'As-On' Date Selection:</strong> Swap Today's Date for any future civil-service or school admission cutoff date without manual day counting.</li><li><strong>Local UTC Date Math:</strong> Calculations avoid timezone-offset off-by-one shifts across DST transitions.</li></ul>
