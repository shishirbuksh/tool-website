      a: Investors typically view 3:1 (gross-margin LTV divided by fully loaded CAC) as healthy. Under 2:1 strains cash flow, while above 6:1 may signal under-investment in growth channels.
    - q: Why must CAC payback use Gross Margin instead of raw ARPU?
      a: Revenue alone ignores hosting, payment processing, and customer support costs; only gross profit dollars actually pay back upfront acquisition spend.
    - q: What expenses belong inside Fully Loaded CAC?
      a: Include ad media spend, marketing and sales salaries, bonuses/commissions, agency retainers, events, and prorated CRM/analytics software.
    - q: How do blended CAC and paid CAC differ?
      a: Blended CAC divides total spend by all new customers (organic + paid), whereas paid CAC isolates paid channels and direct media-driven signups so SEO volume does not mask weak ad performance.
