      desc: See BMI value, Prime, category, ideal-weight range and adult chart guidance.
    - title: Compare and plan
      desc: Adjust target weight to stay within healthy range and track changes over time.
    howto_calculate: <p>BMI equals weight in kg divided by height in meters squared. Imperial BMI equals 703 times weight in lb divided by height in inches squared. BMI Prime equals BMI divided by 25.</p>
    about_title: About the BMI Calculator
    about_body: <p>The <strong>BMI Calculator (Metric &amp; Imperial)</strong> computes Body Mass Index alongside standard WHO weight classifications, Asian-adult risk cutoffs, Healthy Weight Target Range for your height, and <strong>Waist-to-Height Ratio</strong> (when waist circumference is entered).</p><h3>Formula &amp; Worked Metric vs. Imperial Check</h3><p>Metric BMI computes <code>Weight (kg) &divide; Height (m)&sup2;</code>, while Imperial computes <code>703 &times; Weight (lb) &divide; Height (in)&sup2;</code>. An adult measuring <strong>1.75 m (5 ft 9 in) and weighing 70 kg (154 lb)</strong> records <code>70 &divide; 1.75&sup2; = 22.9 kg/m&sup2;</code>—right inside the WHO healthy window (18.5–24.9 kg/m&sup2;, corresponding to 56.7–76.3 kg at that height).</p><h3>Why Waist-to-Height Complements Raw BMI</h3><ul><li><strong>Muscle Mass Distortion:</strong> Resistance-trained athletes frequently score BMI 26–28 ('overweight') while maintaining low visceral body fat.</li><li><strong>Keep
      Waist Under Half Your Height:</strong> Clinical research highlights Waist-to-Height Ratio (&lt; 0.50) as a stronger metabolic and central-adiposity screen than weight alone.</li><li><strong>Clinical Notice:</strong> Standard adult BMI thresholds do not apply directly to pregnant individuals, growing children (who require CDC age/sex percentiles), or frail seniors.</li></ul>
