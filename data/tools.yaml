    about_title: About the Uuid Generator
    about_body: <p>The <strong>CSPRNG UUID v4 &amp; Time-Sorted UUID v7 Generator</strong> produces bulk RFC 9562 identifiers up to 500 IDs at a time in standard hyphenated, uppercase, stripped-hex, or JSON-array formats using browser hardware randomness—never weak <code>Math.random()</code> calls.</p><h3>When to Pick UUID v7 vs. Classic UUID v4 in Databases</h3><p>Classic random <strong>UUID v4</strong> scatters B-tree database inserts randomly across disk pages in PostgreSQL or MySQL, increasing write amplification at scale. Modern <strong>RFC 9562 UUID v7</strong> embeds a 48-bit millisecond Unix epoch timestamp in the leading 12 hex digits before adding 74 cryptographic random bits—preserving global uniqueness while letting indexed primary keys append sequentially like auto-incrementing integers.</p><h3>Security &amp; Export Options</h3><ul><li><strong>True Web Crypto Entropy:</strong> Uses OS-backed <code>window.crypto.getRandomValues()</code> so generated tokens never expose predictable
