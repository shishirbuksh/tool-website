    howto_calculate: <p><strong>Ensemble Blend:</strong> <code>Scenario(t) = w_Prophet × Prophet(t) + w_MLP × MLP(t)</code>, where slider weights sum to 100%. <strong>7D Delta:</strong> <code>((Scenario_day7 − Last_Close) / Last_Close) × 100</code>. Both sub-models fit strictly on historical OHLCV windows and carry wide variance during news-driven shocks.</p>
    about_title: About the Crypto Price Prediction
    about_body: <p>The <strong>Crypto Scenario Simulator</strong> lets students and quantitative hobbyists visualize how an additive time-series curve (Prophet) and a multi-layer perceptron (MLP) extrapolate recent 60-day closing history into a 7-day educational benchmark.</p><h3>Why Statistical Curve Fitting Is Not Price Prediction</h3><p>Adjusting the 0–100 ensemble slider blends linear/seasonal trend inertia (Prophet) against recent local pattern weights (MLP) over historical BTC, ETH, SOL, XRP, and DOGE series. While ensemble weighting helps demonstrate model disagreement—for example, a smoothed trend line sloping upward while a short-window neural sequence flattens—neither model reads order-book liquidity, central bank rate announcements, regulatory filings, or sudden liquidations.</p><h3>How Quantitative Volatility Ranges Work</h3><ul><li><strong>Square-Root-of-Time Scaling:</strong> Over a <code>t</code>-day horizon, realized uncertainty grows roughly with <code>daily_volatility ×
      √t</code>, widening rapidly over 7 days during macro catalysts.</li><li><strong>Educational Research Scope Only:</strong> Treat chart projections strictly as visual statistical demonstrations rather than buy/sell signals or profit promises.</li></ul><h3>Responsible Use of Extrapolative Curves</h3><p>Linear regression, exponential trendlines, and volatility cones cannot anticipate regulatory rulings, smart-contract exploits, or macroeconomic rate shocks. Treat plotted curves strictly as sensitivity scenarios to test upside/downside risk tolerance.</p>
