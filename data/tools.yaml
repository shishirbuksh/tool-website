  compound-calculator:
    name: Compound Calculator
    icon: layers
    category: Calculators
    description: Calculate compound interest growth with monthly contributions. Year-by-year table, milestones, and What-If scenarios. Free, no sign-up. Watch interest snowball.
    keywords:
    - free compound interest calculator online
    - compound growth monthly deposit estimator
    - compound calculator no signup free
    - lumpsum growth simulator online
