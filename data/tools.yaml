      a: 'It uses two phases: an accumulation phase (from your current age to retirement age) where contributions and compound growth build your nest egg, and a drawdown phase (retirement onward) where monthly withdrawals reduce the balance while remaining funds continue to grow.'
    - q: What is contribution escalation?
      a: Contribution escalation lets you specify a yearly percentage increase to your monthly deposits. This models expected salary increases over your career so contributions grow with your income.
    - q: How does Social Security factor in?
      a: You can toggle Social Security on, enter your estimated monthly benefit, and set the age you plan to start collecting. The tool adds this income during the drawdown phase, reducing how much you need to withdraw from savings.
    - q: What does 'Funds Last' mean?
      a: It shows how many years your retirement savings will last given your desired monthly income. If the duration is shorter than your life expectancy, you may need to save more, retire later, or reduce your goal income.
    - q: What is Monte Carlo simulation?
      a: Monte Carlo runs 2000 simulations where each year's return is randomly varied based on your expected return and volatility. The result shows the probability your plan succeeds.
    - q: What withdrawal strategies are available?
      a: 'Three strategies: Fixed Dollar (withdraw your goal amount adjusted for inflation), 4% Rule (withdraw 4% of initial nest egg yearly, inflation-adjusted), and Variable Percentage (withdraw a growing percentage of current balance).'
    - q: What currencies are supported?
      a: '10 currencies: USD, EUR, GBP, JPY, INR, CAD, AUD, CHF, CNY, BRL. Your selection is saved in localStorage and all values update immediately.'
    - q: What is goal seek?
      a: Goal Seek uses binary search to find the exact monthly contribution needed to meet your retirement goal. Results are auto-filled into the contribution field.
    - q: What does Funds Last mean?
      a: It shows how many years your retirement savings will last given your desired monthly income. If shorter than life expectancy, you may need to save more or adjust your goal.
    howto_steps:
    - title: Enter Your Profile
      desc: Fill in your current age, target retirement age, and life expectancy.
    - title: Set Savings & Tax Allocation
      desc: Enter savings, monthly contribution, expected return, volatility. Set your Traditional vs Roth split and expected retirement tax rate.
    - title: Configure Adjustments
      desc: Set inflation rate and contribution escalation percentage.
    - title: Add Social Security, Income & Expenses
      desc: Toggle Social Security, add pension/rental/part-time income. Add one-time expenses in retirement.
    - title: Choose Currency & Withdrawal Strategy
      desc: Select from 10 currencies. Choose Fixed Dollar, 4% Rule, or Variable Percentage withdrawal.
    - title: Use Goal Seek (Optional)
      desc: Click Goal Seek to auto-find the required monthly contribution to meet your target.
    - title: Run Monte Carlo & Export
      desc: Click MC for probability analysis. Export tables as CSV for further analysis.
    - title: Set Savings & Contributions
      desc: Enter your current retirement savings, monthly contribution, expected annual return, and optional contribution escalation rate.
    - title: Add Social Security
      desc: Toggle Social Security on and enter your estimated monthly benefit and the age you plan to start collecting.
    - title: Set Your Goal
      desc: Enter your desired monthly retirement income in today's dollars.
    - title: Review & Compare
      desc: Explore the Overview, Projection, Drawdown, and Compare tabs to evaluate your retirement readiness.
    howto_calculate: '<p>Each year of accumulation is modeled as: <code>balance = balance + (monthly_contribution × 12) + (balance × annual_return_rate)</code>. Traditional and Roth balances are tracked separately. During drawdown, withdrawals are taxed at your expected retirement rate based on the Traditional portion. Monte Carlo runs 2000 simulations with normally-distributed random returns. Goal Seek uses binary search to find the minimum monthly contribution that achieves success.</p>'
    about_title: About the Retirement Planning Calculator
    about_body: <p>The Retirement Planning Calculator helps you model your financial future from accumulation through drawdown. Enter your current age, savings, expected returns, and retirement goal, then see if you're on track.</p><p>Key features include multi-currency support (10 currencies), inflation-adjusted projections, Social Security integration, Traditional vs Roth tax modeling, additional income sources (pension, rental, part-time), one-time expenses, three withdrawal strategies, Monte Carlo simulation with distribution analysis, goal seek (auto-find required savings), alternative strategy comparison, year-by-year accumulation and drawdown tables, chart visualization, CSV export, and goal progress tracking. All calculations run entirely in your browser — no server round-trips, no data storage, complete privacy.</p>
