    about_title: About the Crypto Mining Calculator
    about_body: '<p>The <strong>Crypto Mining Profitability Calculator</strong> estimates gross block revenue, daily electricity draw, pool fee drag, and net operating margin for Proof-of-Work ASIC rigs.</p><h3>Worked ASIC Economics Example: 200 TH/s at 3,500W</h3><p>Consider a modern 200 TH/s ASIC miner drawing 3,500 watts (<code>3.5 kW × 24h = 84 kWh/day</code>). At an industrial rate of <strong>$0.07/kWh</strong>, daily power costs exactly <strong>$5.88</strong> ($176.40/month). Meanwhile at 700 EH/s (700,000,000 TH/s) total network hashrate and ~450 BTC daily issuance, your rig mines <code>(200 / 700,000,000) × 450 ≈ 0.0001285 BTC/day</code> before transaction fees and 1%–2% pool deductions. Raising electricity cost to $0.14/kWh doubles power expense to $11.76/day, pushing marginal rigs underwater unless coin price rises proportionally.</p><h3>Hidden Operational Variables Beyond Sticker Hashrate</h3><ul><li><strong>Difficulty Growth Rate:</strong> New-generation ASIC deployments steadily
      raise difficulty, shrinking BTC yield per TH/s month over month.</li><li><strong>Cooling &amp; PSU Overhead:</strong> Wall power exceeds chip rating by 3%–8% due to power supply efficiency and intake fan cooling.</li><li><strong>Hardware Amortization:</strong> Operating cash flow ignores upfront rig depreciation and hosting colocation minimums.</li></ul>'
