    meta_title: Free Crypto Tax Calculator — Capital Gains & Cost Basis
    name: Crypto Tax Calculator
    icon: bitcoin
    category: AI & Crypto
    description: Free cryptocurrency tax calculator for Bitcoin, Ethereum, DeFi & NFTs. Calculate FIFO cost basis, short- vs long-term gains, and VDA tax privately.
    keywords:
