    - q: What are the UPSC age limit, birth-date window, and maximum attempts?
      a: General/EWS candidates must be between 21 and 32 years on August 1 with up to 6 attempts. OBC-NCL candidates receive 3 years relaxation (up to 35 years, 9 attempts), SC/ST receive 5 years (up to 37 years, unlimited attempts), and PwBD candidates receive 10 to 15 years relaxation.
