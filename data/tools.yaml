      a: A crypto airdrop is when a blockchain project sends free tokens to wallet addresses. Projects do this to reward early users, promote their platform, or distribute governance tokens to the community.
    - q: How do I qualify for airdrops?
      a: Most airdrops require you to use the project before a snapshot date. Common requirements include making transactions, providing liquidity, staking tokens, or holding a minimum balance. Some airdrops are for early testers or community members.
    - q: Are airdrops free money?
      a: Airdrops give you free tokens, but they are not risk-free. You should always research the project, never pay gas fees to 'claim' an airdrop from an untrusted source, and beware of scams asking for your private keys.
    - q: What is a snapshot?
      a: A snapshot is when a project records all wallet balances and activities at a specific block. If you are using the platform before the snapshot, you qualify for the airdrop. After the snapshot, new activity may not count.
    - q: How do I stay safe with airdrops?
      a: Never share your private keys or seed phrase. Never pay to claim an airdrop. Only interact with official project websites. Be very careful of fake airdrop links on social media.
    - q: Where does the Airdrop Finder get its data?
      a: No live feed required. The finder scores the requirements and values you tick against its checklist, so matches mirror your own shortlist. All math runs in your browser and nothing uploads.
    - q: How accurate are the predictions?
