    - q: What is the difference between gross margin percentage and markup percentage?
      a: Gross margin divides profit by selling price ((Price - Cost) / Price), whereas markup divides profit by unit cost ((Price - Cost) / Cost). Margin can never exceed 100%.
    - q: How should ecommerce sellers compute true landed unit cost?
      a: Add factory wholesale price, inbound freight/customs per unit, packaging, fulfillment pick-pack fee, and payment gateway percentage into Unit Cost.
    - q: Why can high sales volume growth still hurt net business profit?
      a: Heavy discounting or rising paid acquisition costs can grow top-line revenue while shrinking per-unit contribution below fixed overhead needs.
    - q: How are unit growth and revenue growth compared here?
      a: Unit growth measures ((Current Units - Previous Units) / Previous Units) × 100, letting you spot pricing or discount mix effects immediately.
    - q: Is this SKU analyzer useful for Amazon FBA, Shopify, and retail stores?
      a: Yes. Any physical product or digital SKU with unit price, landed cost, and historical period volume fits the model cleanly.
