  cgpa-percentage-calculator:
    name: CGPA & SGPA Converter
    title: CGPA, SGPA & Percentage Converter — VTU, MAKAUT, CBSE, Mumbai, Anna
    meta_title: CGPA to Percentage Calculator — VTU, MAKAUT, CBSE, Anna
    description: Convert CGPA and SGPA to exact Percentage for CBSE, VTU, MAKAUT, Mumbai Univ, Anna Univ, GTU, and SPPU with credit-weighted SGPA calculation.
    category: Calculators
    app_category: EducationalApplication
    icon: graduation-cap
    sitemap_priority: 0.9
    is_popular: true
    date_modified: '2026-11-11'
    keywords:
    - cgpa to percentage calculator vtu
    - sgpa to cgpa calculator with credits
    - makaut cgpa to percentage calculator
    - mumbai university cgpa to percentage
    - anna university cgpa to percentage calculator
    - cbse cgpa to percentage calculator
    - convert sgpa to percentage online
    - semester wise sgpa to cgpa calculator
    faqs:
    - q: How do I convert CGPA to Percentage for VTU 2015, 2018, 2021, and 2022 schemes?
      a: Under Visvesvaraya Technological University (VTU) rules, the 2021 and 2022+ schemes multiply directly by 10 (Percentage = CGPA × 10), whereas the older 2015 and 2018 CBCS batches subtract 0.75 first ((CGPA − 0.75) × 10). Pick either VTU preset directly in the dropdown above.
    - q: What is the official MAKAUT / WBUT CGPA to Percentage formula?
      a: Maulana Abul Kalam Azad University of Technology (MAKAUT, formerly WBUT) defines Percentage = (CGPA − 0.75) × 10. For example, an 8.20 CGPA converts to (8.20 − 0.75) × 10 = 74.50%, and our converter applies that exact offset automatically.
    - q: How does CBSE convert CGPA to Percentage and how does Mumbai University differ?
      a: CBSE specifies Percentage = CGPA × 9.5 for indicative scores, whereas Mumbai University Engineering CBCS uses the linear equation Percentage = (7.1 × CGPA) + 11 (and 7.4 × CGPA + 12 in select non-engineering faculties). Anna University R2021+ and DU NEP 2022+ multiply CGPA × 10.
    - q: How do you convert semester-wise SGPA to CGPA accurately?
      a: Always weight each semester by its earned credits using CGPA = sum(SGPA_i × Credits_i) ÷ sum(Credits_i). Taking a simple average across semesters only matches exact university transcripts when every semester carries identical total credits; our SGPA tab supports both weighted and equal-credit modes.
    - q: Can I calculate semester SGPA directly from subject grades and credits?
      a: Yes. Switch to the Grades → SGPA tab, add your courses, pick 10-point letter grades (O=10, A+=9, A=8, B+=7, B=6, C=5, P=4) and course credits, and compute both exact semester SGPA and converted percentage under your university formula.
    - q: How can I reverse-convert Marks Percentage back to CGPA?
      a: Open the % → CGPA tab to apply the exact algebraic inverse CGPA = (Percentage − Offset) ÷ Multiplier for your university—for instance dividing by 9.5 for CBSE, adding 7.5 then dividing by 10 for MAKAUT/VTU 2018, or subtracting 11 then dividing by 7.1 for Mumbai Engineering.
    - q: Can I download my CGPA / SGPA academic summary as a PDF?
      a: Yes. Select PDF Report in the output panel to generate a clean PDF containing your selected university formula, CGPA, Percentage, division classification, indicative 4.0 US GPA estimate, and semester or course rows directly in your browser.
    howto_steps:
    - step: 1
      title: Select Your University or Board Formula Preset
      desc: Choose CBSE (x9.5), VTU (2018 or 2022+), MAKAUT, Anna University, Mumbai University, GTU, SPPU, DU, AKTU, or Custom.
    - step: 2
      title: Pick Conversion or Builder Mode
      desc: Switch between CGPA to Percentage, Percentage to CGPA, Multi-Semester SGPA to CGPA, or Course Grades to SGPA.
    - step: 3
      title: Enter Scores, Semesters, or Course Credits
      desc: Input your CGPA, percentage, or credit-weighted semester/subject breakdown to compute exact cumulative grades.
    - step: 4
      title: Compare Universities & Export PDF Report
      desc: Review division classification, cross-check formulas across 8 Indian universities, or export a browser-generated PDF.
    howto_calculate: Apply your university linear rule Percentage = (Multiplier × CGPA) + Offset. Multiply by 9.5 for CBSE/DU CBCS, multiply by 10 for VTU 2022+/Anna Univ/DU NEP, subtract 0.75 then multiply by 10 for VTU 2018/MAKAUT, or compute 7.1 × CGPA + 11 for Mumbai Engineering. For multi-semester CGPA, divide the sum of (SGPA × Credits) by total cumulative credits.
    about_title: About the CGPA, SGPA & Percentage Converter
    about_body: "<p>The CGPA &amp; SGPA Converter calculates official university percentages, reverse CGPA estimates, credit-weighted multi-semester averages, and course-wise SGPA in seconds. Built with exact notification presets, it eliminates confusion between competing university formulas when filling job applications, scholarships, or higher-education forms.</p> <h3>Official University Presets &amp; Weighted Builders</h3> <ul>\n  <li><strong>CBSE CGPA to Percentage Calculator:</strong> Applies the indicative <code>CGPA × 9.5</code> board multiplier alongside reverse percentage lookup.</li>\n  <li><strong>CGPA to Percentage Calculator VTU &amp; MAKAUT CGPA to Percentage Calculator:</strong> Supports both modern VTU 2021/2022+ (<code>× 10</code>) and legacy VTU 2015/2018 / MAKAUT (<code>(CGPA − 0.75) × 10</code>) equations.</li>\n  <li><strong>Mumbai University CGPA to Percentage &amp; Anna University CGPA to Percentage Calculator:</strong> Built-in presets cover Mumbai Engineering (<code>7.1\
      \ × CGPA + 11</code>), Mumbai Arts/Commerce/Science, Anna R2021+, GTU (<code>(C − 0.5) × 10</code>), SPPU Pune (<code>× 8.9</code>), and Delhi University.</li>\n  <li><strong>Semester Wise SGPA to CGPA Calculator &amp; SGPA to CGPA Calculator with Credits:</strong> Combine up to 12 semesters by exact credit weighting and <strong>convert SGPA to percentage online</strong> in one workflow.</li>\n</ul> <h3>University Formula Comparison Table</h3> <table class=\"table\">\n  <thead>\n    <tr><th>University / Board</th><th>Official Conversion Formula</th><th>Example (8.5 CGPA)</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>CBSE / DU CBCS (Pre-2022)</td><td>CGPA × 9.5</td><td>80.75%</td></tr>\n    <tr><td>VTU 2021–2022+ / Anna R2021+ / DU NEP</td><td>CGPA × 10</td><td>85.00%</td></tr>\n    <tr><td>VTU 2015–2018 / MAKAUT (WBUT)</td><td>(CGPA − 0.75) × 10</td><td>77.50%</td></tr>\n    <tr><td>Mumbai University (Engineering)</td><td>7.1 × CGPA + 11</td><td>71.35%</td></tr>\n    <tr><td>GTU Gujarat\
      \ / AICTE Model</td><td>(CGPA − 0.5) × 10</td><td>80.00%</td></tr>\n    <tr><td>SPPU Pune University</td><td>CGPA × 8.9</td><td>75.65%</td></tr>\n  </tbody>\n</table> <p>Combine grade conversion with our <a href=\"/tool/attendance-calculator\">75% Attendance Calculator</a>, <a href=\"/tool/percentage-calculator\">General Percentage Calculator</a>, <a href=\"/tool/negative-marking-calculator\">Negative Marking Calculator</a>, <a href=\"/tool/exam-age-eligibility-calculator\">Exam Age Limit Calculator</a>, and <a href=\"/tool/scientific-calculator\">Scientific Calculator</a>.</p>"
