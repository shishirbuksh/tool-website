    faqs:
    - q: How is a 10-point Indian CGPA converted to a German grade using the Modified Bavarian Formula?
      a: German universities and uni-assist apply the Modified Bavarian Formula German Grade = 1 + 3 × (Nmax − Nd) ÷ (Nmax − Nmin), where Nmax is 10.0, Nmin is your university minimum passing CGPA (usually 4.0 or 5.0), and Nd is your earned CGPA. For instance, an 8.4 CGPA with Nmin 4.0 equals 1 + 3 × (10 − 8.4) ÷ 6 = 1.80 (Gut).
    - q: What German grade is considered good (Sehr gut vs Gut) for MS admissions in Germany?
      a: In the German 1.0 to 5.0 grading system, lower numbers represent better academic performance. Grades from 1.00 to 1.50 qualify as Sehr gut (Very Good), 1.51 to 2.50 are Gut (Good—commonly the cutoff for TUM, RWTH, and public MS programs), 2.51 to 3.50 are Befriedigend, and above 4.0 is Fail.
    - q: Why does WES 4.0 GPA often differ from multiplying 10-point CGPA by 0.4?
      a: Simple proportional scaling computes (CGPA ÷ 10) × 4.0, which treats an 8.0 CGPA as 3.20/4.0. In contrast, World Education Services (WES) Course-by-Course evaluations remap each individual subject grade and credit weight onto US letter bands, where Indian First Division courses (60%–70%+) often convert to 3.30–4.00 Grade Points.
    - q: Should I convert 10-point CGPA directly or convert to Percentage first for uni-assist?
      a: When your transcript reports a 10-point grading scale, uni-assist ordinarily plugs Nmax = 10 and Nmin = 4.0 (or your degree minimum pass grade) directly into the Bavarian formula. Toggle the Percentage-First option above if an admissions office explicitly asks for your official CBSE/VTU/MAKAUT percentage formula first.
    - q: How does 10-point CGPA map to UK Honours, Canada 4.33 GPA, and Australia 7-point GPA?
      a: Broadly, 70%+ or 7.5+ CGPA aligns with UK First Class Honours (1st), 60%–69% with Upper Second-Class (2:1), 6.0–7.0 Australian GPA marks Distinction to High Distinction, and 85%+ matches Canadian 4.00–4.33 (A/A+). Exact thresholds vary slightly by university selectivity.
    - q: Can I calculate the minimum CGPA needed to meet a specific German university cutoff like 2.0?
      a: Yes. Switch to the Bavarian Formula & Target tab, enter your grading scale Nmax and Nmin, and type your target German grade cutoff (for example 2.0 or 2.5). The reverse solver immediately returns the minimum score required on your home transcript.
    - q: Can I export my multi-country GPA conversion summary as a PDF report?
      a: Yes. Click PDF Report to generate and download a clean single-page ASCII PDF summary containing your German Bavarian grade, US WES and linear 4.0 estimates, Canada 4.33, UK Honours, Australian 7-point GPA, ECTS grade, and formula trace locally in your browser.
