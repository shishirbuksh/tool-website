    about_body: <p>The <strong>Crypto Price Converter</strong> translates token quantities and fiat amounts using public CoinGecko spot reference feeds (cached on a 60-second window) alongside manual override mode when offline or verifying an OTC quote.</p><h3>Reference Rate vs. Real Execution Price</h3><p>Aggregated spot indices blend volume-weighted quotes across global exchanges, which often differ slightly from the exact bid/ask price you pay on an exchange or DEX. For instance, converting <code>0.5 BTC</code> at a $68,000 spot index gives $34,000 reference value, yet an instant retail card purchase with 1.8% spread + 1% card fee costs ~$34,952, while a shallow altcoin order book can slip 0.5%–3% on market orders.</p><h3>Reading Cache Status &amp; Custom Rate Mode</h3><ul><li><strong>Live / Stale / Manual Indicators:</strong> Status badges clarify feed freshness so you never mistake an older cached snapshot for a real-time order book tick.</li><li><strong>Bidirectional Inversion:</strong>
