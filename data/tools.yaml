  credit-utilization-calculator:
    name: Credit Utilization Calculator
    icon: credit-card
    category: Calculators
    description: Calculate credit utilization ratio from balances and limits with 30% rule guidance, paydown targets, score impact tips and instant clear results. Free forever.
    keywords:
    - free credit utilization calculator online
    - 30 percent credit rule calculator
    - how much to pay down to reach 30 percent
