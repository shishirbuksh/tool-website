    about_title: About the API Tester
    about_body: <p>This API Tester is a full-featured browser-based REST API client for developers. All requests are sent directly from your browser using the Fetch API with no server-side proxy or data logging.</p><p><strong>Features:</strong> 7 HTTP methods, auth presets (Basic, Bearer, API Key), query parameters, custom headers, 4 body types, saved collections with export/import, code generation (cURL/Python/JavaScript), request history, color-coded status, response timing, size tracking, response headers viewer, raw/pretty formatting.</p><p><strong>Privacy:</strong> All requests go directly from your browser to the target API. Your data is never sent to our servers. History and saved collections are stored only in localStorage.</p><p><strong>Limitations:</strong> Browser CORS policies may block cross-origin requests. For APIs behind CORS, consider a desktop client like Postman. The tool is intended for testing public APIs and development endpoints.</p>
