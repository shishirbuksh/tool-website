    - q: Why does RFC 9562 UUID v7 outperform UUID v4 as a database primary key?
      a: UUID v4 puts random bits up front, causing B-tree index page splits and heavy cache churn. UUID v7 leads with a 48-bit millisecond timestamp, keeping inserts localized and ordered chronologically.
    - q: Does this generator use Math.random() or true Web Crypto CSPRNG?
      a: It uses window.crypto.getRandomValues() exclusively (hardware-seeded cryptographically secure randomness) with strict RFC version and variant bit masking.
