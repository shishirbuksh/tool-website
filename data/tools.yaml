      desc: Include your exchange's trading fee percentage (typically 0.1-0.5%).
    - title: Review results
      desc: See total invested, returned, net profit, and ROI at a glance.
    howto_calculate: 'The calculator computes: invested = amount × buy price, returned = amount × sell price, gross profit = returned - invested, fee = returned × (fee% / 100), net profit = gross profit - fee, ROI = (net profit / invested) × 100. All values update instantly as you type.'
    about_title: About the Crypto Profit Calculator
    about_body: <p>The <strong>Crypto Profit Calculator</strong> computes gross gain, two-way exchange fees, exact break-even exit price, and net ROI percentage before you execute a spot trade.</p><h3>Worked Break-Even Trade Example With Entry &amp; Exit Fees</h3><p>Suppose you deploy <strong>$2,000</strong> into Solana at $150/SOL using a market order charging 0.40% taker fee ($8 fee), receiving roughly <code>13.28 SOL</code> net. If you exit at $180/SOL and pay another 0.40% taker fee ($9.56), gross value equals $2,390.40, minus $9.56 exit fee = <strong>$2,380.84 net proceeds</strong>—a net profit of $380.84 (19.04% ROI) instead of a naive 20.00% price jump. Knowing the true break-even exit price (~$151.21/SOL) prevents closing scalp trades at a small net loss after round-trip fees.</p><h3>Practical Fee &amp; Slippage Checks</h3><ul><li><strong>Maker vs. Taker Orders:</strong> Resting limit orders often cut exchange commissions by 40%–75% compared with instant market buys.</li><li><strong>Pre-Tax
      vs. After-Tax Gains:</strong> Net trade profit remains subject to local capital gains or VDA reporting rules depending on holding period.</li></ul><h3>Don't Forget Withdrawal &amp; On-Chain Gas Costs</h3><p>Low-dollar altcoin trades frequently look profitable on gross percentage gain until L1 Ethereum swap gas, bridge tolls, and taker commissions turn net realized ROI negative—especially across small tickets under $150.</p>
