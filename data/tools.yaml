    faqs:
    - q: How do you calculate Best of 5 subjects percentage in CBSE Class 10?
      a: Under common CBSE Class 10 admission norms for 6-subject marksheets, take English (or your compulsory first language) plus the highest 4 scores among the remaining 5 subjects—or pick Pure Top 5 if your school does not mandate English—and divide that sum by 500 before multiplying by 100.
    - q: How does ICSE Best of 5 percentage differ from ISC Class 12 Best of 4?
      a: ICSE Class 10 always keeps English compulsory and picks the top 4 scores from Mathematics, Science, HCG, Computer Applications, or Hindi (500 total), whereas ISC Class 12 uses English plus the highest 3 remaining subjects for college cutoffs (400 total).
    - q: Does JEE Main / Advanced 75% eligibility count Best of 5 or only PCM?
      a: JoSAA and NTA 75% criteria require at least 75% aggregate (65% for SC/ST) across 5 specific subjects—Physics, Chemistry, Mathematics, one Language, and one additional subject—not Best of 5 if PCM scores are replaced. Our PCM / PCB Eligibility tab checks both 5-subject JEE aggregate and BITSAT 75% PCM + 60% individual minimum rules.
    - q: What PCB aggregate percentage is required for NEET UG eligibility?
      a: NEET UG requires passing Physics, Chemistry, Biology/Biotechnology, and English individually, with at least 50% aggregate in PCB combined (40% for OBC/SC/ST and 45% for General-PwBD) in Class 12 board examinations.
    - q: How do I handle Additional / 6th subject marks on my board marksheet?
      a: Enter all 6 subjects (or click Add Subject for up to 10 subjects) in the Best-of-5 / Board tab. The Included vs Dropped breakdown highlights in green which 5 subjects raise your percentage and clearly tags the lowest non-compulsory additional subject as Dropped.
    - q: What is the fastest way to convert obtained marks out of total marks into percentage?
      a: Open the Total Marks -> % tab, enter obtained marks and maximum total (such as 456 out of 500 or 512 out of 600), and get instant percentage, marks lost, grade band, and exact marks needed for 75%, 80%, 85%, 90%, and 95% cutoffs.
    - q: Can I download my Best of 5 and eligibility scorecard as a PDF report?
      a: Yes. Click PDF Report in the result summary panel to generate a clean single-page PDF containing your board rule, Best-of-5 percentage, all subjects included or dropped, and college eligibility check directly in your browser.
