    about_title: About the CSS Filter Generator
    about_body: '<p>The <strong>CSS Filter &amp; Glassmorphism Backdrop-Filter Generator</strong> tunes <code>blur</code>, <code>brightness</code>, <code>contrast</code>, <code>saturate</code>, <code>grayscale</code>, <code>hue-rotate</code>, <code>sepia</code>, and <code>drop-shadow</code> interactively on sample photos and translucent cards.</p><h3>CSS <code>filter</code> vs. <code>backdrop-filter</code> Glassmorphism</h3><p><code>filter: blur(8px)</code> softens the element itself—including its child text—whereas <code>backdrop-filter: blur(14px) saturate(160%)</code> paired with semi-transparent <code>rgba(255,255,255,0.72)</code> blurs only the layers behind the element, producing crisp frosted-glass headers and modals while text inside remains razor-sharp.</p><h3>Real-World Browser Considerations</h3><ul><li><strong><code>drop-shadow()</code> Respects PNG Alpha:</strong> Unlike rectangular <code>box-shadow</code>, CSS <code>filter: drop-shadow(...)</code> hugs irregular transparent
      PNG/SVG silhouettes cleanly.</li><li><strong>Keep Blur Radii Moderate:</strong> Large <code>backdrop-filter: blur(40px)</code> panels over scrolling video consume measurable mobile GPU fill-rate; 8px–16px hits the sweet spot.</li></ul><h3>Maintaining Accessible Fallback Contrast Behind Glass Panels</h3><p>Always test translucent <code>backdrop-filter</code> navbars scrolling directly over both pure white cards and busy hero photos—pairing subtle translucent tinting (e.g., <code>rgba(255,255,255,0.84)</code>) plus crisp dark border hairlines preserves sharp navigation contrast everywhere.</p><ul><li><strong>Hardware Layer Hint:</strong> Moderate 8px–14px blur keeps frame rates smooth on mid-range smartphones.</li><li><strong>Safari Prefix Hygiene:</strong> Modern Safari 18+ supports standard <code>backdrop-filter</code> natively alongside legacy <code>-webkit-backdrop-filter</code>.</li></ul>'
