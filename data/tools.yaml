    faqs:
    - q: Which block height triggers the next Bitcoin halving?
      a: Bitcoin halves every 210,000 blocks. Following block 840,000 in April 2024, the next halving triggers at block 1,050,000, reducing the block subsidy from 3.125 BTC to 1.5625 BTC.
    - q: Why does the predicted calendar date fluctuate?
      a: Countdown clocks multiply remaining blocks by an assumed 600-second block interval, whereas real block arrival varies between difficulty retargets whenever network hashrate surges or drops.
    - q: How does Bitcoin prevent fractional satoshi drift across 33 halvings?
      a: Bitcoin Core encodes the initial 50 BTC reward in satoshis (5,000,000,000) and applies an integer right-shift (>> epoch), dropping the subsidy to zero after 33 halvings.
    - q: What happens to circulating supply once all 21 million BTC are mined?
      a: Around the year 2140 new issuance hits zero, and Proof-of-Work miners rely exclusively on transaction fees paid by block-space users.
    - q: Does halving guarantee an immediate post-event rally?
      a: No. While programmatic supply issuance drops 50%, market prices already reflect public expectations, macro liquidity, ETF flows, and miner treasury selling.
    - q: What daily new Bitcoin supply exists in the 3.125 BTC epoch?
      a: At 144 blocks per day (6 blocks/hour), Bitcoin issues approximately 450 newly mined BTC per day (~164,250 BTC/year) before transaction fees.
    howto_steps:
    - title: Check the countdown
