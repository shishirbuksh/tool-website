      desc: Inspect the live step-by-step math trace, compare outcomes across all negative marking schemes, run a +10 guess simulation, save your mock score locally, or download a formatted PDF scorecard.
    howto_calculate: First find Correct Answers (Attempted − Wrong when entering attempted count). Multiply Correct Answers by Marks per Question to get Gross Score. Next determine Penalty per Wrong Answer—either fixed (such as 0.25 or 0.50) or fractional (Marks × Numerator ÷ Denominator, keeping 1/3 exact). Subtract (Wrong Answers × Penalty) from Gross Score to get Net Marks, and divide Penalty by (Marks + Penalty) × 100 for Break-Even Accuracy. For example, in SSC CGL Tier-I (+2 marks, 1/4 = -0.50), 72 attempted and 12 wrong yields 60 correct (+120 marks) minus 6 deducted = 114/200 (57.00%).
