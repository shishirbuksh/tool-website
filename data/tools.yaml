    howto_calculate: <p><strong>X% of Y:</strong> <code>(X &divide; 100) &times; Y</code>. <strong>X is what % of Y:</strong> <code>(X &divide; Y) &times; 100</code>. <strong>% Change from A to B:</strong> <code>((B &minus; A) &divide; |A|) &times; 100</code>.</p>
    about_title: About the Percentage Calculator
    about_body: '<p>The <strong>3-Mode Percentage Calculator</strong> solves all three daily percentage tasks—finding X% of a number, determining what percentage X is of Y, and measuring percentage increase or decrease between initial and final values.</p><h3>Worked Examples Across Discounts, Tips &amp; Price Changes</h3><p><strong>1) Discount / Tax:</strong> Finding <strong>18% of $250</strong> gives <code>0.18 &times; 250 = $45</code>. <strong>2) Score / Share:</strong> <strong>42 out of 60</strong> equals <code>(42 &divide; 60) &times; 100 = 70%</code>. <strong>3) Asymmetric Growth Trap:</strong> If a portfolio drops 25% from $1,000 to $750, gaining 25% back only reaches $937.50—you actually need a <strong>+33.33% gain</strong> (<code>(1,000 &minus; 750) &divide; 750</code>) to recover breakeven.</p><h3>Percentage Points vs. Percent Change</h3><ul><li><strong>Relative vs. Absolute Shifts:</strong> If mortgage rates rise from 4% to 6%, that is a <strong>+2 percentage point</strong> increase—but
      a <strong>+50% relative increase</strong> in borrowing rate.</li><li><strong>Base Order Matters:</strong> Always divide differences by the <em>starting baseline</em> (Old Value), not the larger or final number.</li></ul><h3>Double-Checking Margin vs. Discount Reversals</h3><p>Retail markups and markdowns mislead buyers because percentage math is non-commutative: raising a $100 fee by 25% ($125) and then offering ''25% off'' ($93.75) yields a quiet 6.25% loss. Always compute reverse checks first.</p>'
