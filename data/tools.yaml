    faqs:
    - q: What is a meme coin?
      a: A meme coin is a cryptocurrency inspired by internet memes or jokes, like Dogecoin or Shiba Inu. While some have value, many are created as pump-and-dump schemes with no real utility. This detector helps you identify high-risk meme coins before investing.
    - q: How does the meme coin detector work?
      a: 'The detector asks five key questions about the token: contract verification status, social media hype level, team transparency, liquidity lock status, and audit availability. Each answer adds or subtracts points from a starting score of 50 to produce a final risk assessment.'
    - q: What is a rug pull?
      a: A rug pull is a scam where developers create a cryptocurrency, hype it up, then suddenly withdraw all liquidity or dump their tokens, leaving investors with worthless coins. Unverified contracts, anonymous teams, and unlocked liquidity are major rug pull warning signs.
    - q: What should I do if a coin scores Extreme risk?
      a: If a coin scores Extreme (75+), avoid investing. Do not buy even a small amount. Extreme-risk coins have multiple red flags and very high chance of being scams or pump-and-dump schemes. Always verify claims independently.
    - q: Is this financial advice?
      a: No, this tool is for educational and informational purposes only. It provides a simplified risk assessment based on common warning signs. Always do your own research and consult a qualified financial advisor before investing.
    - q: Where does the Meme Coin Detector get its data?
      a: No live feed required. The detector scores the liquidity, holder and contract answers you give, so verdicts mirror checkable signals. All logic runs in your browser and nothing uploads.
    - q: How accurate are the predictions?
      a: Safety screens summarize YOUR answers with transparent checks, not market forecasts. Meme coins can rug in minutes regardless of score. Educational screening only, never financial advice.
    - q: How often is the data refreshed?
      a: No refresh needed. All math runs locally on the values you enter, so figures never go stale on their own. Re-enter current prices from your exchange whenever you want updated results; nothing is stored or uploaded.
    - q: Is my data secure?
      a: Yes. All analysis happens in your browser or through encrypted channels. We never store your wallet addresses or trading data. Answers persist only in your page session.
    howto_steps:
    - title: Enter token name and symbol
      desc: Type the name and symbol of the token you want to check (e.g. PepeCoin, PEPE).
    - title: Answer the risk questions
      desc: 'Select the status for each factor: contract verification, hype level, team doxxed, liquidity lock, and audit availability.'
    - title: Review the risk score
      desc: See the overall risk score from 0 (Safe) to 100 (Extreme), the risk level badge, and hype factor.
    - title: Check the red flag breakdown
      desc: Review each factor's individual score in the breakdown table to understand exactly which red flags were raised.
    howto_calculate: The risk score starts at 50 (moderate risk) and adjusts based on five factors. Contract unverified adds 25 points, verified subtracts 20. Very high hype adds 25, low hype subtracts 10. Team not doxxed adds 20, doxxed subtracts 20. Liquidity not locked adds 25, locked subtracts 20. No audit adds 20, audit available subtracts 25. The final score is clamped between 0 and 100.
    about_title: About the Meme Coin Detector
    about_body: <p>The Meme Coin Detector is a free online tool that helps you check if a crypto token is a high-risk meme coin or rug pull.</p><p>Built with privacy in mind, all processing happens directly in your browser. No sign-up required, no data stored, no tracking. Simply open the tool, enter your information, and get instant results.</p>
