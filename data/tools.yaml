    howto_calculate: Total revenue = units sold × unit price. Total cost = units sold × unit cost. Total profit = total revenue - total cost. Profit margin = (total profit / total revenue) × 100. Sales growth = ((current units - previous units) / previous units) × 100. Revenue growth = ((current revenue - previous revenue) / previous revenue) × 100. Profit per unit = unit price - unit cost.
    about_title: About the Product Performance Analyzer
    about_body: '<p>The <strong>Product Performance Analyzer</strong> evaluates single-SKU or catalog profitability by computing gross revenue, total COGS, dollar profit, gross margin percentage, unit profit, and period-over-period volume/revenue growth.</p><h3>Worked SKU Diagnostic: Revenue Growth vs. Margin Erosion</h3><p>Suppose SKU <code>#PRO-104</code> sold <strong>1,500 units at $49.99</strong> ($74,985 total revenue) compared with 1,200 units last quarter (+25.0% unit growth), while landed cost per unit equals $25.00 ($37,500 COGS). Gross profit reaches <strong>$37,485</strong> (<code>$24.99 profit/unit</code>, <code>50.0% gross margin</code>). If you test discounting unit price 15% to $42.49 to chase extra volume, profit per unit shrinks to $17.49—requiring a <strong>+42.9% surge in units sold</strong> (2,143 units) just to earn the same total dollar profit.</p><h3>Ecommerce Margin Adjustments Not to Forget</h3><ul><li><strong>Include Fulfilled Landed Cost:</strong> Roll inbound
