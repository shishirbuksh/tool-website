    meta_title: Retirement Calculator — Savings & Pension Target (Free)
    name: Retirement Planning Calculator
    icon: piggy-bank
    category: Calculators
    description: Plan your retirement by modeling accumulation and drawdown phases, comparing strategies, adding Social Security, and adjusting for inflation. Retire confident.
    keywords:
    - free retirement calculator online
