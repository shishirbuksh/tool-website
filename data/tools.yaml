    date_modified: '2026-09-25'
    faqs:
    - q: Why does (a+)+ or overlapping quantifiers freeze JavaScript regex engines?
      a: Overlapping nested quantifiers trigger catastrophic backtracking (ReDoS), testing exponentially many paths when a long string fails near the end. Replace them with unambiguous negated character classes like [^/]+.
    - q: What is the practical difference between greedy .* and lazy .*? matching?
      a: Greedy .* matches the longest possible substring all the way to the final delimiter on a line, whereas lazy .*? stops at the very first matching delimiter.
    - q: When is the ECMAScript /m multiline flag required?
      a: By default ^ and $ match only the start and end of the entire input string; adding /m makes ^ and $ match the start and end of every individual line.
    - q: Does this regex tester evaluate proprietary PCRE lookbehinds absent from older JS engines?
      a: Matching uses your browser's native ECMAScript RegExp engine (ES2018+ lookbehinds, named groups, and /d indices supported across modern Chrome, Edge, Firefox, and Safari).
    howto_steps:
    - title: Enter Pattern
      desc: Type regex without slashes and pick flags g i m s u. Errors highlight instantly.
    - title: Paste Test Text
      desc: Paste logs or samples. Matches highlight with count and positions.
    - title: Inspect Groups
      desc: Open groups table to copy captures per match for extraction.
    - title: Try Preset
      desc: Load email, URL, phone or date presets to learn by example.
    - title: Share or Copy
      desc: Copy pattern with flags or share link with encoded test case.
    howto_calculate: <p>Matching uses <code>new RegExp(pattern, flags)</code> with <code>matchAll</code> iteration. Groups come from <code>match indices</code>. Invalid patterns throw <code>SyntaxError</code> shown with message and position.</p>
    about_title: About the Regex Tester
    about_body: <p>The <strong>Live JavaScript Regex Tester &amp; Match Highlighter</strong> evaluates ECMAScript regular expressions in real time against multi-line sample text—supporting <code>g</code>, <code>i</code>, <code>m</code>, <code>s</code>, <code>u</code>, and <code>d</code> flags alongside numbered and named capture group breakdowns.</p><h3>Escaping Traps, Greedy Quantifiers &amp; Catastrophic Backtracking</h3><p>Using greedy <code>.*</code> between quotes (e.g., <code>".*"</code>) spans right across multiple separate fields on a line; adding the lazy modifier <code>.*?</code> stops cleanly at the first closing quote. Even more critically, nested ambiguous quantifiers like <code>(a+)+$</code> suffer exponential <strong>ReDoS backtracking</strong> when fed mismatched input, freezing web threads—always prefer explicit character classes like <code>[^"]*</code>.</p><h3>Cheat Sheet of High-Value Flags</h3><ul><li><strong><code>m</code> (Multiline):</strong> Anchors <code>^</code>
      and <code>$</code> to every newline line boundary instead of only start/end of input.</li><li><strong><code>s</code> (DotAll):</strong> Allows <code>.</code> to match newline characters across multi-line blocks.</li><li><strong><code>u</code> (Unicode):</strong> Enables accurate emoji surrogate pairs and Unicode property classes like <code>\p{Letter}</code>.</li></ul><h3>Commenting Complex Patterns in Production</h3><p>Even valid regular expressions turn opaque six months later. Always verify edge cases—empty strings, trailing punctuation, international Unicode accents—inside live tests and document non-obvious lookaheads beside code constants.</p>
