    name: Youtube Calculator
    icon: calculator
    category: Calculators
    description: Estimate YouTube channel earnings from views, RPM, and CPM. Project revenue, sponsorships, and growth. Free for creators, no sign-up. Sponsorships counted too.
    keywords:
