      desc: Check your permissible DOB window, multi-exam eligibility matrix, and download a structured PDF eligibility report.
    howto_calculate: Subtract your Date of Birth from the official Cutoff ("As On") Date using exact UTC calendar month lengths to obtain Years, Months, and Days. Compute effective maximum age as Base Upper Limit + Category Relaxation (0 on defence exams like NDA/CDS). Permissible birth dates run from (Cutoff − Effective Max + 1 day) through (Cutoff − Min Age) for inclusive notification windows, e.g., 02 Aug 1994 to 01 Aug 2005 for UPSC 2026 General (21–32).
    about_title: About the Exam Age Limit & Eligibility Calculator
    about_body: "<p>The Exam Age Limit Calculator is an accurate <strong>government exam age calculator by date of birth</strong> engineered for UPSC, SSC, Banking, Railway, Defence, and medical aspirants. Instead of generic birthday math, it models official recruitment cutoff dates, inclusive birth-date boundaries, attempt caps, and category relaxations in one dashboard.</p> <h3>Specialized Presets for Major Notifications</h3> <ul>\n  <li><strong>UPSC Age Eligibility and Attempts Calculator:</strong> Computes exact age for IAS/IPS/IFS cutoffs, remaining attempts (<code>6</code> Gen, <code>9</code> OBC/PwBD, <code>Unlimited</code> SC/ST), and permissible birth dates.</li>\n  <li><strong>Age as on 1 August Exam Calculator &amp; SSC CGL Age Limit Calculator:</strong> Covers <code>18-27</code>, <code>18-30</code>, and <code>18-32</code> Group B/C posts plus <strong>SSC GD age limit calculator DOB</strong> checks on January 1 cutoffs.</li>\n  <li><strong>OBC Age Relaxation Calculator for Govt\
      \ Exams:</strong> Applies <code>+3</code> years OBC, <code>+5</code> years SC/ST, and <code>+10/+13/+15</code> years PwBD relaxations—while automatically disabling relaxation on strict Defence entries.</li>\n  <li><strong>NDA Age Eligibility Calculator &amp; NEET Age Limit Calculator Online:</strong> Supports fractional brackets (<code>16.5-19.5</code> years for NDA, <code>17.5-21</code> for Agniveer) and December 31 17+ verification for NEET UG.</li>\n</ul> <h3>Exam Age Rules &amp; Cutoff Reference Table</h3> <table class=\"table\">\n  <thead>\n    <tr><th>Exam</th><th>Base Age Limit</th><th>Standard Cutoff</th><th>Category Relaxation</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>UPSC CSE (IAS/IPS)</td><td>21 – 32 yrs</td><td>1 August</td><td>OBC +3y · SC/ST +5y · PwBD +10–15y</td></tr>\n    <tr><td>SSC CGL / CHSL</td><td>18 – 27 / 30 / 32 yrs</td><td>1 August / 1 Jan</td><td>OBC +3y · SC/ST +5y · PwBD +10–15y</td></tr>\n    <tr><td>SSC GD Constable</td><td>18 – 23 yrs</td><td>1 January</td><td>OBC\
