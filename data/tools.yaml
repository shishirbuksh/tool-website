    - q: What is the mathematical collision probability of 122-bit random UUID v4 IDs?
      a: Under birthday-paradox math across 2^122 (~5.3 × 10^36) possibilities, generating 1 billion UUIDs per second for 85 years yields only about a 50% chance of a single duplicate.
