      a: Type your text, choose linear, radial, or conic gradient, then add and position color stops. The tool layers a gradient background with background-clip:text and transparent fill to paint the gradient inside the letters. Preview updates live as you edit.
    - q: Can I use gradient text with Tailwind CSS?
      a: Yes. Copy the Tailwind output using bg-clip-text and text-transparent with bg-gradient-to-r / from- / via- / to- utilities. The tool generates both standard CSS and Tailwind v3/v4 classes so you can paste directly into your project.
    - q: Why does my gradient text not work in Safari or older Chrome?
      a: WebKit browsers require vendor prefixes. Always include -webkit-background-clip:text alongside background-clip:text, and set both color:transparent and -webkit-text-fill-color:transparent. The tool outputs all four lines by default so Safari renders correctly.
    - q: Is gradient text accessible? How do I check contrast?
      a: Gradient text can fail contrast if stops are too light. Test the lightest stop against the page background with our color-contrast-checker to meet WCAG AA (4.5:1 for body text). Use darker stops, add a fallback color, and avoid thin fonts for small sizes.
