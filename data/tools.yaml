    about_title: About the SERP Preview & Meta Tag Analyzer
    about_body: <p>The <strong>Google SERP Snippet &amp; Pixel Width Previewer</strong> simulates real desktop (~580px title / ~920px description) and mobile search results alongside live pixel meters, truncation warnings, bold keyword matching, and schema-style breadcrumb formatting.</p><h3>Why Pixel Width Matters More Than Naive Character Counts</h3><p>Google renders SERP titles in proportional fonts (Arial/Roboto-like metrics), not monospace characters. A 55-character uppercase headline containing wide letters like <code>W</code> and <code>M</code> routinely blows past 600px and gets cut with <code>...</code>, whereas 63 characters filled with slim lowercase letters like <code>i</code>, <code>l</code>, and <code>t</code> can fit unscathed. Our canvas text measurement replicates font-width truncation honestly so key callouts survive.</p><h3>Actionable Snippet Tweaks for Higher Organic CTR</h3><ul><li><strong>Put Actionable Benefit Before Brand:</strong> Lead with the calculator or answer
      ('Free EMI &amp; Loan Amortization Calculator | Brand') rather than leading with the site name.</li><li><strong>Use Active Verbs in Descriptions:</strong> Frame concrete benefits in the first 120 characters so mobile users understand what happens after clicking.</li></ul><h3>Matching Search Intent Before Optimizing Pixels</h3><p>Clean non-truncated 570px titles still underperform if copy sounds vague. Mirror the exact user deliverable—formula, printable template, free calculator, or step-by-step guide—alongside a differentiator like 'Zero Sign-Up' or 'Updated 2026'.</p>
