      title: Pick a Board, Exam, or Stream Preset
      desc: Choose CBSE Class 10 (6 Subjects), CBSE Class 12 PCM, CBSE Class 12 PCB, ICSE Class 10, or ISC Class 12 Best of 4.
    - step: 2
      title: Select Mode and Best-of Subject Rule
      desc: Switch between Best-of-5 / Board, PCM / PCB Eligibility (JEE, NEET, BITSAT), or Total Marks to Percentage conversion.
