    name: Mortgage Overpayment Calculator
    icon: calculator
    category: Calculators
    description: See interest saved and years cut with extra mortgage payments. Monthly, yearly, or lump sums with schedule. Free, no sign-up. Extra monthly or lump sums work.
    keywords:
    - free mortgage overpayment calculator online
    - overpayment tenure vs emi cut calculator
