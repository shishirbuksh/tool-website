    faqs:
    - q: How many key depressions are required in the SSC CGL DEST typing test?
      a: SSC CGL Tier-2 Data Entry Speed Test (DEST) requires typing a passage of approximately 2,000 key depressions in 15 minutes, which equals 8,000 Key Depressions Per Hour (KDPH) or roughly 26 to 27 words per minute assuming five characters per word.
    - q: How does SSC calculate Full Mistakes, Half Mistakes, and Error Percentage?
      a: SSC treats every omitted word, wrong or misspelled word, and extra added word as 1.0 Full Mistake, while spacing, capitalization, and punctuation errors count as 0.5 Half Mistake. Weighted errors equal Full + (0.5 × Half), divided by total passage words and multiplied by 100.
    - q: What speed is needed for SSC CHSL and RRB NTPC typing skill tests?
      a: SSC CHSL LDC and JSA posts require 35 WPM in English (10,500 KDPH or about 1,750 key depressions in 10 minutes), whereas RRB NTPC English typing requires 30 WPM (1,500 key depressions or 300 words in 10 minutes) with strict 5% error limits.
    - q: Can I practice an exam typing test without backspace or live color highlights?
      a: Yes. Uncheck Allow Backspace to block Backspace and Delete keys during practice—matching strict RRB NTPC rules—and turn off Live Highlight to replicate the neutral unhighlighted passage view used in official TCS iON exam centers.
    - q: How is Key Depressions Per Hour (KDPH) calculated from net characters?
      a: Multiply total final typed characters (including spaces) by 60 and divide by minutes elapsed. For example, typing 2,000 key depressions cleanly inside a 15-minute drill equals (2000 ÷ 15) × 60 = 8,000 KDPH.
    - q: Can I calculate SSC Error % from an offline drill without retaking the typing test?
      a: Yes. Switch to the SSC Error & KDPH Calculator tab, enter your typed key depressions, word count, Full Mistakes, Half Mistakes, and elapsed minutes to immediately compute Net WPM, Gross WPM, KDPH, and category qualification status.
    - q: Can I paste custom passages and export my typing test scorecard as PDF?
      a: Yes. Choose Custom Passage in the passage dropdown to paste previous-year papers (minimum 15 words), then download a single-page PDF performance report detailing Net WPM, KDPH, and full versus half mistake counts right in your browser.
    howto_steps:
    - step: 1
      title: Pick Your Competitive Exam Preset
      desc: Select SSC CGL DEST (15m / 2000 KD), SSC CHSL (10m / 35 WPM), RRB NTPC (30 WPM strict), CPCT High Court (40 WPM), or 1-Min Warmup.
    - step: 2
      title: Configure Passage, Error Limit & Exam Toggles
      desc: Choose a built-in or custom passage, set 5%/7%/10%/20% category tolerance, and toggle Backspace lock or Exam Neutral mode.
    - step: 3
      title: Type Passage or Run SSC Error Calculator
      desc: Start typing (timer starts on first keystroke) or open SSC Error & KDPH Calculator for offline full/half mistake scoring.
    - step: 4
      title: Review Word-by-Word Diff & Download PDF
      desc: Inspect color-coded Full, Half, Omitted, and Extra words, save progress locally, or export a PDF report.
    howto_calculate: Divide final typed key depressions by 5 and by elapsed minutes to find Gross WPM, subtract weighted mistakes (Full Mistakes + 0.5 × Half Mistakes) per minute for Net WPM, multiply key depressions per minute by 60 for KDPH, and divide total weighted errors by evaluated passage words to verify whether SSC Error % stays under your post limit.
    about_title: About the Exam Typing Speed Test & SSC Error Calculator
    about_body: "<p>The Exam Typing Speed Test is built specifically for Indian competitive skill examinations rather than casual speed games. Whether you need an authentic <strong>ssc cgl typing test online</strong> for Tier-2 DEST, an <strong>ssc chsl typing speed test 35 wpm</strong> drill, or strict skill-test simulation, every timer, mistake rule, and report matches real notification criteria.</p> <h3>Official Exam Modes &amp; SSC Evaluation Features</h3> <ul>\n  <li><strong>2000 Key Depressions in 15 Minutes Test &amp; DEST Typing Test Practice Online:</strong> Pre-loaded passages exceed 2,150 characters so candidates finish genuine 15-minute SSC CGL Data Entry drills targeting 8,000+ KDPH cleanly.</li>\n  <li><strong>RRB NTPC Typing Test Online Free &amp; CPCT Support:</strong> Simulate 30 WPM RRB NTPC and 40 WPM High Court / CPCT benchmarks in seconds.</li>\n  <li><strong>Exam Typing Test Without Backspace &amp; Neutral View:</strong> Lock Backspace/Delete keys to practice strict\
      \ RRB rules and switch off live green/red highlights to build composure before TCS iON exams.</li>\n  <li><strong>Typing Error Percentage Calculator SSC &amp; Key Depressions Per Hour Calculator:</strong> Automatically aligns words to distinguish Full Mistakes (wrong, omitted, extra = 1.0) from Half Mistakes (capitalization, punctuation, extra spaces = 0.5)—plus a dedicated manual calculator tab for offline drills.</li>\n</ul> <h3>Exam Typing Benchmarks Comparison</h3> <table class=\"table\">\n  <thead>\n    <tr><th>Exam / Post</th><th>Target Speed / KDPH</th><th>Duration &amp; Error Cap</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>SSC CGL Tier-2 (DEST)</td><td>2,000 Key Depressions (~8,000 KDPH / ~27 WPM)</td><td>15 mins · 20% UR (5–10% stricter posts)</td></tr>\n    <tr><td>SSC CHSL (LDC / JSA / DEO)</td><td>35 WPM English (~10,500 KDPH / 1,750 KD)</td><td>10 mins · 7% UR / 10% Reserved</td></tr>\n    <tr><td>RRB NTPC Typing Skill Test</td><td>30 WPM English (~9,000 KDPH / 1,500\
      \ KD)</td><td>10 mins · Backspace off · 5% error</td></tr>\n    <tr><td>CPCT / High Court Clerk</td><td>40 WPM English (~12,000 KDPH / 2,000 KD)</td><td>10 mins · Strict 5% error limit</td></tr>\n  </tbody>\n</table> <p>Pair your typing prep inside our <a href=\"/student-tools\">Student Hub</a> with the <a href=\"/tool/negative-marking-calculator\">Negative Marking Calculator</a>, <a href=\"/tool/exam-age-eligibility-calculator\">Exam Age Limit Calculator</a>, <a href=\"/tool/exam-photo-signature-resizer\">Exam Photo &amp; Signature Resizer</a>, <a href=\"/tool/pomodoro-timer\">Pomodoro Study Timer</a>, and <a href=\"/tool/word-counter\">Word Counter</a>.</p>"
