    about_title: About the Airdrop Finder
    about_body: <p>The <strong>Web3 Sybil Hygiene Checklist &amp; Historical TGE Benchmarks</strong> tool helps blockchain users audit operational safety and study past token generation events—without connecting a wallet, signing transactions, or exposing public addresses.</p><h3>How Past Token Distributions Filtered Eligible Wallets</h3><p>Major historical distributions such as Arbitrum (March 2023), Optimism, Starknet, Jupiter, and EigenLayer applied multi-factor anti-Sybil filters after snapshot dates. Common disqualifiers included funding dozens of wallets from a single exchange deposit address inside one narrow block window, repeating identical swap sizes purely to pad transaction counts, and holding zero native gas residue at snapshot time. Studying those published criteria helps researchers distinguish genuine protocol usage from automated farming noise.</p><h3>Wallet Isolation Checklist Before Interacting With Claim Portals</h3><ul><li><strong>Separate Vault vs. Interaction Wallets:</strong>
