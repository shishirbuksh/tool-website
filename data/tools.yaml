      a: You add wallets (e.g., Hot Wallet, Exchange, Cold Storage) and enter each token symbol, balance, and price per wallet. The tracker calculates combined portfolio value, per-wallet totals, percentage allocation, and a diversification score across all your holdings. No data is sent to any server.
    - q: What is a diversification score?
      a: The diversification score measures how spread out your portfolio is across all tokens using the Herfindahl-Hirschman Index method. A score above 70 is well-diversified. Below 40 means heavy concentration in one asset. Track multiple wallets to see your true overall diversification.
    - q: Why track multiple wallets?
      a: Most people use several wallets for different purposes — a hot wallet for daily use, an exchange wallet for trading, and cold storage for savings. Tracking them together gives a complete picture of your crypto portfolio and helps you manage risk across all your addresses.
    - q: Is my data stored or shared?
      a: No. All calculations happen entirely in your browser. No wallet addresses, balances, or prices are stored or transmitted. Your data stays on your device.
    - q: How often should I update prices?
      a: You should update prices whenever you check your portfolio for an accurate valuation. Crypto prices change rapidly, so the values shown are only as current as the prices you enter.
    - q: Where does the Wallet Address Tracker get its data?
      a: Balances read from public chain explorers for addresses you add, with per-wallet breakdowns. Private keys are never requested, stored or transmitted.
    - q: How accurate are the predictions?
      a: Tracking mirrors public chain data for your added addresses in real time. Cost-basis views depend on figures you enter. Portfolio tracking only, never financial advice.
    - q: How often is the data refreshed?
      a: Live prices stream from public crypto APIs each session with daily-close history for consistency. Recalculation pulls fresh quotes on demand, while your inputs and wallet addresses stay local in your browser.
    - q: Is my data secure?
      a: Yes. All analysis happens in your browser or through encrypted channels. We never store your wallet addresses or trading data. Added addresses stay in local page memory.
    howto_steps:
    - title: Add your wallets
      desc: Click Add Wallet and give each wallet a label (e.g., Hot Wallet, Exchange, Cold Storage).
    - title: Add tokens to each wallet
      desc: For each wallet, click Add Token and enter the symbol, balance, and current market price.
    - title: Review your global portfolio
      desc: See total combined value, wallet count, total tokens, and overall diversification score.
    - title: Check per-wallet breakdown
      desc: Review each wallet's contribution and the combined holdings table to understand your full portfolio distribution.
    howto_calculate: Total value = sum of all (balance * price) across all wallets. Wallet contribution % = (wallet total / grand total) * 100. Allocation % per token = (token value / grand total) * 100. Diversification score = 100 - Herfindahl Index (sum of squared allocation shares * 100). A perfectly equal portfolio scores 100, a single-asset portfolio scores 0.
