    about_title: About the Crypto Fear Greed Index Tracker
    about_body: <p>The <strong>Crypto Fear &amp; Greed Index Tracker</strong> displays the 0–100 sentiment gauge alongside historical 30-day context to help market observers spot emotional extremes without chasing headlines.</p><h3>How the Six Underlying Sentiment Components Work</h3><p>Published by Alternative.me for Bitcoin and broader digital asset sentiment, the composite score blends <strong>Volatility (25%)</strong> (comparing current drawdowns against 30-day and 90-day averages), <strong>Market Momentum &amp; Volume (25%)</strong> (measuring buying volume spikes against recent norms), <strong>Social Media Activity (15%)</strong>, <strong>Dominance (10%)</strong> (BTC share shifts signaling defensive rotation), <strong>Google Trends Search Interest (10%)</strong>, and periodic surveys when active.</p><h3>Interpreting Extremes Without Mechanical Overconfidence</h3><ul><li><strong>Extreme Fear (0–24):</strong> Signals forced liquidations or panic selling, yet prices can remain depressed
