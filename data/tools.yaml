    howto_calculate: <p>Maturity equals <code>P × (1 + r/4)^(4×t)</code> with quarterly compounding. Interest equals maturity minus principal. Post-tax yield subtracts TDS per slab; senior-citizen rates add ~50 bps before the same math.</p>
    about_title: About the FD Calculator
    about_body: <p>The <strong>Fixed Deposit (FD) Maturity Calculator</strong> calculates quarterly, monthly, half-yearly, and annual compounding interest returns—plus standard bank senior-citizen rate bumps and TDS impact planning—for Indian and global term deposits.</p><h3>Quarterly Bank Compounding Formula &amp; Worked Deposit Example</h3><p>Indian scheduled banks compound Cumulative FDs quarterly using <code>Maturity = P &times; (1 + r &divide; 400)^(4 &times; t)</code>. Locking <strong>₹5,00,000 for 3 years at 7.25% p.a.</strong> quarterly compounded returns <strong>₹6,20,273</strong>—earning <strong>₹1,20,273</strong> in cumulative interest (effective annualized yield <strong>7.45%</strong> vs. 7.25% simple). Senior citizens (60+) typically receive an extra +0.50% (7.75%), raising maturity to ₹6,29,431.</p><h3>FD Taxation &amp; Laddering Best Practices</h3><ul><li><strong>Bank TDS Thresholds:</strong> Banks deduct 10% TDS (20% without PAN) when aggregate annual FD interest at a bank
      exceeds statutory Exemption limits unless eligible Form 15G/15H is submitted.</li><li><strong>FD Laddering for Liquidity:</strong> Splitting ₹6L into 1-, 2-, and 3-year deposits avoids 0.5%–1.0% premature withdrawal penalties if urgent cash is needed.</li><li><strong>DICGC Insurance Ceiling:</strong> Deposit insurance covers up to ₹5 lakh combined principal + interest per bank per depositor right.</li></ul>
