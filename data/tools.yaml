    about_title: About the Burn Rate Calculator
    about_body: '<p>The <strong>Startup Burn Rate &amp; Runway Calculator</strong> tracks gross cash outflow, net monthly burn after revenue, zero-cash date, and default-alive horizon so founders can time hiring and fundraising milestones accurately.</p><h3>Worked Runway Example: Gross Burn vs. Net Burn</h3><p>Suppose a seed-stage SaaS team holds <strong>$900,000 cash in the bank</strong>, spends <strong>$78,000/month</strong> on payroll, cloud infrastructure, and marketing (Gross Burn), and collects <strong>$28,000/month</strong> in cash receipts. Net Burn is <strong>$50,000/month</strong>, yielding <strong>18.0 months of runway</strong>. Notice that if an enterprise anchor customer churns ($15,000/month drop), net burn spikes to $65,000/month and runway compresses instantly to 13.8 months—even though spending never rose.</p><h3>Three Cash Traps Founders Overlook</h3><ul><li><strong>Bookings vs. Cash Collected:</strong> Multi-month unpaid invoices boost ARR on paper while leaving bank balances
