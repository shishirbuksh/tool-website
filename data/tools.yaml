    howto_calculate: <p>Future value equals <code>P × (1 + r/n)^(n×t)</code> plus monthly deposits compounded each period, where P is lumpsum principal, r is annual rate, n is compounding frequency (1, 2, 4 or 12), and t is years. Effective annual rate equals <code>(1 + r/n)^n − 1</code>. Use Rule of 72 (72 ÷ rate) to estimate doubling time, then compare lumpsum vs SIP growth in the year-by-year table.</p>
    about_title: About the Compound Interest Calculator
    about_body: <p>The <strong>Compound Interest Calculator</strong> projects investment and high-yield savings growth using periodic compounding (daily, monthly, quarterly, or annually) plus regular monthly contributions and optional annual deposit escalation.</p><h3>Exact Compounding &amp; Worked Comparison Example</h3><p>For an initial principal <code>P</code>, nominal annual rate <code>r</code>, compounding periods per year <code>n</code>, and time <code>t</code> years, base growth is <code>P &times; (1 + r/n)^(n&times;t)</code>. Starting with <strong>$5,000</strong> plus <strong>$250/month</strong> for <strong>15 years at 7% compounded monthly</strong> deposits $50,000 total principal ($5k + $45k), yet accumulates roughly <strong>$93,491</strong>—meaning <strong>$43,491</strong> (46.5%) comes solely from compounding returns. Doubling the horizon to 25 years multiplies final value past <strong>$231,000</strong> even with identical monthly saving.</p><h3>Why APY Beats APR When Comparing
      Banks</h3><ul><li><strong>Nominal Rate vs. APY:</strong> 6.00% APR compounded daily yields 6.183% APY, whereas annual compounding yields exactly 6.00%.</li><li><strong>Time Dominance:</strong> Starting five years earlier typically outperforms doubling contributions a decade later.</li><li><strong>Inflation Reality Check:</strong> Subtract expected ~2.5%–3.5% annual inflation from nominal returns to judge future purchasing power.</li></ul>
