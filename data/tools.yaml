    faqs:
    - q: How does the Compound Calculator work?
      a: Enter lumpsum principal, monthly deposit, annual rate, years and compounding frequency (1/2/4/12), then press Compute. The tool applies FV = P×(1+r/n)^(n×t) plus recurring deposits locally, showing total value, contributions, interest and effective annual rate in a year-by-year table.
    - q: Should I choose lumpsum or SIP monthly deposits for faster growth?
      a: Lumpsum benefits from full-period compounding while SIP monthly deposits smooth market timing and build discipline. Enter the same rate and years with P=0 plus $500/month versus P=$50,000 plus $0/month to compare totals, then check Rule-of-72 doubling and effective annual rate to decide.
    - q: How does Rule of 72 estimate doubling time?
      a: Divide 72 by your annual rate to estimate years to double — e.g. 8% doubles in about 9 years. The calculator confirms this with exact FV math across annual, quarterly and monthly compounding frequencies, so you can see why higher frequency shortens doubling slightly.
    - q: Is my data safe when using Compound Calculator?
      a: Absolutely. All lumpsum, deposit and rate inputs are processed locally in your browser with local-storage memory. Your data never touches any server and is never stored or tracked.
    - q: What is compound interest?
      a: Compound interest is interest calculated on the initial principal plus all accumulated interest from previous periods. Your money grows faster over time because you earn interest on your interest — this is called the snowball effect.
    - q: How often should I compound my investments?
      a: Higher compounding frequency means faster growth. Monthly compounding earns more than annual, and daily earns more than monthly. Most savings accounts compound daily, while investments like FDs may compound quarterly or annually.
    - q: What is the difference between simple and compound interest?
      a: Simple interest is calculated only on the principal amount every year. Compound interest is calculated on the principal plus all interest already earned. Over 10 years at 8%, $10,000 earns $8,000 with simple interest but $11,589 with monthly compound interest.
    - q: Can I add monthly contributions?
      a: Yes. Enter a monthly contribution amount and the calculator adds it each month before applying interest. Regular contributions dramatically boost your total value — try comparing $0 vs $500/month to see the difference.
