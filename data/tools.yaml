    faqs:
    - q: What is a headline score?
      a: A headline score is a 0-100 rating that measures how effective your headline is based on structure, word balance, emotional appeal, and readability. Higher scores indicate stronger headlines.
    - q: What makes a great headline?
      a: Great headlines are 6-12 words (40-65 characters), use power words and emotional triggers, have a clear format (How-to, List, Question, or Command), and read at a grade 6-8 level.
    - q: What's the ideal headline length?
      a: The ideal headline length is 40-65 characters or 6-12 words. Headlines under 30 characters are too short to convey value. Headlines over 80 characters risk being truncated in search results.
    - q: Why use a headline analyzer?
      a: A headline analyzer gives you objective, data-backed feedback on your headlines before you publish. It helps you catch structural issues, improve emotional impact, and optimize for both readers and search engines.
    - q: How is the headline score calculated?
      a: 'The score has four components: Structure (35 points) — word/character count, type, numbers, keyword placement. Word Balance (25 points) — power words, emotional words, uncommon words vs filler. Emotion (20 points) — sentiment, urgency, curiosity gap. Readability (20 points) — grade level, word length, alliteration.'
