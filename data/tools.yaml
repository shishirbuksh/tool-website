    about_body: <p>The <strong>Crypto Red Flag Self-Assessment Tool</strong> is a structured, transparent research checklist designed to walk users systematically through token contract, team, liquidity, and distribution risk signals—without claiming automated scam detection.</p><h3>Why Transparent Checklists Beat Opaque 'Safe/Unsafe' Badges</h3><p>No browser page alone can certify that an audited smart contract won't fail via admin multisig keys, cross-bridge exploits, or social-engineering drains. Instead, this checklist teaches independent verification across <strong>20-point high-severity triggers</strong> (guaranteed yield promises, unverified explorer source code, unlocked LP tokens, mint/blacklist owner privileges, urgent DM pressure) and <strong>10-point medium-severity cues</strong> (anonymous founders, recycled whitepapers, skewed unlock cliffs).</p><h3>Recommended Primary Verification Workflow</h3><ul><li><strong>Inspect Source &amp; Holder Distribution:</strong> Check Etherscan/Solscan
