      desc: Select HTTP method from the dropdown. Enter the full API URL. Add optional auth, query params, headers, and body.
    - title: Use Auth Presets
      desc: Open Authentication section. Choose Basic Auth (username/password), Bearer Token, or API Key. Credentials auto-fill the Authorization header.
    - title: Send & Inspect
      desc: Click Send or press Ctrl+Enter. View color-coded status, timing, size, response headers, and formatted body. Toggle Raw/Pretty view.
    - title: Save & Reuse
      desc: Click Save to store requests in a collection. Browse them in the Saved tab, reload, or export/import as JSON files.
    - title: Generate Code
      desc: Click the Code button to generate cURL, Python (requests), or JavaScript (fetch) snippets. Copy with one click.
    howto_calculate: <p><strong>Making Requests:</strong> The API tester uses the browser's Fetch API. Select a method, enter a URL, add headers/body, and press Send or Ctrl+Enter.</p><p><strong>Authentication:</strong> Use the Auth section for Basic Auth (Base64-encoded), Bearer Token, or API Key headers. Auth headers are automatically synced with the Headers section.</p><p><strong>Saved Collections:</strong> Save requests with custom names. Browse, load, or delete saved requests from the Saved tab. Export all as JSON or import collections from a file.</p><p><strong>Code Generation:</strong> Generate cURL, Python (requests library), or JavaScript (fetch API) code snippets from the current request.</p><p><strong>Response Analysis:</strong> Color-coded status codes (2xx green, 3xx blue, 4xx orange, 5xx red), response time, size, and headers.</p>
    about_title: About the API Tester
    about_body: '<p>The <strong>Browser HTTP &amp; REST API Tester</strong> dispatches GET, POST, PUT, PATCH, DELETE, and HEAD requests with custom headers, bearer tokens, JSON payloads, response latency timing, and formatted payload inspection directly inside your browser.</p><h3>Worked Debugging Walkthrough: Diagnosing 401 vs. CORS Errors</h3><p>When testing an external JSON endpoint such as <code>https://api.example.com/v1/users</code>, a clean <strong>200 OK in 118 ms</strong> confirms payload serialization and status headers. If DevTools instead reports a network failure while <code>curl</code> works in terminal, the server lacks an <code>Access-Control-Allow-Origin</code> response header allowing browser preflight (<code>OPTIONS</code>) requests—saving you from chasing nonexistent backend auth bugs.</p><h3>Browser Security Sandbox Boundaries to Keep in Mind</h3><ul><li><strong>Forbidden Browser Headers:</strong> Browsers block JavaScript from spoofing restricted headers like <code>Host</code>,
      <code>Origin</code>, <code>Cookie</code>, or <code>User-Agent</code> per the Fetch spec.</li><li><strong>HTTPS Mixed-Content Blocking:</strong> Calling plain <code>http://</code> LAN servers from an HTTPS page requires testing over HTTPS or using local server CORS headers.</li><li><strong>No Cloud Sync Risk:</strong> Bearer keys and JSON test bodies live only inside browser tab memory—never logged through a third-party proxy.</li></ul>'
