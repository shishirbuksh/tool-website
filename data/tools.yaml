    faqs:
    - q: What is the negative marking calculator formula?
      a: The negative marking calculator formula is Net Marks = (Correct Answers × Marks per Question) − (Wrong Answers × Negative Penalty). When exams specify a fractional ratio instead of fixed marks, Penalty = Marks per Question × (Ratio Numerator ÷ Ratio Denominator), keeping repeating fractions such as 1/3 exact before subtraction.
    - q: How does a 0.25 or 1/4 negative marking calculator work?
      a: Under 1/4 (0.25) negative marking, every wrong answer deducts one-fourth of a question's positive value. On a 1-mark Banking or SSC Prelims question you lose 0.25 marks; on a 2-mark SSC CGL Tier-I question you lose 0.50 marks; and on a 4-mark NEET or JEE Main question you lose 1 full mark.
    - q: How is 1/3 negative marking calculated for UPSC Prelims and SSC CGL Tier-II?
      a: With 1/3 negative marking, dividing by 3 produces a repeating decimal, so rational fraction arithmetic avoids rounding drift. For UPSC Prelims GS Paper I (+2 marks), wrong answers subtract 2 ÷ 3 (0.6667) marks; for CSAT (+2.5 marks), 2.5 ÷ 3 (0.8333) marks; and for SSC CGL Tier-II (+3 marks), exactly 1 mark.
    - q: How do I calculate 0.50 or 1/8 negative marking for GATE, RRB, or SSC GD?
      a: Choose the 1/8 ratio or fixed -0.25/-0.50 mode depending on your exam notification. For example, a 2-mark question with 0.25 penalty uses a 1/8 negative marking ratio (12.5%), whereas a 1-mark exam with -0.50 deduction uses a 1/2 (50%) ratio. Our presets apply these official ratios automatically.
    - q: What is Break-Even Accuracy and how is it calculated correctly?
      a: Break-Even Accuracy is the minimum probability of answering correctly needed so expected score from an attempt equals zero instead of a net loss. The exact formula is Penalty ÷ (Marks per Question + Penalty) × 100 = Ratio ÷ (1 + Ratio) × 100, giving 20% for 1/4 marking, 25% for 1/3 marking, and 11.11% for 1/8 marking.
    - q: Can I calculate marks with negative marking across multiple exam sections?
      a: Yes. Switch to Multi-Section mode to add Quantitative Aptitude, Reasoning, English, and General Awareness—or Physics, Chemistry, and Biology—with independent question counts, positive marks, and penalty rules. The calculator aggregates gross score, total penalty, net score, percentage, accuracy, and sectional breakdowns together.
    - q: How can I calculate negative marking on a standard calculator?
      a: To compute negative marking in a standard calculator, multiply Wrong Answers by the Penalty per wrong answer, store or note that deduction, multiply Correct Answers by Marks per Question, and subtract the deduction. For fractional penalties like 1/3 on 2-mark questions, compute Correct × 2 − (Wrong × 2 ÷ 3) to prevent truncation error.
    - q: How do I download my negative marking scorecard as a PDF?
      a: After entering your attempt details in any mode, select the Download PDF button in the Scorecard Export card. Your browser generates a structured PDF report directly on your device—containing gross marks, negative deductions, net score, accuracy, break-even threshold, and timestamp—without uploading exam data to any server.
