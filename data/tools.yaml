    date_modified: '2026-10-02'
    faqs:
    - q: How do I convert hourly wage to annual salary?
      a: 'Multiply your hourly rate by hours per week, then by 52 weeks. Example: $25/hour × 40 hours × 52 weeks = $52,000 per year. Use the Pay Converter tab.'
    - q: How do I convert annual salary to hourly rate?
      a: 'Divide your annual salary by 52 weeks, then by your weekly hours. Example: $50,000 ÷ 52 ÷ 40 = $24.04/hour.'
    - q: How much tax will I pay on my salary?
      a: Use the Take-Home Pay tab. Enter your annual gross salary and filing status. Uses 2025 US federal tax brackets and standard deduction.
    - q: How do I compare two job offers?
      a: Use the Compare Offers tab. Enter the amount, pay period, and hours per week for each job. The tool converts both to annual salary and shows which pays more.
    - q: How is monthly pay calculated?
      a: 'Monthly pay = annual salary ÷ 12. For hourly workers: hourly rate × hours/week × 52 ÷ 12.'
    - q: How is weekly pay calculated?
      a: Weekly pay = hourly rate × hours per week. Or annual salary ÷ 52 weeks.
    - q: What is the standard deduction for 2025?
      a: For 2025 US federal taxes, the standard deduction is approximately $15,000 for Single filers and $30,000 for Married Filing Jointly.
    - q: What currencies does this calculator support?
      a: 'The Pay Converter supports 16 currencies: USD, EUR, GBP, JPY, INR, CAD, AUD, CHF, CNY, BRL, KRW, SEK, NZD, SGD, HKD, and ZAR.'
    - q: Can I adjust hours per week for the comparison?
      a: Yes. Each job in the Compare Offers tab has its own Hours/Week input, so you can compare different schedules.
    - q: How do I calculate overtime pay?
      a: In the Pay Breakdown tab, enter your annual salary, overtime hours per week, and the overtime multiplier (default 1.5x). The calculator shows your regular weekly pay, overtime pay, and total weekly earnings.
    howto_steps:
    - title: Convert Pay Periods
      desc: In the Pay Converter tab, enter any amount into a pay field. All other periods update instantly.
    - title: Select Currency
      desc: Use the currency dropdown to switch between 16 supported currencies with automatic formatting.
    - title: Estimate Take-Home Pay
      desc: Switch to Take-Home Pay tab. Enter your annual salary and filing status to see estimated federal tax.
    - title: Compare Job Offers
      desc: Use Compare Offers tab to enter two salaries with different periods and hours. See the better deal instantly.
    - title: View Pay Breakdown
      desc: The Pay Breakdown tab shows your pay per period (weekly to monthly) and includes an overtime calculator.
    - title: Plan with Raise & Freelance Tools
      desc: Use Career Planner to simulate raises, calculate freelance rates with overhead, and project savings growth.
    - title: Adjust Your Schedule
      desc: Modify Hours/Week or Days/Week to match your actual work schedule for accurate conversions.
    howto_calculate: <p><strong>Annual from Hourly:</strong> Hourly × Hours/Week × 52</p><p><strong>Annual from Daily:</strong> Daily × Days/Week × 52</p><p><strong>Annual from Weekly:</strong> Weekly × 52</p><p><strong>Annual from Monthly:</strong> Monthly × 12</p><p><strong>Federal Tax (2025 brackets):</strong> Progressive tax with 10% to 37% rates. Taxable income = gross − standard deduction.</p><p><strong>Effective Tax Rate:</strong> Total Tax ÷ Taxable Income × 100</p><p><strong>Overtime Pay:</strong> Overtime Rate = Hourly Rate × OT Multiplier. Overtime Pay = OT Hours × OT Rate. Total Weekly = Regular Weekly + OT Pay.</p><p><strong>Freelance Rate:</strong> Required Rate = (Target Income × (1 + Overhead%)) ÷ Billable Hours.</p><p><strong>Compound Savings (Future Value):</strong> FV = Monthly Savings × ((1 + Monthly Return)^N − 1) ÷ Monthly Return × (1 + Monthly Return). Based on N months of compounding at the annual return rate.</p>
    about_title: About the Salary Calculator
    about_body: <p>This free Salary Calculator is a complete toolkit for understanding your earnings. Use the Pay Converter to instantly convert between hourly, daily, weekly, monthly, and annual pay. The Take-Home Pay tab estimates your 2025 US federal income tax. The Compare Offers tab helps you evaluate two job offers side by side. The Pay Breakdown tab shows your pay across weekly, bi-weekly, semi-monthly, and monthly periods with an overtime calculator. The Career Planner tab lets you simulate raises, calculate freelance rates, and project compound savings growth.</p><p>The Pay Converter supports 16 currencies with automatic locale-aware formatting. All tax calculations use standard deduction amounts and 2025 IRS tax brackets for Single and Married Filing Jointly statuses.</p><p>All calculations run locally in your browser — no data is sent to any server. Free to use, no sign-up required.</p>
