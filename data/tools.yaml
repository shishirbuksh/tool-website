    about_title: About the Crypto Password Generator
    about_body: '<p>The <strong>Crypto Password Generator</strong> produces high-entropy passwords, API secrets, and encryption passphrases entirely offline inside your browser using the Web Cryptography API (<code>crypto.getRandomValues()</code>).</p><h3>Entropy Bits Explained With Concrete Character Math</h3><p>True password strength depends on uniform randomness and alphabet pool size <code>N</code> raised to length <code>L</code>: <code>Entropy = L × log₂(N)</code>. Drawing 12 lowercase-only letters (<code>N = 26</code>) provides only ~56.4 bits—vulnerable to offline GPU cracking clusters. Expanding to a 20-character mixed set (upper, lower, digits, symbols, <code>N ≈ 94</code>) yields <code>20 × 6.55 ≈ 131 bits</code> of entropy, exceeding standard brute-force thresholds by orders of magnitude.</p><h3>Critical Wallet Security Distinction</h3><ul><li><strong>Never Invent Custom BIP-39 Seed Words:</strong> Hardware and software wallets should generate 12-word or 24-word BIP-39 recovery
