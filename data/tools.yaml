    - q: Is the CSS Animation Generator free to use?
      a: Yes, it is completely free with no hidden fees, subscriptions, or usage limits. No sign-up or account required.
    - q: What properties can I animate?
      a: 'You can animate: opacity (0-1), translateX and translateY (-200px to 200px), rotate (-360deg to 360deg), scaleX and scaleY (0-3), background-color (any hex color), border-radius (0-50px), and CSS filter values (grayscale, blur, sepia, etc.).'
    - q: What easing options are available?
      a: 'Choose from standard CSS easings: ease, linear, ease-in, ease-out, and ease-in-out. For advanced control, select cubic-bezier and enter your own control point values (x1, y1, x2, y2) for a fully custom easing curve.'
    - q: Can I control how many times the animation repeats?
      a: Yes, set a specific iteration count (1-99) in the Timing panel, or check the Infinite box to make the animation loop forever.
    - q: What is the difference between fill modes?
      a: Fill modes control the element's state before and after the animation. None (default) — the element snaps back. Forwards — retains the last keyframe's styles. Backwards — applies the first keyframe's styles during the delay. Both — combines forwards and backwards behavior.
    - q: Can I copy the animation code?
      a: Yes, the CSS Output panel shows the complete @keyframes rule and the animation property. Click Copy CSS to copy both to your clipboard, ready to paste into your project.
    howto_steps:
    - title: Add Keyframe Stops
      desc: Click anywhere on the timeline track to add a keyframe stop, or start with the default 0% and 100% stops.
    - title: Adjust Properties
      desc: Select a keyframe stop and use the sliders to set opacity, translate, rotate, scale, background color, and border radius for that point in the animation.
    - title: Set Timing
      desc: Configure duration, delay, iteration count, direction, fill mode, and easing curve. Choose preset easings or enter a custom cubic-bezier.
