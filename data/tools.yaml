      desc: Explore the Overview, Projection, Drawdown, and Compare tabs to evaluate your retirement readiness.
    howto_calculate: '<p>Each year of accumulation is modeled as: <code>balance = balance + (monthly_contribution × 12) + (balance × annual_return_rate)</code>. Traditional and Roth balances are tracked separately. During drawdown, withdrawals are taxed at your expected retirement rate based on the Traditional portion. Monte Carlo runs 2000 simulations with normally-distributed random returns. Goal Seek uses binary search to find the minimum monthly contribution that achieves success.</p>'
    about_title: About the Retirement Planning Calculator
    about_body: <p>The <strong>Retirement Nest Egg &amp; Contribution Escalation Calculator</strong> models long-term portfolio growth with annual salary-linked deposit increases, expected inflation adjustment, and sustainable withdrawal longevity for 401(k), IRA, NPS, or index portfolios.</p><h3>Worked Nest-Egg Example With 3% Contribution Escalation</h3><p>Starting at age 30 with <strong>$25,000 saved</strong> and contributing <strong>$600/month</strong> at an illustrative <strong>7.5% nominal return</strong> reaches roughly <strong>$1.49 million by age 65</strong>. Enabling just <strong>3% annual contribution escalation</strong> (mirroring modest raises) lifts the projected age-65 portfolio past <strong>$2.06 million</strong>—adding nearly $570,000 without feeling painful in year one. Applying a <strong>4% initial withdrawal rule</strong> supports ~$82,400/year gross (~$6,866/month) before taxes.</p><h3>Critical Risks to Stress-Test Before Retiring</h3><ul><li><strong>Sequence-of-Returns
      Risk:</strong> A sharp bear market in the first 3–5 years of withdrawals harms portfolio longevity far more than a dip later in retirement.</li><li><strong>Real vs. Nominal Dollars:</strong> Adjust retirement target spending upward for 2.5%–3.5% annual inflation over multi-decade horizons.</li><li><strong>Tax Bucket Diversification:</strong> Splitting pre-tax (Traditional 401k) and tax-free (Roth) accounts lowers future tax bracket spikes.</li></ul>
