      a: A grade of B+ (80/100) or higher is publish-ready. Grades below C (65) have critical readability, structure, or SEO issues that should be addressed.
    - q: What is entity density and why does it matter for AI?
      a: Entity density measures how many named entities (brands, dates, prices, metrics) appear in each paragraph. AI/LLM retrieval systems favor content with 4-7 entities per paragraph because it signals factual depth and verifiability.
    - q: What keyword density is ideal?
