    faqs:
    - q: How do I convert CGPA to Percentage for VTU 2015, 2018, 2021, and 2022 schemes?
      a: Under Visvesvaraya Technological University (VTU) rules, the 2021 and 2022+ schemes multiply directly by 10 (Percentage = CGPA × 10), whereas the older 2015 and 2018 CBCS batches subtract 0.75 first ((CGPA − 0.75) × 10). Pick either VTU preset directly in the dropdown above.
    - q: What is the official MAKAUT / WBUT CGPA to Percentage formula?
      a: Maulana Abul Kalam Azad University of Technology (MAKAUT, formerly WBUT) defines Percentage = (CGPA − 0.75) × 10. For example, an 8.20 CGPA converts to (8.20 − 0.75) × 10 = 74.50%, and our converter applies that exact offset automatically.
    - q: How does CBSE convert CGPA to Percentage and how does Mumbai University differ?
      a: CBSE specifies Percentage = CGPA × 9.5 for indicative scores, whereas Mumbai University Engineering CBCS uses the linear equation Percentage = (7.1 × CGPA) + 11 (and 7.4 × CGPA + 12 in select non-engineering faculties). Anna University R2021+ and DU NEP 2022+ multiply CGPA × 10.
    - q: How do you convert semester-wise SGPA to CGPA accurately?
      a: Always weight each semester by its earned credits using CGPA = sum(SGPA_i × Credits_i) ÷ sum(Credits_i). Taking a simple average across semesters only matches exact university transcripts when every semester carries identical total credits; our SGPA tab supports both weighted and equal-credit modes.
    - q: Can I calculate semester SGPA directly from subject grades and credits?
      a: Yes. Switch to the Grades → SGPA tab, add your courses, pick 10-point letter grades (O=10, A+=9, A=8, B+=7, B=6, C=5, P=4) and course credits, and compute both exact semester SGPA and converted percentage under your university formula.
    - q: How can I reverse-convert Marks Percentage back to CGPA?
      a: Open the % → CGPA tab to apply the exact algebraic inverse CGPA = (Percentage − Offset) ÷ Multiplier for your university—for instance dividing by 9.5 for CBSE, adding 7.5 then dividing by 10 for MAKAUT/VTU 2018, or subtracting 11 then dividing by 7.1 for Mumbai Engineering.
    - q: Can I download my CGPA / SGPA academic summary as a PDF?
      a: Yes. Select PDF Report in the output panel to generate a clean PDF containing your selected university formula, CGPA, Percentage, division classification, indicative 4.0 US GPA estimate, and semester or course rows directly in your browser.
