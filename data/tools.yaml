    - title: Compare Headlines (Optional)
      desc: Switch to Compare mode to test two headlines side by side and see which one scores higher.
    about_title: About the Headline Analyzer
    about_body: '<p>The <strong>SEO &amp; Editorial Headline Analyzer</strong> evaluates blog, news, and landing-page H1s across character/pixel length, emotional &amp; power-word density, question/list structure, sentiment clarity, and target keyword placement.</p><h3>Worked Headline Rewrite: Turning Generic Titles Into High-CTR Queries</h3><p>Compare a vague draft like <em>''Tips About Email Marketing''</em> (26 chars, weak specificity) against <em>''9 Cold Email Subject Lines That Lifted B2B Replies 34%''</em> (53 chars, concrete number, specific outcome, clear B2B reader). The revision fits comfortably under Google''s ~580px desktop title truncation bar while satisfying searchers scanning SERPs for actionable benchmarks rather than fluff.</p><h3>What Balanced Editorial Scoring Rewards</h3><ul><li><strong>Front-Loaded Primary Intent:</strong> Put your core noun or modifier in the first 3–5 words so mobile SERP users read topic relevance immediately.</li><li><strong>Avoid Clickbait Over-Scoring:</strong>
      Real readers punish hollow ''One Weird Trick'' hype with quick pogo-stick bounces back to search results.</li><li><strong>Pair Title Tag + H1 Intentionally:</strong> Match topical meaning closely while trimming brand suffixes only inside `&lt;title&gt;`.</li></ul><h3>Testing CTR Improvements Over Time</h3><p>Pair headline scoring with real Google Search Console impression-to-click data after publishing. Headlines that promise concrete benchmarks, checklists, or named frameworks consistently earn stronger organic clicks than clickbait curiosity gaps.</p>'
