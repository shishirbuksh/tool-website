    about_title: About the CAC Calculator
    about_body: <p>The <strong>Customer Acquisition Cost (CAC) Calculator</strong> computes true fully loaded acquisition cost, LTV:CAC unit economics, and gross-margin-adjusted payback period so growth teams avoid scaling unprofitable ad channels.</p><h3>Worked SaaS Unit Economics Example</h3><p>Suppose a B2B software company spends <strong>$24,000</strong> on paid search, <strong>$18,000</strong> on SDR salaries/commissions, and <strong>$3,000</strong> on marketing tools in a quarter ($45,000 total) to close <strong>50 new customers</strong>. Blended CAC is <strong>$900 per customer</strong>. If ARPA is $120/month at an 80% gross margin ($96/month gross profit), CAC payback takes <strong>9.4 months</strong> ($900 &divide; $96). With 36 months average lifetime, gross-margin LTV is $3,456—a healthy <strong>3.84:1 LTV:CAC</strong> ratio.</p><h3>Common CAC Distortion Errors</h3><ul><li><strong>Excluding Headcount &amp; Content Costs:</strong> Counting only Meta/Google ad spend while omitting
      copywriters, AE commissions, and CRM tools severely understates real CAC.</li><li><strong>Mixing Top-Line Revenue With LTV:</strong> Always compute payback and LTV using <em>gross profit</em> (revenue minus hosting, support, COGS), never gross sales.</li><li><strong>Lagged Attribution Cycles:</strong> Match this quarter's B2B pipeline spend against the cohort that closes 60–90 days later when sales cycles are long.</li></ul>
