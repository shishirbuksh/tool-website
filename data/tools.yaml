    about_title: About the Credit Utilization Calculator
    about_body: '<p>The <strong>Credit Utilization Ratio Calculator</strong> computes both overall revolving utilization across all cards and per-card utilization thresholds (30%, 10%, and 1%), showing the exact dollar paydown required to enter optimal scoring tiers.</p><h3>Worked Statement-Date Example: Per-Card vs. Aggregate Utilization</h3><p>Suppose you hold two credit cards: Card A carries a <strong>$2,800 balance on a $3,000 limit</strong> (<strong>93.3%</strong> utilization) and Card B holds <strong>$0 on a $12,000 limit</strong>. Total utilization looks tame at <strong>18.7%</strong> ($2,800 &divide; $15,000), yet Card A''s near-maxed status can still depress your FICO <em>Amounts Owed</em> factor. Paying $1,900 toward Card A drops it to 30% ($900) and lowers aggregate utilization to just <strong>6.0%</strong>—clearing both thresholds cleanly.</p><h3>High-Impact Credit Card Habits</h3><ul><li><strong>Pay Before Statement Closing Date:</strong> Issuers report the statement closing
      balance—not what remains after the due date—to Equifax, Experian, and TransUnion.</li><li><strong>Avoid Closing Zero-Balance Cards:</strong> Shutting an old fee-free card shrinks your total available credit denominator overnight.</li><li><strong>AZEO Strategy Before Mortgages:</strong> All Zero Except One small balance (~1%–3%) yields peak utilization scores ahead of underwriting.</li></ul>'
