    about_title: About the Debt Calculator
    about_body: '<p>The <strong>Debt Payoff Calculator (Snowball vs. Avalanche)</strong> runs side-by-side month-by-month amortization across every credit card, auto note, or personal loan to pinpoint exact payoff dates and lifetime interest saved.</p><h3>Worked Debt Example: Snowball vs. Avalanche</h3><p>Consider two debts with a <strong>$200/month extra payment</strong> budget: Card A holds <strong>$1,500 at 14% APR</strong> ($45 minimum) and Card B holds <strong>$6,000 at 26% APR</strong> ($160 minimum). Paying highest-APR Card B first (<strong>Debt Avalanche</strong>) costs the lowest total interest and trims payoff months by attacking the $130/month interest drain immediately. Paying smallest-balance Card A first (<strong>Debt Snowball</strong>) retires one bill inside 6 months—delivering an early psychological win at a modest extra interest cost.</p><h3>How Extra Principal Accelerates Payoff</h3><ul><li><strong>Rollover Snowball Effect:</strong> Once one balance hits zero, rolling
      its freed minimum payment onto the next debt keeps total monthly cash outflow constant while shrinking debt exponentially.</li><li><strong>Watch Promotional 0% Expirations:</strong> Model deferred-interest store cards carefully if unpaid balances trigger retroactive interest upon expiration.</li><li><strong>Emergency Buffer First:</strong> Keeping $500–$1,000 starter cash prevents a car repair from forcing new high-APR charges mid-plan.</li></ul>'
