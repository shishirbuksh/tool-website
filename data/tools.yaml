  bmi-calculator:
    name: BMI Calculator
    icon: heart-pulse
    category: Calculators
    description: Check BMI by age and gender with ideal-weight range, BMI Prime and waist-to-height ratio. Metric and imperial support, private and instant. All ages covered.
    keywords:
    - bmi calculator with age and gender free
    - body mass index chart for adults india
    - ideal weight for height checker 2026
    - bmi for kids percentile estimator online
    - waist to height ratio checker no signup
    - body fat from bmi estimator free
    - bmi prime calculator for athletes online
    - metric vs imperial bmi converter free
    app_category: FinanceApplication
    sitemap_priority: 0.9
    date_modified: '2026-10-05'
    faqs:
    - q: What is BMI and what does my result mean?
      a: BMI is Body Mass Index, a weight-to-height screening estimate. Under 18.5 suggests underweight, 18.5 to 24.9 healthy range, 25 to 29.9 overweight, and 30 or above obesity range for adults.
    - q: How do I check ideal weight for my height?
      a: Enter height, age and gender to see the healthy BMI weight range beside your result. Ideal weight keeps BMI between 18.5 and 24.9, calculated in metric or imperial units without signup.
    - q: Is BMI different for kids and athletes?
      a: Yes. For kids BMI is compared as an age-and-gender percentile rather than adult cutoffs. For muscular athletes, BMI Prime and waist-to-height ratio add context since muscle weighs more than fat.
    - q: What is waist-to-height ratio and BMI Prime?
      a: Waist-to-height ratio is waist divided by height, with lower values indicating less central fat. BMI Prime is BMI divided by 25, so 1.0 means at the limit and below 1.0 is within range.
    - q: Can I use metric and imperial units?
      a: Yes. Switch between kilograms with centimeters or pounds with feet and inches. The converter applies the correct formula including the 703 factor for imperial, updating results immediately.
    - q: How is body fat estimated from BMI?
      a: Body fat from BMI is an estimate from BMI value, age and gender, not a direct measurement. It tracks general trends alongside waist ratio. For precise percentage use clinical methods instead.
    howto_steps:
    - title: Enter age, gender, height and weight
      desc: Choose metric or imperial units and fill in measurements with age and gender.
    - title: Add waist for extra ratio
      desc: Optionally enter waist circumference for waist-to-height ratio alongside BMI.
    - title: Review BMI and charts
      desc: See BMI value, Prime, category, ideal-weight range and adult chart guidance.
    - title: Compare and plan
      desc: Adjust target weight to stay within healthy range and track changes over time.
    howto_calculate: <p>BMI equals weight in kg divided by height in meters squared. Imperial BMI equals 703 times weight in lb divided by height in inches squared. BMI Prime equals BMI divided by 25.</p>
    about_title: About the BMI Calculator
    about_body: <p>The BMI Calculator is a free online Body Mass Index checker with ideal-weight range, BMI Prime, body-fat estimate and waist-to-height ratio for adults and kids guidance.</p><p>Built for families, students and athletes in India, it supports age, gender, metric and imperial inputs and runs privately in your browser with no signup.</p>
    related_slugs:
    - age-calculator
