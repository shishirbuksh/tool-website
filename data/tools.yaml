      a: Look for red flags like anonymous teams, guaranteed returns, no smart contract audit, unlocked liquidity, and airdrops that require payment to claim. Use this checklist to evaluate any project before investing.
    - q: What is a rug pull in crypto?
      a: A rug pull is when developers abandon a project after raising money, taking investor funds. Signs include locked liquidity, sudden price crashes, and developers selling their tokens. Always check if liquidity is locked before investing.
    - q: How to check if a crypto project is legit?
      a: Verify the team has public identities, read the whitepaper, check for a third-party audit, see if liquidity is locked, and look at the project's social media history. Red flags include newly created accounts and copied content.
    - q: What are common crypto scam warning signs?
      a: 'Common signs include: guaranteed high returns, anonymous team, no audit, misspelled website URLs, pressure to buy quickly, airdrops requiring payment, and social media accounts less than 3 months old.'
    - q: How to verify a crypto project?
      a: Start with CoinGecko or CoinMarketCap for basic info. Check the team on LinkedIn. Read the whitepaper carefully. Look for audit reports from firms like CertiK or Hacken. Search for community reviews on Reddit and Twitter.
