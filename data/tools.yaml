      desc: Modify Hours/Week or Days/Week to match your actual work schedule for accurate conversions.
    howto_calculate: <p><strong>Annual from Hourly:</strong> Hourly × Hours/Week × 52</p><p><strong>Annual from Daily:</strong> Daily × Days/Week × 52</p><p><strong>Annual from Weekly:</strong> Weekly × 52</p><p><strong>Annual from Monthly:</strong> Monthly × 12</p><p><strong>Federal Tax (2025 brackets):</strong> Progressive tax with 10% to 37% rates. Taxable income = gross − standard deduction.</p><p><strong>Effective Tax Rate:</strong> Total Tax ÷ Taxable Income × 100</p><p><strong>Overtime Pay:</strong> Overtime Rate = Hourly Rate × OT Multiplier. Overtime Pay = OT Hours × OT Rate. Total Weekly = Regular Weekly + OT Pay.</p><p><strong>Freelance Rate:</strong> Required Rate = (Target Income × (1 + Overhead%)) ÷ Billable Hours.</p><p><strong>Compound Savings (Future Value):</strong> FV = Monthly Savings × ((1 + Monthly Return)^N − 1) ÷ Monthly Return × (1 + Monthly Return). Based on N months of compounding at the annual return rate.</p>
    about_title: About the Salary Calculator
    about_body: <p>The <strong>Salary &amp; Paycheck Frequency Converter</strong> converts hourly, daily, weekly, biweekly (26 paychecks/year), semi-monthly (24 paychecks/year), monthly, and annual compensation cleanly—accounting for weekly hours, paid vacation vs. unpaid leave, and estimated tax deductions.</p><h3>Worked Hourly vs. Biweekly Paycheck Example</h3><p>On a standard 40-hour week across 52 weeks (<strong>2,080 annual hours</strong>), <strong>$35/hour equals $72,800/year</strong>, or <strong>$6,066.67/month</strong>. Crucially, employers paying <strong>biweekly</strong> divide $72,800 by <strong>26 periods ($2,800 gross per check)</strong> rather than 24 semi-monthly checks ($3,033.33)—meaning two months each year contain three paydays. Meanwhile, contractors taking 3 unpaid weeks off only bill 1,960 hours ($68,600), not 2,080.</p><h3>Avoid These Offer-Comparison Mistakes</h3><ul><li><strong>Check Overtime Eligibility:</strong> Non-exempt hourly workers earn 1.5&times; overtime
      beyond 40 hours/week under FLSA rules, whereas exempt salaried roles receive flat pay.</li><li><strong>Quantify Total Compensation:</strong> Add employer 401(k)/EPF matches, health insurance subsidies, and guaranteed bonuses before switching jobs.</li></ul><h3>Comparing Contractor Hourly vs. W-2 Salaried Offers</h3><p>Before jumping from a $90,000 salaried W-2 role with health benefits, paid holidays, and 4% 401(k) match to a '$50/hr 1099' gig, factor ~7.65% extra self-employment tax, unpaid PTO weeks, and private insurance—often demanding a 30%–45% hourly premium just to break even.</p>
