    - q: How does the calculator model retirement?
      a: 'It uses two phases: an accumulation phase (from your current age to retirement age) where contributions and compound growth build your nest egg, and a drawdown phase (retirement onward) where monthly withdrawals reduce the balance while remaining funds continue to grow.'
    - q: What is contribution escalation?
      a: Contribution escalation lets you specify a yearly percentage increase to your monthly deposits. This models expected salary increases over your career so contributions grow with your income.
    - q: How does Social Security factor in?
      a: You can toggle Social Security on, enter your estimated monthly benefit, and set the age you plan to start collecting. The tool adds this income during the drawdown phase, reducing how much you need to withdraw from savings.
    - q: What does 'Funds Last' mean?
      a: It shows how many years your retirement savings will last given your desired monthly income. If the duration is shorter than your life expectancy, you may need to save more, retire later, or reduce your goal income.
    - q: What is Monte Carlo simulation?
      a: Monte Carlo runs 2000 simulations where each year's return is randomly varied based on your expected return and volatility. The result shows the probability your plan succeeds.
    - q: What withdrawal strategies are available?
      a: 'Three strategies: Fixed Dollar (withdraw your goal amount adjusted for inflation), 4% Rule (withdraw 4% of initial nest egg yearly, inflation-adjusted), and Variable Percentage (withdraw a growing percentage of current balance).'
