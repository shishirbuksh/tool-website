    howto_calculate: <p>Requirement triggers above <code>₹50,000 consignment value</code>. Validity follows distance slabs (e.g. up to 200 km = 1 day, plus 1 day per 200 km). Expiry equals <code>generation date plus validity days</code>; extensions need transporter updates before expiry.</p>
    about_title: About the E-Way Bill Calculator
    about_body: '<p>The <strong>GST e-Way Bill Validity &amp; Threshold Calculator</strong> applies CBIC / CGST Rule 138 thresholds, invoice consignment value checks (taxable value + GST), and distance-based validity blocks including Over Dimensional Cargo (ODC) rules.</p><h3>CGST Rule 138 Validity &amp; Worked Transit Example</h3><p>Effective January 1, 2021, normal non-ODC goods receive <strong>1 day of validity per 200 km</strong> (or part thereof), counted from midnight of the generation date. Suppose you dispatch non-ODC machinery worth ₹2,40,000 + ₹43,200 GST = <strong>₹2,83,200</strong> over <strong>520 km</strong> on May 10 at 2:00 PM: three 200 km blocks give <strong>3 full days</strong>, expiring at <strong>11:59 PM on May 13</strong>. Consignments with total invoice value above <strong>₹50,000</strong> require mandatory Part-A and Part-B generation before movement.</p><h3>State Thresholds &amp; Extension Compliance</h3><ul><li><strong>Consignment Value Includes GST:</strong> Always
      check <em>Taxable Value + GST &minus; Exempt Supply</em> when testing the ₹50,000 trigger.</li><li><strong>ODC &amp; Multimodal Rail Exception:</strong> Over Dimensional Cargo retains 1 day per 20 km due to restricted road transit speeds.</li><li><strong>8-Hour Renewal Window:</strong> Uncompleted trips can be extended within 8 hours before or after expiry via valid portal justification.</li></ul>'
