    - q: What is the minimum age limit for NEET UG medical admission?
      a: Under NTA guidelines, NEET UG candidates must be at least 17 years old at the time of admission or attain 17 years on or before December 31 of the admission year. There is currently no upper age limit for appearing in NEET UG.
    - q: Why does cutoff eligibility say "must not have attained 32 years" on 1 August?
      a: Under Indian recruitment rules, if you turn 32 on August 1 (for example, born on August 1, 1994 for an August 1, 2026 cutoff), you have already attained 32 years on the cutoff date and are over-age. Candidates born on or after August 2, 1994 remain eligible.
