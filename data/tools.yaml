    about_body: '<p>Our <strong>free cryptocurrency tax calculator</strong> estimates taxable capital gains and losses for Bitcoin, Ethereum, altcoins, staking, DeFi swaps, and NFT trades in seconds. Enter purchase cost basis, sale proceeds, trading fees, and holding period to see net gain, holding classification, and estimated tax without connecting an exchange wallet or signing up.</p>

      <h3>How Crypto Capital Gains Tax Is Calculated</h3>

      <p>Taxable gain equals <code>Sale Proceeds − (Purchase Cost Basis + Buy &amp; Sell Fees)</code>. Assets held over 12 months qualify for preferential long-term capital gains rates in the US (0%, 15%, or 20%), whereas trades closed within 12 months are taxed as ordinary short-term income.</p>

      <h3>US Short/Long-Term Rates vs India 30% VDA Tax</h3>

      <ul><li><strong>United States (IRS Form 8949 / FIFO):</strong> Tracks cost-basis lots using FIFO or Specific ID and distinguishes short-term (&le; 1 year) vs long-term (&gt; 1 year) holdings.</li><li><strong>India (Section 115BBH VDA Rules):</strong> Applies a flat 30% tax on net VDA profits plus applicable surcharge/cess (plus 1% TDS on qualifying transfers), regardless of holding period, with only acquisition cost deductible.</li></ul>'
