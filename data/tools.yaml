    meta_title: 18% & Multi-Slab GST Calculator — Inclusive/Exclusive INR
    icon: receipt
    category: Calculators
    description: Free Indian GST calculator for 5%, 12%, 18%, 28%, and new slabs. Compute inclusive vs exclusive GST, CGST/SGST vs IGST split, and invoice totals.
    keywords:
    - 18 percent gst calculator
    - free gst calculator online
    - gst calculator inclusive exclusive india
    - new gst rates september 2025 calculator
    - cgst sgst vs igst split calculator india
    - gst reverse calculation india
    - gst invoice itemizer calculator free
    app_category: FinanceApplication
    sitemap_priority: 0.9
    date_modified: '2026-11-02'
    faqs:
    - q: Which GST rates does the calculator include?
      a: The main schedule effective 22 September 2025 uses 0% (exempt), 5% (merit), 18% (standard) and 40% (de-merit), plus special rates of 0.25% for rough diamonds and 3% for gold, silver and precious metals. Some goods may still attract cess or a specific treatment.
    - q: How does the inclusive vs exclusive mode work?
      a: Exclusive mode adds GST to the amount you enter. Inclusive mode treats the amount as tax-paid and extracts the base value and GST from it using base = total ÷ (1 + rate).
    - q: How is CGST/SGST vs IGST calculated?
      a: For an intra-state supply, the GST is split equally between CGST and SGST. For an inter-state supply, the full amount is shown as IGST. The total tax is the same in both cases.
    - q: Are these the latest Indian GST rates?
      a: The tool was reviewed on 2 November 2026 and uses the main rate schedule effective 22 September 2025. Rates depend on HSN/SAC classification and current notifications, so confirm the entry that applies to your goods or services before invoicing or filing.
    - q: Can I use a custom GST rate?
      a: Yes. Choose Custom and enter any rate from 0 to 100. This is useful for special rates, cess-inclusive scenarios or non-Indian taxes, but it does not override the legal rate that applies to your supply.
    - q: Does the invoice itemizer support different rates?
      a: Yes. Add line items with their own price, quantity and GST rate. The itemizer totals taxable value, GST and the grand total, and can export the invoice data as JSON.
    - q: Is my calculation data sent to a server?
      a: No amount, rate or invoice item is sent to our server. Calculations run in your browser and history is stored in localStorage on your device. The site records an anonymous page-view event, as described in the privacy policy.
    - q: Is this GST Calculator tax advice?
      a: No. It provides educational estimates using the rate you select. It is not a tax filing determination, legal opinion or substitute for a qualified professional.
    - q: How are the displayed amounts rounded?
      a: Base, tax and total values are rounded to two decimal places for invoice-style display. Actual invoices and returns may require different rounding or reporting rules, so verify the final figures with your accounting process.
    howto_steps:
    - title: Enter the amount
      desc: Type the amount and choose exclusive (add GST) or inclusive (extract GST) mode.
    - title: Pick a GST rate
      desc: Select 0%, 0.25%, 3%, 5%, 18% or 40%, or enter a custom rate. Results update instantly with a CGST/SGST or IGST breakdown.
    - title: Itemize an invoice
      desc: Add multiple line items with different rates and quantities, then review the taxable value, total GST and grand total.
    howto_calculate: 'Exclusive GST: GST = amount × rate ÷ 100; total = amount + GST. Inclusive GST: base = amount ÷ (1 + rate ÷ 100); GST = amount − base. For intra-state supplies, CGST = SGST = GST ÷ 2. For inter-state supplies, IGST = GST. The invoice itemizer applies the same formulas per line, then sums taxable value, GST and totals. Rates come from the schedule effective 22 September 2025; cess and special entries are not modelled automatically.'
    about_title: About the GST Calculator
    about_body: '<p>The <strong>GST Calculator (Exclusive &amp; Inclusive)</strong> computes exact 0%, 5%, 12%, 18%, and 28% Goods and Services Tax breakdowns with automatic <strong>CGST + SGST</strong> (intra-state 50/50 split) and <strong>IGST</strong> (inter-state) figures for billing and reconciliation.</p><h3>Worked Exclusive vs. Inclusive GST Extraction Example</h3><p>To <strong>add 18% GST</strong> to a ₹10,000 base service fee (Exclusive): <code>GST = 10,000 &times; 0.18 = ₹1,800</code> (₹900 CGST + ₹900 SGST), giving gross invoice <strong>₹11,800</strong>. Conversely, if a client pays <strong>₹11,800 inclusive of 18% GST</strong>, never subtract 18% of ₹11,800 (which wrongly yields ₹9,676). Divide by <code>1.18</code> instead: <code>Base = 11,800 &divide; 1.18 = ₹10,000</code> and <code>GST = ₹1,800</code>.</p><h3>Billing &amp; Input Tax Credit Accuracy Tips</h3><ul><li><strong>Intra-State vs. Inter-State Rule:</strong> Same-state Place of Supply splits GST equally into CGST + SGST;
      cross-state billing uses single-line IGST.</li><li><strong>Verify HSN / SAC Codes:</strong> Misclassifying 12% vs. 18% HSN schedules triggers reconciliation mismatches on GSTR-2B claims.</li><li><strong>Round at Invoice Total or Line Level:</strong> Follow consistent paise rounding rules in accounting software to match portal GSTR-1 uploads.</li></ul>'
