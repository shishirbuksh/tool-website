    faqs:
    - q: How does the advanced NFT generator work?
      a: Enter your collection size, mint phases with presale discount, public price, gas costs, royalty rate, and up to 8 custom traits with per-trait names, variant counts, and rarity weights. The tool calculates total combinations, uniqueness, revenue projections, gas costs, and a rarity distribution chart.
    - q: What are rarity weights and why do they matter?
      a: Rarity weights control how common or rare each trait category is within your collection. A trait with higher weight (e.g., 40%) will appear more frequently than one with lower weight (e.g., 10%). Weights must total 100% and directly impact the rarity distribution of your NFTs.
    - q: How are mint phases calculated?
      a: You set a presale percentage (e.g., 30% of supply) and a presale discount (e.g., 20% off public price). The tool calculates presale revenue at the discounted price and public sale revenue at full price, showing the combined total.
    - q: How is gas cost estimated?
      a: Gas cost = supply x gas price (Gwei) x estimated gas units per mint (standard ERC-721 uses ~150,000 gas). The tool converts Gwei to ETH using the standard 1 Gwei = 1e-9 ETH. Actual costs vary with network congestion.
    - q: What do the rarity tiers mean?
      a: Common (50-100% trait probability), Uncommon (25-50%), Rare (10-25%), Epic (5-10%), Legendary (0-5%). The distribution chart shows how many NFTs fall into each tier based on your trait weights and variant counts.
    - q: Where does the Nft Generator Ai get its data?
      a: No live feed required. The planner prices the supply, traits and mint math you configure, so revenue views mirror your own drop design. All math runs in your browser and nothing uploads.
    - q: How accurate are the predictions?
      a: Revenue and rarity views project from YOUR collection inputs with open formulas, not market forecasts. Test scenarios before mint day. Educational planning only, never financial advice.
    - q: How often is the data refreshed?
      a: No refresh needed. All math runs locally on the values you enter, so figures never go stale on their own. Re-enter current prices from your exchange whenever you want updated results; nothing is stored or uploaded.
    - q: Is my data secure?
      a: Yes. All analysis happens in your browser or through encrypted channels. We never store your wallet addresses or trading data. Drop drafts persist only in your page session.
    howto_steps:
    - title: Configure collection basics
      desc: Enter collection name, total supply, mint phases (presale % and discount), public price, gas Gwei, and royalty percentage.
    - title: Set up custom traits
      desc: Add up to 8 traits with custom names, variant counts, and rarity weights that total 100%. Use default presets or create your own.
    - title: Review rarity distribution
      desc: Check the rarity distribution chart showing how many NFTs fall into each tier from Common to Legendary.
    - title: Analyze revenue and costs
      desc: Review total mint revenue, royalty income estimate, gas costs, and the per-phase revenue breakdown.
    howto_calculate: Total combinations = product of all variant counts. Unique NFT % = min(100, supply / combos * 100). Rarity score per trait = (1/variants) * (weight/100). Avg rarity = weighted average across all traits. Revenue = presaleSupply * discountedPrice + publicSupply * publicPrice. Gas cost = supply * gasPriceGwei * 150000 * 1e-9 ETH. Royalty = revenue * royalty% / 100.
    about_title: About the Nft Generator Ai
