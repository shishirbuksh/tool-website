    faqs:
    - q: What is BMI and what does my result mean?
      a: BMI is Body Mass Index, a weight-to-height screening estimate. Under 18.5 suggests underweight, 18.5 to 24.9 healthy range, 25 to 29.9 overweight, and 30 or above obesity range for adults.
    - q: How do I check ideal weight for my height?
      a: Enter height, age and gender to see the healthy BMI weight range beside your result. Ideal weight keeps BMI between 18.5 and 24.9, calculated in metric or imperial units without signup.
    - q: Is BMI different for kids and athletes?
      a: Yes. For kids BMI is compared as an age-and-gender percentile rather than adult cutoffs. For muscular athletes, BMI Prime and waist-to-height ratio add context since muscle weighs more than fat.
    - q: What is waist-to-height ratio and BMI Prime?
      a: Waist-to-height ratio is waist divided by height, with lower values indicating less central fat. BMI Prime is BMI divided by 25, so 1.0 means at the limit and below 1.0 is within range.
    - q: Can I use metric and imperial units?
      a: Yes. Switch between kilograms with centimeters or pounds with feet and inches. The converter applies the correct formula including the 703 factor for imperial, updating results immediately.
    - q: How is body fat estimated from BMI?
      a: Body fat from BMI is an estimate from BMI value, age and gender, not a direct measurement. It tracks general trends alongside waist ratio. For precise percentage use clinical methods instead.
