    about_body: "<p>The International GPA &amp; German Grade Converter works as a complete <strong>10 point CGPA to 4.0 GPA calculator</strong> and <strong>CGPA to German grade uni assist calculator</strong> for study-abroad applicants targeting Germany, the United States, Canada, the UK, Europe, and Australia.</p> <h3>Study-Abroad Grading Engines Included</h3> <ul>\n  <li><strong>German Grade Calculator Bavarian Formula:</strong> Computes exact German 1.0–5.0 scores from 10-point CGPA, percentage, US 4.0 GPA, or any international Nmax/Nmin grading system—plus a reverse solver for target admission cutoffs.</li>\n  <li><strong>WES 4.0 GPA Calculator Indian Transcript &amp; Percentage to 4.0 GPA Converter:</strong> Compares direct proportional scaling <code>(CGPA ÷ 10) × 4</code> against credit-weighted US subject grade equivalents (<code>4.0 / 3.7 / 3.3 / 3.0</code>) across up to 15 courses.</li>\n  <li><strong>Indian CGPA to Canadian 4.33 GPA Calculator &amp; UK Honours Grade Converter from\
