    name: Mrr Calculator
    icon: calculator
    category: Calculators
    description: Calculate Monthly Recurring Revenue, ARR, churn impact, and customer LTV for SaaS and subscriptions. With growth chart. Free tool. Churn and expansion tracked.
    keywords:
    - free mrr calculator online
