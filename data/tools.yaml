    - q: Why do inclusive and exclusive date counts differ by 1 day?
      a: Hotel nights and age intervals measure elapsed nights between dates (exclusive), while employment contracts or billing cycles often count both start and end dates (inclusive).
    - q: Does adding 1 month from January 31 avoid invalid dates like February 31?
      a: Yes. Standard month-arithmetic clamps overflow days to the final valid day of the shorter destination month (February 28, or February 29 in leap years).
