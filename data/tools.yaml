    about_body: '<p>This full-featured <strong>Online Scientific Calculator</strong> supports trigonometry (<code>sin</code>, <code>cos</code>, <code>tan</code> and inverse <code>asin</code>/<code>acos</code>/<code>atan</code>), Degree/Radian switching, logarithms (<code>ln</code>, <code>log10</code>), exponentials, factorials, powers, roots, parentheses, <code>&pi;</code>/<code>e</code> constants, and memory registers.</p><h3>Worked Engineering &amp; Physics Mode Example</h3><p>Calculating the horizontal range of a projectile or structural component force requires accurate angle units: in <strong>DEG mode</strong>, <code>sin(30) = 0.5</code> and <code>cos(60) = 0.5</code>, whereas forgetting to switch out of <strong>RAD mode</strong> evaluates <code>sin(30 rad) &approx; -0.9880</code>—one of the most frequent exam and lab errors. Similarly, pH chemistry uses base-10 log (<code>-log10(0.001) = 3</code>), while continuous decay uses natural log <code>ln(e^2) = 2</code>.</p><h3>Memory Registers
