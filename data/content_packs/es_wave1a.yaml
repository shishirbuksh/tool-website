  compound-interest-formula:
    title: 'Fórmula del interés compuesto: cómo calcular tu crecimiento'
    meta_title: 'Fórmula del interés compuesto: guía y ejemplos'
    description: 'Aprende la fórmula del interés compuesto, calcula aportaciones mensuales, compara frecuencias y descubre la regla del 72 con ejemplos claros.'
    keywords:
    - fórmula del interés compuesto
    - interés compuesto
    - calculadora de interés compuesto
    - aportaciones mensuales
    - tasa anual equivalente
    - regla del 72
    faqs:
    - q: ¿Cuál es la fórmula del interés compuesto?
      a: 'Para una inversión inicial, la fórmula es C_n = C_0 × (1 + i)^n. C_0 es el capital inicial, i el tipo por periodo y n el número de periodos. Si la capitalización es mensual, divides el tipo anual entre 12 y multiplicas los años por 12.'
    - q: ¿Qué diferencia hay entre interés simple y compuesto?
      a: 'El interés simple se calcula siempre sobre el capital inicial. El interés compuesto se calcula sobre el capital más los intereses acumulados. Por eso el crecimiento es exponencial y la diferencia se amplía con el tiempo, especialmente en plazos largos.'
    - q: ¿Cómo se calculan las aportaciones mensuales?
      a: 'Para una aportación al final de cada mes, se usa C_n = C_0 × (1 + r)^n + aportación × ((1 + r)^n − 1) / r. r es el tipo mensual y n el número de meses. Si aportas al principio del mes, el resultado cambia ligeramente porque cada aportación se capitaliza un periodo más.'
    - q: ¿Qué es la regla del 72?
      a: 'La regla del 72 estima los años necesarios para duplicar un capital: divide 72 entre el tipo anual en porcentaje. Al 5 %, son unos 14,4 años; el cálculo exacto ronda los 14,2 años. Es una aproximación útil para comparar, no una fórmula exacta.'
    - q: ¿Qué es la tasa anual equivalente?
      a: 'La tasa anual equivalente (TAE) expresa el rendimiento o coste anual teniendo en cuenta la capitalización y determinadas comisiones. Dos productos con el mismo tipo nominal pueden tener una TAE distinta. Para comparar inversiones o préstamos, la TAE suele ser más informativa que el tipo nominal.'
    - q: ¿Cómo afecta la inflación al interés compuesto?
      a: 'La inflación reduce el poder de compra del dinero futuro. Si la rentabilidad nominal es del 5 % y la inflación del 2 %, la rentabilidad real es aproximadamente (1,05 / 1,02) − 1 = 2,94 %. Para objetivos largos, conviene calcular la rentabilidad real y no solo la nominal.'
    - q: ¿Tributan los intereses en España?
      a: 'Los rendimientos del ahorro tributan en el IRPF dentro de la base del ahorro, con una retención habitual del 19 %. La escala y las exenciones dependen de la normativa vigente y de tu situación. Esta guía es educativa y no sustituye el asesoramiento fiscal.'
    howto_steps:
    - title: Introduce el capital inicial
      desc: Añade el importe de partida y el tipo de interés anual.
    - title: Añade aportaciones
      desc: Prueba una aportación mensual o anual y define el plazo.
    - title: Compara escenarios
      desc: Cambia el tipo, el plazo y la frecuencia de capitalización.
    body_html: |
      <p>La fórmula del interés compuesto explica por qué el tiempo es uno de los factores más importantes en una inversión. No solo genera rendimiento el capital inicial: también lo hacen los intereses que se van acumulando. Entender la fórmula permite comparar productos, planificar aportaciones y evitar promesas que parecen mejores de lo que son.</p>
      <h2>Qué es el interés compuesto</h2>
      <p>El interés simple se calcula siempre sobre el capital inicial. Si inviertes 10.000 € al 5 % y cobras los intereses cada año sin reinvertirlos, recibes 500 € anuales. El interés compuesto, en cambio, suma los intereses al capital y los vuelve a invertir. Al segundo año, el 5 % se aplica sobre 10.500 €, no sobre 10.000 €. La diferencia parece pequeña al principio, pero se amplía con el tiempo.</p>
      <p>El interés compuesto puede jugar a favor cuando ahorras o inviertes, y en contra cuando tienes deudas. En una deuda que no amortizas, los intereses se acumulan y pueden aumentar el saldo. Por eso conviene comparar la TAE, el plazo y la frecuencia de capitalización antes de firmar un préstamo o una tarjeta.</p>
      <h2>La fórmula del interés compuesto</h2>
      <p>Para una inversión inicial sin aportaciones adicionales, la fórmula es:</p>
      <p><code>C_n = C_0 × (1 + i)^n</code></p>
      <p>C_0 es el capital inicial, i es el tipo de interés por periodo expresado en tanto por uno y n es el número de periodos. Si el tipo anual es del 5 %, i es 0,05. Con 10.000 € durante 20 años, el resultado es 10.000 × 1,05^20 = 26.532,98 €. Sin reinvertir los intereses, tendrías 20.000 €.</p>
      <p>La fórmula supone que los intereses se reinvierten al mismo tipo y que no hay comisiones ni impuestos. En la realidad, la rentabilidad puede variar, los productos cobran comisiones y Hacienda grava los rendimientos. Para una estimación, la fórmula es útil; para una decisión, hay que ajustar las hipótesis.</p>
      <h2>Capitalización anual, mensual y diaria</h2>
      <p>La frecuencia de capitalización cambia el resultado. Si el 5 % anual se capitaliza mensualmente, el tipo mensual es 0,05 / 12 y el número de periodos es 20 × 12 = 240. Los 10.000 € se convierten en 27.126,40 €, frente a 26.532,98 € con capitalización anual. Cuanto más frecuente es la capitalización, mayor es el efecto, aunque la diferencia no es infinita.</p>
      <p>La tasa anual equivalente (TAE) resume ese efecto. Un tipo nominal del 5 % con capitalización mensual equivale a una TAE de aproximadamente el 5,12 %. En productos de ahorro, compara la TAE; en préstamos, la TAE también incluye determinadas comisiones. No confundas el tipo nominal con la TAE ni compares productos usando bases distintas.</p>
      <h2>Ejemplo con aportaciones mensuales</h2>
      <p>Muchas personas no invierten una sola vez, sino que aportan cada mes. Para una aportación al final de cada periodo, la fórmula es:</p>
      <p><code>C_n = C_0 × (1 + r)^n + aportación × ((1 + r)^n − 1) / r</code></p>
      <p>Con 200 € al mes, un 5 % anual y 20 años, el resultado aproximado es 82.206,73 € si la aportación se hace al final de cada mes. Si se hace al principio, el importe sería algo mayor porque cada aportación se capitaliza un mes más. La diferencia entre aportar al principio o al final puede parecer pequeña, pero se nota en plazos largos.</p>
      <p>Las aportaciones mensuales son un buen ejemplo de por qué la constancia importa. Aumentar la aportación de 100 a 200 € puede tener un efecto mayor que intentar acertar con el mejor producto del año. Antes de invertir, asegúrate de tener un fondo de emergencia y de que el plazo se ajusta a tus objetivos.</p>
      <h2>La regla del 72</h2>
      <p>La regla del 72 es un atajo para estimar la duplicación: divide 72 entre el tipo anual. Al 5 %, 72 / 5 = 14,4 años. El cálculo exacto es aproximadamente 14,2 años. Al 2 %, la regla da 36 años y el cálculo exacto ronda los 35. Cuanto menor es el tipo, mayor es la imprecisión.</p>
      <p>La regla es útil para una conversación rápida, pero no sustituye una calculadora de interés compuesto. No tiene en cuenta comisiones, impuestos ni inflación. Si un producto promete duplicar tu dinero en un plazo muy corto, comprueba qué rentabilidad implica y qué riesgos asumes.</p>
      <h2>Interés compuesto, inflación e impuestos</h2>
      <p>La rentabilidad nominal no es lo mismo que la rentabilidad real. Si ganas un 5 % y la inflación es del 2 %, tu poder de compra crece aproximadamente un 2,94 %, no un 5 %. En periodos largos, la inflación puede reducir de forma significativa el valor de una cantidad que parece grande. El Instituto Nacional de Estadística publica el IPC, que sirve como referencia para actualizar esa estimación.</p>
      <p>En España, los rendimientos del ahorro tributan en el IRPF dentro de la base del ahorro. La retención habitual es del 19 %, pero la escala final depende de la normativa y de tu situación. Además, algunos productos tienen comisiones de gestión, depósito o reembolso. Resta estos costes antes de comparar la rentabilidad con otras alternativas.</p>
      <h2>Errores frecuentes al calcular el interés compuesto</h2>
      <p>El primer error es mezclar tipos anuales con periodos mensuales sin dividir el tipo. El segundo es olvidar las comisiones y los impuestos. El tercero es suponer que una rentabilidad pasada se repetirá. El cuarto es no distinguir entre aportaciones al principio y al final del periodo. El quinto es calcular la rentabilidad nominal y compararla con objetivos que dependen de la inflación.</p>
      <p>Una checklist sencilla: define el capital inicial, el tipo, el plazo y la frecuencia; añade las aportaciones; resta comisiones e impuestos; calcula una versión conservadora y otra optimista; y comprueba si el resultado sigue siendo suficiente para tu objetivo. Si la respuesta cambia mucho entre escenarios, necesitas más margen o un plan distinto.</p>
      <h2>Qué calculadora usar</h2>
      <p>Para una primera estimación, una calculadora de interés compuesto permite variar capital, tipo, plazo y aportaciones. Si además quieres comparar un préstamo, usa la <a href="/es/tool/emi-calculator">calculadora de préstamos</a>. Para saber cuánto puedes pedir, prueba la <a href="/es/tool/loan-affordability-calculator">calculadora de capacidad de endeudamiento</a>. Si ya tienes una hipoteca, la <a href="/es/tool/mortgage-overpayment-calculator">calculadora de amortización anticipada</a> muestra el efecto de pagar antes. Y si necesitas ordenar varias deudas, la <a href="/es/tool/debt-calculator">calculadora de deudas</a> compara la bola de nieve y la avalancha.</p>
      <p>Puedes ver todas las herramientas en <a href="/es/tools">la página de calculadoras</a> y leer más guías en el <a href="/es/blog/calculators">blog de calculadoras</a>. Este artículo es educativo y no constituye asesoramiento financiero, fiscal o legal. Antes de invertir o firmar un préstamo, revisa las condiciones y, si lo necesitas, consulta con un profesional independiente.</p>
      <p>Si tu objetivo es comparar la cuota de un préstamo, empieza por la <a href="/es/tool/emi-calculator">calculadora de préstamos</a>; si quieres medir el efecto de pagar antes, usa la <a href="/es/tool/mortgage-overpayment-calculator">calculadora de amortización anticipada</a>. Anota tus supuestos y revisa el resultado cada año.</p>
