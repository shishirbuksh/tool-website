locale: es
wave: 1a
tools:
  emi-calculator:
    name: Calculadora de préstamos
    meta_title: 'Calculadora de préstamos: cuota, intereses y amortización'
    description: 'Calcula la cuota mensual, los intereses y la amortización de tu préstamo personal o hipotecario. Compara plazos y tipos con esta calculadora gratuita.'
    keywords:
    - calculadora de préstamos
    - cuota mensual
    - amortización
    - tipo de interés
    - préstamo personal
    - simulador de préstamo
    faqs:
    - q: ¿Cómo calcula la calculadora de préstamos la cuota mensual?
      a: 'La calculadora aplica el sistema de amortización francés: cuota = capital × tipo mensual × (1 + tipo mensual)^meses / ((1 + tipo mensual)^meses − 1). También muestra los intereses totales, el capital amortizado y la evolución de la deuda.'
    - q: ¿Qué diferencia hay entre TIN y TAE?
      a: 'El TIN es el tipo nominal que se aplica al capital. La TAE incorpora la frecuencia de liquidación y determinadas comisiones, por lo que suele ser más útil para comparar ofertas. Dos préstamos con el mismo TIN pueden tener una TAE distinta.'
    - q: ¿Qué es la amortización francesa?
      a: 'En la amortización francesa la cuota es constante durante el plazo, pero su composición cambia: al principio pesan más los intereses y al final pesa más el capital. Es el sistema habitual en préstamos personales e hipotecas en España.'
    - q: ¿Cómo afecta una amortización anticipada?
      a: 'Una amortización anticipada reduce el capital pendiente y, con ello, los intereses futuros. Puedes elegir entre reducir la cuota o acortar el plazo; reducir el plazo suele ahorrar más intereses, pero disminuye menos la carga mensual.'
    - q: ¿Qué gastos no incluye la calculadora?
      a: 'La calculadora no incluye comisión de apertura, tasación, notaría, registro, gestoría, seguros, IBI ni gastos de comunidad. Tampoco incorpora una posible comisión por amortización anticipada. Añade estos importes para comparar el coste real.'
    - q: ¿Sirve para una hipoteca variable?
      a: 'Sí, puedes usar el tipo de interés vigente para estimar la cuota. Ten en cuenta que en una hipoteca variable la cuota cambia con el Euríbor y las revisiones. Simula varios tipos, por ejemplo uno más alto, para comprobar si la cuota sigue siendo asumible.'
    howto_steps:
    - title: Introduce los datos
      desc: Escribe el capital, el tipo de interés anual y el plazo en años.
    - title: Revisa la cuota
      desc: Comprueba la cuota mensual, los intereses totales y la amortización.
    - title: Compara escenarios
      desc: Prueba otro plazo, otro tipo y una amortización anticipada.
    howto_calculate: '<p>La cuota se calcula con la fórmula de amortización francesa a partir del capital, el tipo mensual y el número de meses. El cuadro de amortización separa intereses y capital en cada periodo. Una amortización anticipada se resta del capital pendiente y reduce los intereses posteriores.</p>'
    about_title: Sobre la calculadora de préstamos
    about_body: |
      <p>La calculadora de préstamos es una herramienta gratuita para estimar la cuota mensual, los intereses y la amortización de un préstamo personal o hipotecario. Introduces el capital, el tipo de interés anual y el plazo, y obtienes una cuota orientativa junto con un cuadro de amortización. También puedes comparar dos préstamos y simular una amortización anticipada. Todo el cálculo se ejecuta en tu navegador.</p>
      <p>La calculadora de préstamos utiliza el sistema de amortización francés, el más habitual en España. La cuota mensual se mantiene constante, pero al principio una parte importante se destina a intereses y solo una pequeña parte reduce el capital. Con el paso de los meses, la proporción cambia: pagas menos intereses y amortizas más capital. Por eso una amortización anticipada al principio del préstamo suele tener un efecto mayor que la misma cantidad al final.</p>
      <p>Para comparar ofertas, mira la TAE además del tipo de interés. El TIN es el tipo nominal; la TAE incorpora la frecuencia de liquidación y determinadas comisiones. En una hipoteca, la TAE puede incluir la comisión de apertura y otros gastos, aunque no todos los seguros o gastos externos. Un simulador de préstamo ayuda a ver la cuota, pero no sustituye la Ficha Europea de Información Normalizada (FEIN) ni la Ficha de Advertencias Estandarizadas (FIAE) que debe entregarte la entidad.</p>
      <p>En España, la Ley 5/2019 regula los contratos de crédito inmobiliario y refuerza la información y la evaluación de solvencia. Antes de firmar, el banco debe comprobar que puedes hacer frente al préstamo y entregarte información precontractual. La calculadora no realiza esa evaluación. Tampoco incluye comisión de apertura, tasación, notaría, registro, gestoría, seguros, IBI, comunidad de propietarios ni mantenimiento. Para una hipoteca, añade estos gastos y deja un margen para subidas de tipos o cambios de ingresos.</p>
      <p>Un ejemplo: 150.000 € a un 3 % anual durante 25 años dan una cuota aproximada de 711 € al mes. Es una simulación con cuota constante y sin gastos. Si el tipo sube o el plazo cambia, la cuota también cambia. Usa el cuadro de amortización para ver cuánto pagas de intereses y cuánto capital queda pendiente. La calculadora es una herramienta educativa, no una oferta de préstamo ni asesoramiento financiero.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.boe.es/buscar/act.php?id=BOE-A-2019-3814
    - https://clientebancario.bde.es/pcb/es/
    - https://www.bde.es/wbe/es/
    - https://www.ine.es/
    date_modified: '2026-10-28'
  loan-affordability-calculator:
    name: Calculadora de capacidad de endeudamiento
    meta_title: 'Capacidad de endeudamiento: cuánto puedo pedir de préstamo'
    description: '¿Cuánto puedo pedir de hipoteca? Calcula tu capacidad de endeudamiento a partir de ingresos netos y deudas, y estima la cuota mensual máxima.'
    keywords:
    - capacidad de endeudamiento
    - cuánto puedo pedir de hipoteca
    - ratio de endeudamiento
    - cuota máxima
    - ingresos netos
    - simulador de hipoteca
    faqs:
    - q: ¿Cuánto puedo pedir de hipoteca?
      a: 'No existe un importe único y depende de tu sueldo y de tus deudas. Una orientación habitual es que la cuota de todas las deudas no supere el 35 % o el 40 % de los ingresos netos. Con 2.500 € netos y 200 € de deudas, el 35 % son 875 €; quedan 675 € para la nueva cuota, que a 3 % y 25 años equivalen a unos 142.000 €.'
    - q: ¿Qué es la capacidad de endeudamiento?
      a: 'Es el importe de deuda que puedes asumir sin comprometer tu estabilidad financiera. Se estima a partir de los ingresos netos, los gastos fijos, las deudas existentes y el plazo. El banco también valora tu historial, tu estabilidad laboral y el valor del inmueble.'
    - q: ¿Qué porcentaje de ingresos debe ir a la hipoteca?
      a: 'Muchas entidades utilizan una tasa de esfuerzo del 35 % al 40 % de los ingresos netos para el conjunto de las deudas. Ese porcentaje es una referencia, no una garantía: también cuentan los gastos de la vivienda, la comunidad, el IBI, los seguros y las subidas de tipos.'
    - q: ¿Qué gastos adicionales debo incluir?
      a: 'Además de la cuota, incluye IBI, comunidad de propietarios, seguro de hogar, seguro de vida si te lo exigen, mantenimiento y una reserva para reparaciones. En la compra hay que sumar impuestos, notaría, registro y gestoría, que pueden representar un porcentaje importante del precio.'
    - q: ¿Cómo afecta tener otras deudas?
      a: 'Las cuotas de otras deudas reducen el importe disponible para la hipoteca. Si tienes un préstamo personal o una tarjeta con cuota mensual, la entidad lo incluirá en su análisis. Amortizar primero las deudas más caras puede mejorar tu capacidad de endeudamiento.'
    - q: ¿La calculadora garantiza que el banco me conceda el préstamo?
      a: 'No. La calculadora es una estimación educativa. La entidad realiza su propia evaluación de solvencia, consulta ficheros de morosidad cuando corresponde y aplica sus políticas de riesgo. La aprobación depende de la entidad y de la documentación que presentes.'
    howto_steps:
    - title: Introduce ingresos y deudas
      desc: Añade tus ingresos netos, las cuotas actuales y el plazo deseado.
    - title: Calcula la cuota máxima
      desc: Revisa la tasa de esfuerzo y el margen que queda cada mes.
    - title: Ajusta el escenario
      desc: Prueba un tipo más alto, menos plazo o más entrada.
    howto_calculate: '<p>La calculadora aplica un porcentaje de referencia a los ingresos netos, resta las deudas existentes y obtiene una cuota máxima orientativa. Con esa cuota y el tipo y plazo elegidos, calcula un capital aproximado. Los gastos de compra, seguros e impuestos se deben añadir aparte.</p>'
    about_title: Sobre la calculadora de capacidad de endeudamiento
    about_body: |
      <p>La calculadora de capacidad de endeudamiento te ayuda a responder una pregunta clave antes de comprar una vivienda o pedir un préstamo: cuánto puedes pagar cada mes sin poner en riesgo tu economía. A partir de los ingresos netos, las deudas existentes y el plazo, estima una cuota máxima y un importe orientativo. Es una herramienta educativa, no una aprobación de crédito.</p>
      <p>La referencia más habitual es una tasa de esfuerzo del 35 % al 40 % de los ingresos netos para el conjunto de las deudas. Si ganas 2.500 € netos y pagas 200 € de un préstamo personal, el 35 % son 875 €. Al restar los 200 € quedan 675 € para la nueva cuota. A un tipo del 3 % y 25 años, esa cuota permite un capital aproximado de 142.000 €. El cálculo cambia si el tipo sube, si el plazo se alarga o si tienes otros gastos.</p>
      <p>La ratio de endeudamiento no es el único criterio. El banco revisa la estabilidad de los ingresos, la antigüedad laboral, el ahorro, el historial de pagos y el valor de la vivienda. También puede consultar la Central de Información de Riesgos del Banco de España (CIRBE) para conocer tus deudas. Una ratio baja no garantiza la aprobación, y una ratio alta no la impide automáticamente: cada entidad aplica sus políticas.</p>
      <p>Para que el simulador de hipoteca sea realista, incluye todos los gastos de la vivienda: IBI, comunidad de propietarios, seguro de hogar, mantenimiento, suministros y una reserva para reparaciones. En la compra, suma impuestos (ITP o IVA según la vivienda), notaría, registro y gestoría. La entrada habitual ronda el 20 % del precio, pero los gastos de compra pueden añadir otro porcentaje relevante. Si tu ahorro solo cubre la entrada, puede que no tengas margen para imprevistos.</p>
      <p>La calculadora de capacidad de endeudamiento es una herramienta de planificación. No sustituye el análisis de solvencia de la entidad ni el asesoramiento de un profesional. Prueba un escenario con un tipo más alto y otro con menos ingresos para ver si la cuota sigue siendo asumible. La educación financiera ayuda a tomar decisiones, pero no elimina el riesgo. Herramienta educativa, no asesoramiento financiero.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.boe.es/buscar/act.php?id=BOE-A-2019-3814
    - https://clientebancario.bde.es/pcb/es/
    - https://www.bde.es/wbe/es/noticias-eventos/actualidad-banco-espana/notas-banco-espana/cuentas-financieras-2t2026.html
    - https://www.bde.es/wbe/es/
    date_modified: '2026-10-28'
  mortgage-overpayment-calculator:
    name: Calculadora de amortización anticipada
    meta_title: 'Amortización anticipada: ahorra intereses y acorta tu hipoteca'
    description: 'Simula una amortización anticipada de tu hipoteca y descubre cuántos intereses ahorras y cuánto puedes acortar el plazo. Compara cuota y plazo.'
    keywords:
    - amortización anticipada
    - amortizar hipoteca
    - ahorro de intereses
    - plazo del préstamo
    - amortización parcial
    - comisión por amortización
    faqs:
    - q: ¿Qué es la amortización anticipada?
      a: 'Es el pago de una parte o de la totalidad del capital pendiente antes del final del plazo. Reduce la deuda y los intereses futuros. Puedes hacer una amortización parcial con un pago único o con aportaciones periódicas, siempre según las condiciones de tu hipoteca.'
    - q: ¿Cuánto puedo amortizar sin comisión?
      a: 'Depende del contrato y del tipo de hipoteca. En las variables, la Ley 5/2019 limita la comisión al 0,15 % en los 5 primeros años o al 0,25 % en los 3 primeros, según la opción pactada. En las fijas, el límite es del 2 % en los 10 primeros años y del 1,5 % después.'
    - q: ¿Es mejor reducir plazo o cuota?
      a: 'Reducir plazo suele ahorrar más intereses porque eliminas meses de deuda. Reducir cuota mejora el margen mensual, pero mantiene el plazo y puede encarecer el total. Compara ambas opciones con el mismo importe de amortización antes de decidir.'
    - q: ¿Cuándo compensa amortizar la hipoteca?
      a: 'Compensa especialmente si el tipo de la hipoteca es superior a la rentabilidad segura que obtendrías por tu dinero después de impuestos. Antes de amortizar, mantén un fondo de emergencia y comprueba que no necesitas ese dinero para otros objetivos.'
    - q: ¿Qué comisión por amortización puedo pagar?
      a: 'La comisión no puede superar los límites legales, pero el contrato concreto puede establecer una cantidad menor o ninguna. Pide a tu entidad el cálculo por escrito y revisa si la amortización es parcial o total, el momento en que la haces y el tipo aplicable.'
    - q: ¿La calculadora incluye seguros y gastos?
      a: 'No. La calculadora simula capital, tipo, plazo y pagos extra. No incluye seguros, comisión de apertura, notaría, registro ni otros gastos. Tampoco modela una posible revisión del tipo en una hipoteca variable. Añade esos importes para una comparación completa.'
    howto_steps:
    - title: Introduce la hipoteca
      desc: Añade capital pendiente, tipo de interés y plazo restante.
    - title: Elige la amortización
      desc: Prueba un pago único o una aportación mensual o anual.
    - title: Compara plazo y cuota
      desc: Revisa intereses ahorrados, nueva cuota y fecha de fin.
    howto_calculate: '<p>La calculadora compara la hipoteca sin pagos extra con otra que recibe amortizaciones adicionales. Cada mes calcula los intereses sobre el capital pendiente y aplica la cuota y el pago extra. La diferencia de intereses y de plazo muestra el efecto de la amortización anticipada.</p>'
    about_title: Sobre la calculadora de amortización anticipada
    about_body: |
      <p>La calculadora de amortización anticipada muestra cuánto puedes ahorrar si pagas una parte de tu hipoteca antes de tiempo. Introduces el capital pendiente, el tipo de interés y el plazo restante, y añades una amortización parcial con un pago único o una aportación periódica. La herramienta compara la hipoteca original con la amortizada y muestra el ahorro de intereses, la nueva cuota y la fecha de finalización.</p>
      <p>Amortizar hipoteca reduce el capital sobre el que se calculan los intereses. El efecto es mayor al principio, cuando queda mucho capital y muchos meses por delante. También puedes elegir entre reducir la cuota mensual o acortar el plazo del préstamo. Reducir el plazo suele generar un ahorro de intereses mayor, porque eliminas meses de deuda; reducir la cuota alivia la carga mensual, pero puede mantener el coste total más alto.</p>
      <p>En España, la comisión por amortización está limitada por la Ley 5/2019. En las hipotecas variables, el contrato puede establecer un máximo del 0,15 % del capital amortizado durante los 5 primeros años o del 0,25 % durante los 3 primeros, según la opción pactada. En las fijas, el límite es del 2 % durante los 10 primeros años y del 1,5 % después. Estas cifras son límites legales; tu contrato puede ser más favorable. Pide siempre el cálculo por escrito.</p>
      <p>Antes de amortizar, compara el tipo de la hipoteca con la rentabilidad que puedes obtener por tu dinero después de impuestos. Si la hipoteca es barata y tienes un colchón de seguridad, quizá prefieras mantener liquidez. Si el tipo es alto, amortizar puede ser una forma segura de reducir costes. No uses el fondo de emergencia para amortizar: una reparación o una pérdida de ingresos podría obligarte a financiarte de nuevo a un tipo peor.</p>
      <p>Un ejemplo: una hipoteca de 200.000 € a un 3,5 % y 30 años tiene una cuota aproximada de 898 €. Si añades una amortización mensual, el plazo se acorta y los intereses bajan; la cuantía exacta depende del momento y del importe. La calculadora es una herramienta educativa y no sustituye la oferta del banco ni el asesoramiento financiero.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.boe.es/buscar/act.php?id=BOE-A-2019-3814
    - https://clientebancario.bde.es/pcb/es/
    - https://www.bde.es/wbe/es/
    - https://www.ine.es/
    date_modified: '2026-10-28'
  debt-calculator:
    name: Calculadora de deudas
    meta_title: 'Calculadora de deudas: método bola de nieve o avalancha'
    description: 'Compara el método bola de nieve y el método avalancha para pagar tus deudas. Calcula tu plan de pago, la fecha de libertad financiera y los intereses ahorrados.'
    keywords:
    - calculadora de deudas
    - pagar deudas
    - método bola de nieve
    - método avalancha
    - reunificación de deudas
    - plan de pago
    faqs:
    - q: ¿Qué es el método bola de nieve?
      a: 'Consiste en pagar primero la deuda más pequeña y mantener las cuotas mínimas en las demás. Cuando terminas con la primera, destinas ese dinero a la siguiente. Los avances rápidos ayudan a mantener la motivación, aunque no siempre sea la opción que más intereses ahorra.'
    - q: ¿Qué es el método avalancha?
      a: 'El método avalancha dirige el dinero extra a la deuda con el tipo de interés más alto. Así reduces primero la deuda más cara. Suele ahorrar más intereses que la bola de nieve, pero puede tardar más en mostrar el primer resultado visible.'
    - q: ¿Qué método ahorra más intereses?
      a: 'Con el mismo importe total destinado a deudas, la avalancha suele ahorrar más intereses porque ataca primero el tipo más alto. La bola de nieve puede ser más fácil de seguir por los logros rápidos. Elige el método que puedas mantener y compáralo con tus números.'
    - q: ¿Cómo funciona una reunificación de deudas?
      a: 'Una reunificación agrupa varias deudas en un préstamo nuevo, a menudo con una cuota menor y un plazo más largo. Puede aliviar la carga mensual, pero también aumentar los intereses totales y añadir comisiones. Revisa la TAE, el plazo y las garantías antes de firmar.'
    - q: ¿Qué hago si no puedo pagar las cuotas?
      a: 'Habla cuanto antes con la entidad y busca asesoramiento gratuito. No pidas un nuevo crédito para pagar otro sin entender el coste total. En situaciones graves, existen mecanismos legales de insolvencia; infórmate con un profesional o con una asociación de consumidores.'
    - q: ¿Dónde puedo pedir ayuda gratuita?
      a: 'Puedes acudir a las oficinas de consumo de tu comunidad autónoma, a asociaciones de consumidores y al Portal del Cliente Bancario del Banco de España. Evita empresas que cobran por “soluciones rápidas” o que prometen cancelar deudas sin explicar los riesgos.'
    howto_steps:
    - title: Añade tus deudas
      desc: Introduce saldo, tipo de interés y cuota mínima de cada deuda.
    - title: Define el pago extra
      desc: Indica cuánto puedes destinar cada mes por encima de las mínimas.
    - title: Compara los métodos
      desc: Revisa intereses, fecha de pago y orden de las deudas.
    howto_calculate: '<p>La calculadora simula cada deuda mes a mes. Aplica los intereses sobre el saldo, descuenta la cuota mínima y dirige el pago extra a la deuda elegida. La bola de nieve ordena por saldo y la avalancha por tipo de interés. El resultado muestra el plan de pago y los intereses totales.</p>'
    about_title: Sobre la calculadora de deudas
    about_body: |
      <p>La calculadora de deudas te ayuda a ordenar el pago de varias deudas y a comparar dos estrategias conocidas: la bola de nieve y la avalancha. Introduces el saldo, el tipo de interés y la cuota mínima de cada deuda, y añades el importe extra que puedes pagar cada mes. La herramienta simula ambos métodos y muestra la fecha de pago y los intereses totales.</p>
      <p>Pagar deudas requiere un plan sostenible. La bola de nieve prioriza la deuda más pequeña para conseguir un primer resultado rápido; la avalancha prioriza la deuda con el tipo más alto para reducir antes los intereses. Si tienes una tarjeta revolving, un préstamo personal y un descubierto, probablemente la tarjeta y el descubierto sean las deudas más caras. Compara la TAE y no solo la cuota mensual.</p>
      <p>La reunificación de deudas puede ser una opción si tienes varias deudas caras, pero no es una solución mágica. Al alargar el plazo, la cuota baja pero los intereses totales pueden subir. Algunas reunificaciones exigen garantía hipotecaria, lo que aumenta el riesgo. Antes de firmar, revisa la TAE, las comisiones, el plazo, las garantías y qué ocurre si dejas de pagar. Una reunificación no borra la deuda: la reorganiza.</p>
      <p>Si no puedes pagar, actúa pronto. Habla con la entidad, revisa tu presupuesto y busca ayuda gratuita en una oficina de consumo o en una asociación de consumidores. El Portal del Cliente Bancario del Banco de España explica cómo presentar consultas y reclamaciones. En situaciones de insolvencia, la ley ofrece mecanismos específicos; conviene informarse con un profesional antes de tomar decisiones irreversibles.</p>
      <p>La calculadora de deudas es una herramienta educativa. No incluye comisiones, seguros ni cambios de tipo, y no garantiza que una entidad acepte una reunificación. Su utilidad es mostrar el efecto de distintas estrategias con tus propios números. Herramienta educativa, no asesoramiento financiero.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://clientebancario.bde.es/pcb/es/
    - https://www.bde.es/wbe/es/noticias-eventos/actualidad-banco-espana/notas-banco-espana/cuentas-financieras-2t2026.html
    - https://www.bde.es/wbe/es/
    - https://www.ine.es/
    date_modified: '2026-10-28'
