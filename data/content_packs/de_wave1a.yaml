locale: de
wave: 1a
tools:
  emi-calculator:
    name: Kreditrechner
    meta_title: 'Kreditrechner 2026: Monatsrate, Zinsen und Tilgung'
    description: 'Mit dem Kreditrechner berechnen Sie Monatsrate, Zinsen und Tilgung für Ihr Annuitätendarlehen. Tilgungsplan, Sondertilgung und Kreditvergleich kostenlos.'
    keywords:
    - Kreditrechner
    - Monatsrate berechnen
    - Tilgungsplan
    - Sondertilgung
    - Annuitätendarlehen
    - Ratenrechner
    faqs:
    - q: Wie berechnet der Kreditrechner die Monatsrate?
      a: 'Der Kreditrechner nutzt die Annuitätenformel mit monatlichem Zinssatz: Rate = Kreditsumme × Zinssatz × (1 + Zinssatz)^Monate / ((1 + Zinssatz)^Monate − 1). Zusätzlich zeigt er Zinsanteil, Tilgungsanteil und Restschuld im Tilgungsplan.'
    - q: Was ist der Unterschied zwischen Sollzins und Effektivzins?
      a: 'Der Sollzins ist der reine Zins auf die Darlehenssumme. Der Effektivzins enthält zusätzlich bestimmte Kosten und die Zahlungsweise, deshalb ist er für den Vergleich von Angeboten die aussagekräftigere Größe.'
    - q: Wie wirkt sich eine Sondertilgung auf die Laufzeit aus?
      a: 'Eine Sondertilgung senkt die Restschuld sofort und reduziert damit die künftige Zinslast. Ob die Laufzeit verkürzt oder die Rate gesenkt wird, hängt von der Vereinbarung mit der Bank und der gewählten Variante ab.'
    - q: Welche anfängliche Tilgung ist bei einer Baufinanzierung üblich?
      a: 'Viele Baufinanzierungen starten mit einer anfänglichen Tilgung zwischen einem und drei Prozent. Eine höhere Tilgung verkürzt die Laufzeit, erhöht aber die monatliche Belastung und reduziert den Spielraum für andere Ausgaben.'
    - q: Warum bleibt nach der Zinsbindung oft eine Restschuld?
      a: 'In den ersten Jahren enthält die Annuität vor allem Zinsen; die Tilgung wächst erst langsam. Deshalb ist nach zehn oder fünfzehn Jahren Zinsbindung häufig noch ein erheblicher Teil des Darlehens offen und muss über eine Anschlussfinanzierung weitergeführt werden.'
    - q: Ersetzt der Kreditrechner eine unabhängige Finanzberatung?
      a: 'Nein. Der Rechner ist ein Bildungswerkzeug und modelliert nur die eingegebenen Annahmen. Prüfen Sie Effektivzins, Gebühren, Versicherungen, Bereitstellungszinsen und die persönliche Haushaltsrechnung mit einer unabhängigen Beratungsstelle oder Ihrer Bank.'
    howto_steps:
    - title: Kreditdaten eingeben
      desc: Tragen Sie Kreditsumme, Sollzins und Laufzeit in die Felder ein.
    - title: Monatsrate prüfen
      desc: Vergleichen Sie Rate, Gesamtzahlung und Zinsanteil für Ihre Laufzeit.
    - title: Szenarien vergleichen
      desc: Testen Sie höhere Tilgung, kürzere Laufzeit und eine Sondertilgung.
    howto_calculate: '<p>Die Monatsrate wird mit der Annuitätenformel aus Kreditsumme, monatlichem Sollzins und Anzahl der Monate berechnet. Der Tilgungsplan weist für jede Periode Zins, Tilgung und Restschuld aus; eine Sondertilgung wird direkt von der Restschuld abgezogen.</p>'
    about_title: Über den Kreditrechner
    about_body: |
      <p>Der Kreditrechner ist ein kostenloses Online-Werkzeug für die Planung von Annuitätendarlehen. Er berechnet aus Kreditsumme, Sollzins und Laufzeit die monatliche Rate, die gesamte Zinslast und einen Tilgungsplan. Zusätzlich können Sie eine Sondertilgung oder eine zweite Kreditvariante gegenüberstellen. Die Berechnung läuft vollständig im Browser; Ihre Eingaben werden nicht an einen Server übertragen.</p>
      <p>Mit dem Kreditrechner lassen sich Monatsrate berechnen, Zins und Tilgung getrennt betrachten und verschiedene Laufzeiten vergleichen. Die Monatsrate folgt der Annuitätenformel: Kreditsumme multipliziert mit dem monatlichen Zinssatz und dem Aufzinsungsfaktor, geteilt durch den Aufzinsungsfaktor minus eins. In den ersten Jahren ist der Zinsanteil hoch, weil die Restschuld noch groß ist. Mit jeder Rate wächst der Tilgungsanteil, sodass die Restschuld gegen Ende der Laufzeit schneller sinkt.</p>
      <p>Für die Einordnung ist der Unterschied zwischen Sollzins und Effektivzins wichtig. Der Sollzins bezieht sich auf die Darlehenssumme; der Effektivzins berücksichtigt zusätzlich bestimmte Kosten und die Zahlungsweise. Ein Angebot mit niedrigem Sollzins kann durch Gebühren, Restschuldversicherung oder Bereitstellungszinsen teurer sein als ein Angebot mit etwas höherem Sollzins. Der Ratenrechner zeigt deshalb nur die reine Annuität und ersetzt keinen Angebotsvergleich.</p>
      <p>Bei einer Baufinanzierung kommen Kosten hinzu, die nicht in der Rate stecken: Grunderwerbsteuer, Notar, Grundbuch, Makler, Umzug, Instandhaltungsrücklage und Versicherungen. Die anfängliche Tilgung liegt bei vielen Darlehen zwischen einem und drei Prozent. Eine Sondertilgung ist nur wirksam, wenn sie im Darlehensvertrag vereinbart ist; sonst kann die Bank für eine außerordentliche Rückzahlung eine Vorfälligkeitsentschädigung verlangen. Die gesetzlichen Grenzen und die Bedingungen im Vertrag sollten Sie vor einer Entscheidung prüfen.</p>
      <p>Ein einfaches Beispiel: Bei 200.000 Euro Kreditsumme, vier Prozent Sollzins und zwei Prozent anfänglicher Tilgung beträgt die monatliche Rate rund 1.000 Euro. Das ist eine Modellrechnung ohne Gebühren und ohne individuelle Haushaltsprüfung. Der tatsächliche Effektivzins, die Zinsbindung und die Anschlussfinanzierung können die Belastung deutlich verändern. Nutzen Sie den Tilgungsplan, um die Restschuld nach der Zinsbindung zu sehen, und vergleichen Sie mindestens zwei Szenarien.</p>
      <p>Der Kreditrechner ist kein Kreditangebot und keine Finanzberatung. Er hilft, Annahmen sichtbar zu machen und die richtigen Fragen an Bank oder Beratungsstelle zu stellen. Prüfen Sie vor dem Abschluss die Kreditwürdigkeit, die Haushaltsrechnung und die Vertragsunterlagen. Bildungswerkzeug, keine Empfehlung.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.gesetze-im-internet.de/bgb/__488.html
    - https://www.gesetze-im-internet.de/bgb/__489.html
    - https://www.gesetze-im-internet.de/bgb/__502.html
    - https://www.verbraucherzentrale.de/wissen/geld-versicherungen/bau-und-immobilienfinanzierung/immobilienfinanzierung-haeufige-fragen-rund-um-hauskauf-und-hauskredit-6992
    - https://www.bundesbank.de/de
    date_modified: '2026-10-28'
  loan-affordability-calculator:
    name: Tragfähigkeitsrechner
    meta_title: 'Tragfähigkeitsrechner: Wie viel Kredit kann ich mir leisten?'
    description: 'Mit dem Tragfähigkeitsrechner ermitteln Sie aus Nettoeinkommen und bestehenden Krediten Ihren tragbaren Kreditrahmen und Ihre maximale Monatsrate.'
    keywords:
    - Tragfähigkeitsrechner
    - wie viel Kredit kann ich mir leisten
    - Kreditrahmen berechnen
    - Monatsrate nach Einkommen
    - Schuldenquote
    - Baufinanzierung Budget
    faqs:
    - q: Wie viel Kredit kann ich mir leisten?
      a: 'Eine verbreitete Orientierung ist, dass die gesamte Kreditbelastung etwa 35 bis 40 Prozent des Nettoeinkommens nicht überschreiten sollte. Bei 4.000 Euro netto und 300 Euro bestehenden Krediten bleiben bei 35 Prozent rund 1.100 Euro für alle Raten, also etwa 800 Euro für einen neuen Kredit.'
    - q: Welche Einkommensarten zählen zur Tragfähigkeit?
      a: 'Banken betrachten in der Regel das regelmäßige Nettoeinkommen, oft mit Abschlägen für Bonuszahlungen und variable Gehaltsanteile. Mieteinnahmen werden häufig nur teilweise angerechnet, weil Leerstand und Instandhaltung eingeplant werden müssen.'
    - q: Was ist die Schuldenquote?
      a: 'Die Schuldenquote setzt die monatlichen Kreditraten ins Verhältnis zum Nettoeinkommen. Je höher der Wert, desto weniger Puffer bleibt für Lebenshaltung, Versicherungen, Instandhaltung und unerwartete Ausgaben. Eine niedrige Quote ist kein Freibrief, sondern nur ein erstes Signal.'
    - q: Warum reicht die Monatsrate allein nicht aus?
      a: 'Neben der Rate fallen Nebenkosten, Versicherungen, Instandhaltung, Heizung und Rücklagen an. Bei einer Immobilie kommen Kaufnebenkosten und mögliche Leerstands- oder Reparaturkosten hinzu. Ein vollständiger Haushaltsplan zeigt, ob die Rate dauerhaft tragbar ist.'
    - q: Wie viel Eigenkapital sollte ich haben?
      a: 'Für eine Immobilienfinanzierung werden häufig 20 bis 30 Prozent des Kaufpreises plus Kaufnebenkosten empfohlen. Weniger Eigenkapital kann möglich sein, erhöht aber Beleihung, Zinsrisiko und die Belastung durch die Restschuld. Die individuelle Bankentscheidung ist maßgeblich.'
    - q: Berücksichtigt der Rechner Kaufnebenkosten?
      a: 'Der Rechner arbeitet mit den eingegebenen Werten und modelliert keine automatischen Kaufnebenkosten. Grunderwerbsteuer, Notar, Grundbuch und Makler sollten Sie separat einplanen und den Kreditrahmen entsprechend vorsichtiger ansetzen.'
    howto_steps:
    - title: Einkommen und Pflichten eingeben
      desc: Tragen Sie Nettoeinkommen, bestehende Raten und geplante Laufzeit ein.
    - title: Tragbare Rate prüfen
      desc: Vergleichen Sie die maximale Monatsrate mit Ihrer Haushaltsrechnung.
    - title: Kreditrahmen ableiten
      desc: Testen Sie Zins, Tilgung und Eigenkapital für ein realistisches Szenario.
    howto_calculate: '<p>Der Tragfähigkeitsrechner zieht von einem Teil des Nettoeinkommens die bestehenden Kreditraten ab und leitet daraus eine maximale neue Rate ab. Aus dieser Rate wird mit der Annuitätenformel ein möglicher Kreditrahmen berechnet. Kaufnebenkosten, Steuern und individuelle Bankauflagen sind separat zu prüfen.</p>'
    about_title: Über den Tragfähigkeitsrechner
    about_body: |
      <p>Der Tragfähigkeitsrechner hilft Ihnen einzuschätzen, wie viel Kredit zu Ihrem Einkommen und Ihrer Lebenssituation passt. Er verknüpft Nettoeinkommen, bestehende Kreditraten, Zins und Laufzeit zu einer maximalen Monatsrate und einem daraus abgeleiteten Kreditrahmen. Die Berechnung läuft lokal im Browser und speichert keine Eingaben auf einem Server.</p>
      <p>Die zentrale Frage lautet: Wie viel Kredit kann ich mir leisten, ohne dass die Rate zum Risiko für den Haushalt wird? Eine verbreitete Orientierung ist eine gesamte Schuldenquote von etwa 35 bis 40 Prozent des Nettoeinkommens. Bei 4.000 Euro netto und 300 Euro bestehenden Verpflichtungen bleiben bei 35 Prozent rund 1.100 Euro für alle Raten. Davon entfallen 300 Euro auf die alten Kredite, sodass für die neue Rate etwa 800 Euro übrig bleiben. Bei sechs Prozent Annuität entspricht das grob einem Kreditrahmen von 160.000 Euro.</p>
      <p>Mit dem Tragfähigkeitsrechner können Sie den Kreditrahmen berechnen und dabei Zins, Tilgung und Laufzeit variieren. Eine Monatsrate nach Einkommen ist jedoch nur ein Baustein. Banken prüfen die Kreditwürdigkeit, die Haushaltsrechnung und die Werthaltigkeit einer Immobilie. Bei einer Baufinanzierung sollten Sie außerdem ein realistisches Baufinanzierung Budget für Kaufnebenkosten, Umzug, Möbel und Instandhaltung bilden. Die Schuldenquote sinkt nicht automatisch, nur weil die Bank einen Kredit genehmigt.</p>
      <p>Für eine belastbare Planung gehören folgende Posten in die Haushaltsrechnung: Lebensmittel, Mobilität, Versicherungen, Gesundheit, Kinderbetreuung, Rücklagen, Heizung, Nebenkosten und Freizeit. Bei einer Immobilie kommen Grunderwerbsteuer, Notar, Grundbuch, Makler und gegebenenfalls Renovierungen hinzu. Eine Restschuldversicherung ist nicht automatisch sinnvoll; prüfen Sie Nutzen, Kosten und Bedingungen. Auch eine zunächst niedrige Rate kann nach der Zinsbindung deutlich steigen, wenn die Anschlussfinanzierung teurer wird.</p>
      <p>Der Tragfähigkeitsrechner ist ein Bildungswerkzeug, kein Kreditangebot und keine Finanzberatung. Er zeigt, welche Annahmen zusammenpassen und wo Risiken liegen. Für eine verbindliche Entscheidung sollten Sie Angebote vergleichen, den Effektivzins prüfen und unabhängige Beratung in Anspruch nehmen. Bildungswerkzeug, keine Empfehlung.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.gesetze-im-internet.de/bgb/__505a.html
    - https://www.verbraucherzentrale.de/wissen/geld-versicherungen/bau-und-immobilienfinanzierung/immobilienfinanzierung-haeufige-fragen-rund-um-hauskauf-und-hauskredit-6992
    - https://www.verbraucherzentrale.de/wissen/geld-versicherungen/kredit-schulden-insolvenz
    - https://www.bundesbank.de/de
    - https://www.bafin.de/DE/verbraucherinnen-verbraucher/verbraucherinnen-verbraucher_node
    date_modified: '2026-10-28'
  mortgage-overpayment-calculator:
    name: Sondertilgungsrechner
    meta_title: 'Sondertilgungsrechner: Zinsen sparen, Laufzeit verkürzen'
    description: 'Mit dem Sondertilgungsrechner sehen Sie, wie viel Zinsen eine Sondertilgung spart und wie viele Jahre Sie bei Ihrer Baufinanzierung früher schuldenfrei sind.'
    keywords:
    - Sondertilgungsrechner
    - Restschuld
    - Zinsen sparen
    - Laufzeit verkürzen
    - Baufinanzierung
    - Vorfälligkeitsentschädigung
    faqs:
    - q: Wie funktioniert eine Sondertilgung?
      a: 'Bei einer Sondertilgung zahlen Sie zusätzlich zur vereinbarten Rate einen Betrag direkt auf die Restschuld. Dadurch sinkt die Basis für die künftigen Zinsen. Ob die Laufzeit verkürzt oder die Rate reduziert wird, hängt von der Vertragsvariante ab.'
    - q: Wie viel Sondertilgung ist bei einer Baufinanzierung üblich?
      a: 'Viele Verträge erlauben fünf Prozent der ursprünglichen Darlehenssumme pro Jahr, manche zehn Prozent, andere gar keine Sondertilgung. Entscheidend ist die Klausel in Ihrem Darlehensvertrag, nicht eine allgemeine Faustregel.'
    - q: Sondertilgung oder Rate senken?
      a: 'Bei gleichem Zusatzbetrag spart die Variante mit verkürzter Laufzeit in der Regel mehr Zinsen, weil weniger Monate mit Restschuld bleiben. Eine niedrigere Rate verbessert dagegen den monatlichen Spielraum. Testen Sie beide Varianten mit identischen Annahmen.'
    - q: Wann lohnt sich eine Sondertilgung?
      a: 'Eine Sondertilgung ist besonders attraktiv, wenn der Sollzins über einer sicher erzielbaren Alternativrendite nach Kosten und Steuern liegt. Behalten Sie trotzdem einen Notgroschen und prüfen Sie, ob das Geld für andere Ziele oder unerwartete Ausgaben benötigt wird.'
    - q: Fällt eine Vorfälligkeitsentschädigung an?
      a: 'Wenn Sie außerhalb eines vereinbarten Sondertilgungsrechts vorzeitig zurückzahlen, kann die Bank eine Vorfälligkeitsentschädigung verlangen. Die gesetzlichen Grenzen stehen unter anderem in § 502 BGB; im Einzelfall kommt es auf Vertrag, Zinsbindung und Rückzahlungszeitpunkt an.'
    - q: Warum weicht das Ergebnis von meiner Bank ab?
      a: 'Banken rechnen mit Wertstellungsdaten, Gebühren, Restschuldversicherungen und einer möglichen Zinsbindung nach der Sondertilgung. Der Rechner modelliert die eingegebenen Zahlungsströme; prüfen Sie deshalb die konkrete Abrechnung und lassen Sie sich die Zinsersparnis schriftlich zeigen.'
    howto_steps:
    - title: Darlehen und Extra-Zahlung eingeben
      desc: Tragen Sie Restschuld, Sollzins, Laufzeit und den zusätzlichen Betrag ein.
    - title: Varianten vergleichen
      desc: Testen Sie monatliche, jährliche und einmalige Sondertilgungen.
    - title: Ersparnis prüfen
      desc: Vergleichen Sie Zinsersparnis, neue Restschuld und früheren Termin.
    howto_calculate: '<p>Der Rechner stellt die planmäßige Tilgung einer Variante mit zusätzlicher Zahlung gegenüber. Jeden Monat werden Zinsen auf die Restschuld berechnet; der Rest der Rate und die Sondertilgung reduzieren die Restschuld. Aus der Differenz ergeben sich Zinsersparnis und verkürzte Laufzeit.</p>'
    about_title: Über den Sondertilgungsrechner
    about_body: |
      <p>Der Sondertilgungsrechner zeigt, was eine zusätzliche Zahlung auf Ihre Baufinanzierung bewirkt. Sie geben Restschuld, Sollzins, Restlaufzeit und den zusätzlichen Betrag ein und sehen, wie sich Zinslast, Restschuld und Schuldenfreiheit verändern. Der Rechner vergleicht die planmäßige Variante mit einer Variante, in der Sie monatlich, jährlich oder einmalig mehr zahlen.</p>
      <p>Eine Sondertilgung senkt die Restschuld und damit die Zinsbasis. Das ist besonders wirkungsvoll, wenn der Sollzins hoch ist und noch viele Jahre mit Restschuld bleiben. Ob Sie mit der Sondertilgung Zinsen sparen oder lieber die Rate senken, hängt von Ihrem Ziel ab: Eine verkürzte Laufzeit spart bei gleichem Zusatzbetrag meist mehr Zinsen, eine niedrigere Rate gibt mehr monatlichen Spielraum. Der Rechner macht beide Effekte sichtbar, ersetzt aber nicht die konkrete Bankabrechnung.</p>
      <p>Bei einer Baufinanzierung ist das Sondertilgungsrecht eine Vertragsfrage. Viele Darlehen erlauben jährlich fünf Prozent der ursprünglichen Summe, einige zehn Prozent, andere gar nichts. Zahlen Sie außerhalb dieser Vereinbarung vorzeitig zurück, kann eine Vorfälligkeitsentschädigung anfallen. Die gesetzlichen Grenzen stehen unter anderem in § 502 BGB; zusätzlich sind die Bedingungen im Darlehensvertrag und die Zinsbindung entscheidend. Prüfen Sie vor der Zahlung, ob das Geld nicht besser als Notgroschen oder für andere Ziele eingesetzt wird.</p>
      <p>Ein Rechenbeispiel: Bei 300.000 Euro Restschuld, 3,5 Prozent Sollzins und 25 Jahren Restlaufzeit liegt die planmäßige Rate bei rund 1.500 Euro. Eine zusätzliche monatliche Zahlung verkürzt die Laufzeit und senkt die gesamte Zinslast; wie stark, hängt von Zeitpunkt und Höhe der Zusatzbeträge ab. Der Rechner zeigt die Differenz für Ihre Werte. Gebühren, Bereitstellungszinsen, Restschuldversicherung und eine spätere Anschlussfinanzierung sind nicht automatisch enthalten.</p>
      <p>Der Sondertilgungsrechner ist ein Bildungswerkzeug und keine Finanzberatung. Er hilft, die Wirkung von Zusatzzahlungen zu verstehen und die richtigen Fragen an Ihre Bank zu stellen. Lassen Sie sich die Zinsersparnis und die neue Restschuld schriftlich bestätigen, bevor Sie eine Sondertilgung beauftragen. Bildungswerkzeug, keine Empfehlung.</p>
    translation_status: review
    author: StoryBrain AI
    sources:
    - https://www.gesetze-im-internet.de/bgb/__489.html
    - https://www.gesetze-im-internet.de/bgb/__502.html
    - https://www.verbraucherzentrale.de/wissen/geld-versicherungen/bau-und-immobilienfinanzierung/baufinanzierung-vorzeitig-abloesen-ohne-extrakosten-aus-dem-baukredit-12773
    - https://www.verbraucherzentrale.de/wissen/geld-versicherungen/bau-und-immobilienfinanzierung/immobilienfinanzierung-haeufige-fragen-rund-um-hauskauf-und-hauskredit-6992
    - https://www.bundesbank.de/de
    date_modified: '2026-10-28'
  debt-calculator:
    name: Schuldenrechner
    meta_title: 'Schuldenrechner: Schneeball oder Lawine zum Schuldenabbau'
    description: 'Mit dem Schuldenrechner vergleichen Sie Schneeball- und Lawinenmethode, sehen Ihre Schuldenfreiheit und die Zinsersparnis durch Extra-Zahlungen.'
    keywords:
    - Schuldenrechner
    - Schulden abbauen
    - Schneeballmethode
    - Lawinenmethode
    - Umschuldung
    - Notgroschen
    faqs:
    - q: Was ist die Schneeballmethode?
      a: 'Bei der Schneeballmethode zahlen Sie zuerst die kleinste Schuld ab und leisten auf alle anderen nur die Mindestzahlung. Danach wandert die frei gewordene Rate zur nächsten Schuld. Das schafft schnelle Erfolge und hilft durchzuhalten.'
    - q: Was ist die Lawinenmethode?
      a: 'Die Lawinenmethode richtet die zusätzliche Zahlung auf die Schuld mit dem höchsten Zinssatz. Dadurch sinkt die teuerste Zinslast zuerst. Mathematisch spart diese Reihenfolge häufig mehr Zinsen als die Schneeballmethode, braucht aber manchmal länger bis zum ersten sichtbaren Abschluss.'
    - q: Welche Methode spart mehr?
      a: 'Die Lawinenmethode spart bei gleichen Zahlungen meist mehr Zinsen, weil die höchste Rate zuerst getilgt wird. Die Schneeballmethode kann durch schnelle Teilerfolge motivierender sein. Wählen Sie die Methode, die Sie dauerhaft durchhalten, und vergleichen Sie beide im Rechner.'
    - q: Wie funktioniert eine Umschuldung?
      a: 'Bei einer Umschuldung ersetzen Sie teure Kredite durch einen neuen, häufig günstigeren Kredit. Achten Sie auf Effektivzins, Bearbeitungsgebühren, neue Laufzeit und den Verlust bestehender Sondertilgungsrechte. Eine Umschuldung senkt nicht automatisch die Schulden, sondern verändert Zins und Laufzeit.'
    - q: Was passiert mit dem Dispo?
      a: 'Ein Dispokredit ist meist teurer als ein Ratenkredit und sollte nicht dauerhaft als Finanzierung dienen. Prüfen Sie, ob Sie den Dispo in einen günstigeren Ratenkredit umwandeln können, und vereinbaren Sie mit der Bank einen klaren Rückzahlungsplan. Ein Notgroschen bleibt wichtig.'
    - q: Wo bekomme ich Hilfe bei Schulden?
      a: 'Kostenlose Unterstützung bieten Verbraucherzentralen und anerkannte Schuldnerberatungsstellen. Dort können Sie Haushalt, Forderungen und Zahlungspläne prüfen lassen. Vorsicht bei Anbietern, die schnelle Kredite oder kostenpflichtige „Schuldenfreiheit“ versprechen.'
    howto_steps:
    - title: Schulden erfassen
      desc: Tragen Sie für jede Schuld Restsaldo, Zinssatz und Mindestrate ein.
    - title: Extra-Betrag festlegen
      desc: Legen Sie fest, wie viel Sie monatlich zusätzlich zahlen können.
    - title: Methoden vergleichen
      desc: Prüfen Sie Schneeball und Lawine bei Zinslast und Schuldenfreiheit.
    howto_calculate: '<p>Der Schuldenrechner simuliert jede Schuld Monat für Monat. Zinsen werden auf den Restsaldo berechnet; Mindestraten und der zusätzliche Betrag reduzieren die Schuld. Die Schneeballmethode sortiert nach dem kleinsten Saldo, die Lawinenmethode nach dem höchsten Zinssatz. So entstehen Tilgungsplan, Zinslast und Schuldenfreiheit für beide Varianten.</p>'
    about_title: Über den Schuldenrechner
    about_body: |
      <p>Der Schuldenrechner hilft Ihnen, mehrere Schulden systematisch abzubauen. Sie erfassen für jede Position den Restsaldo, den Zinssatz und die Mindestrate und legen fest, wie viel Sie zusätzlich zahlen können. Der Rechner simuliert dann die Schneeballmethode und die Lawinenmethode und zeigt, wann Sie schuldenfrei sind und wie viel Zinsen Sie insgesamt zahlen. Alle Berechnungen laufen lokal im Browser.</p>
      <p>Beim Schulden abbauen geht es nicht nur um die Reihenfolge, sondern um einen Plan, den Sie dauerhaft durchhalten. Die Schneeballmethode tilgt zuerst die kleinste Schuld und nutzt die frei werdende Rate für die nächste. Die Lawinenmethode tilgt zuerst die Schuld mit dem höchsten Zinssatz und spart dadurch häufig mehr Zinsen. Der Tilgungsplan zeigt, dass die Lawine bei gleichem Zusatzbetrag meist früher die teuerste Last entfernt, während die Schneeballmethode schneller ein sichtbares Erfolgserlebnis liefert.</p>
      <p>In Deutschland sind Ratenkredite, Dispokredite und Kreditkarten die häufigsten Bausteine. Ein Dispo ist oft teurer als ein Ratenkredit; Kreditkarten-Mindestzahlungen können die Rückzahlung über Jahre strecken. Eine Umschuldung kann teure Kredite bündeln, aber sie verlängert häufig die Laufzeit und kostet Gebühren. Vergleichen Sie den Effektivzins, nicht nur die monatliche Rate, und prüfen Sie, ob Sondertilgungsrechte erhalten bleiben. Eine Umschuldung ist kein Schuldenerlass.</p>
      <p>Vor jedem zusätzlichen Betrag sollte ein Notgroschen für unerwartete Ausgaben vorhanden sein. Wer jede freie Reserve in die Tilgung steckt, riskiert, bei einer Reparatur oder Krankheit neue teure Schulden aufzunehmen. Bei Zahlungsschwierigkeiten ist eine anerkannte Schuldnerberatung sinnvoller als ein neuer Kredit. Verbraucherzentralen und Schuldnerberatungsstellen prüfen Forderungen, Haushalt und Zahlungspläne; sie versprechen keine schnelle Lösung, sondern helfen bei einem realistischen Weg.</p>
      <p>Der Schuldenrechner ist ein Bildungswerkzeug und keine Finanzberatung. Er modelliert die eingegebenen Zinssätze und Raten und berücksichtigt keine Gebühren, Sonderkündigungen oder individuelle Vereinbarungen. Prüfen Sie Ihre Verträge und lassen Sie sich bei Bedarf unabhängig beraten. Bildungswerkzeug, keine Empfehlung.</p>
