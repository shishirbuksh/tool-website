  compound-interest-formula:
    title: 'Zinseszins Formel: So berechnen Sie Ihr Kapitalwachstum'
    meta_title: 'Zinseszins Formel: Kapitalwachstum richtig berechnen'
    description: 'Die Zinseszins Formel verständlich erklärt: jährliche und monatliche Verzinsung, Sparraten, Beispiele, 72er-Regel und kostenloser Zinseszinsrechner.'
    keywords:
    - Zinseszins Formel
    - Zinseszins berechnen
    - Zinseszinsrechner
    - monatliche Sparrate
    - effektiver Jahreszins
    - 72er Regel
    faqs:
    - q: Wie lautet die Zinseszins Formel?
      a: 'Für eine einmalige Anlage lautet die Formel K_n = K_0 × (1 + i)^n. Dabei ist K_0 das Startkapital, i der Zinssatz pro Periode und n die Anzahl der Perioden. Bei unterjähriger Verzinsung wird der Jahreszins durch die Anzahl der Perioden geteilt und der Exponent entsprechend vervielfacht.'
    - q: Was ist der Unterschied zwischen einfachem und zusammengesetztem Zins?
      a: 'Beim einfachen Zins wird nur das Startkapital verzinst. Beim Zinseszins werden auch die bereits gutgeschriebenen Zinsen in der nächsten Periode verzinst. Dadurch wächst das Kapital exponentiell statt linear, besonders bei langen Laufzeiten und regelmäßigen Sparraten.'
    - q: Wie berechne ich den Zinseszins mit monatlichen Sparraten?
      a: 'Für eine monatliche Sparrate am Periodenende gilt K_n = K_0 × (1 + r)^n + Rate × ((1 + r)^n − 1) / r. Dabei ist r der Monatszins und n die Anzahl der Monate. Wichtig ist, ob die Rate am Anfang oder Ende des Monats eingezahlt wird.'
    - q: Was sagt die 72er Regel?
      a: 'Die 72er Regel schätzt die Verdopplungszeit: 72 geteilt durch den jährlichen Zinssatz in Prozent. Bei fünf Prozent ergibt das rund 14,4 Jahre. Die exakte Zeit liegt bei etwa 14,2 Jahren; die Regel ist eine schnelle Näherung, keine exakte Berechnung.'
    - q: Warum ist der effektive Jahreszins wichtig?
      a: 'Der effektive Jahreszins berücksichtigt die Verzinsung innerhalb des Jahres und bestimmte Kosten. Zwei Angebote mit demselben Nominalzins können unterschiedliche effektive Renditen oder Kosten haben. Für den Vergleich von Spar- und Kreditprodukten ist deshalb der Effektivzins aussagekräftiger.'
    - q: Sind Zinseszinsen in Deutschland erlaubt?
      a: 'Zinseszins ist mathematisch und bei vielen Geldanlagen üblich, aber für Kreditverträge gibt es gesetzliche Grenzen. § 248 BGB beschränkt die vorherige Vereinbarung von Zinseszinsen. Ob im Einzelfall Zinseszins zulässig ist, hängt von Vertrag und Produkt ab; prüfen Sie die Bedingungen.'
    - q: Wie wirkt Inflation auf den Zinseszins?
      a: 'Inflation senkt die reale Kaufkraft der späteren Auszahlung. Eine Rendite von fünf Prozent bei zwei Prozent Inflation entspricht nur etwa 2,94 Prozent realer Rendite. Für langfristige Ziele sollten Sie Nominalrendite, Inflation, Kosten und Steuern gemeinsam betrachten.'
    howto_steps:
    - title: Startkapital und Zins eingeben
      desc: Tragen Sie Startkapital, Jahreszins und Laufzeit ein.
    - title: Sparrate ergänzen
      desc: Prüfen Sie zusätzlich eine monatliche oder jährliche Sparrate.
    - title: Szenarien vergleichen
      desc: Variieren Sie Zins, Laufzeit und Einzahlungszeitpunkt.
    body_html: |
      <p>Die Zinseszins Formel ist der Kern jeder langfristigen Finanzplanung. Sie beschreibt, wie aus einem Startkapital und einer Rendite über die Jahre ein immer größerer Betrag wird, weil nicht nur das Kapital, sondern auch die bereits gutgeschriebenen Zinsen weiter verzinst werden. Wer den Zinseszins berechnen will, kann Sparpläne, Kredite und Anlageangebote mit derselben Formel besser einordnen. Dieser Leitfaden erklärt die Formel, rechnet Beispiele und zeigt, welche Fehler die Ergebnisse verzerren.</p>
      <h2>Was ist der Zinseszins?</h2>
      <p>Beim einfachen Zins erhalten Sie jede Periode denselben Betrag, berechnet auf das ursprüngliche Kapital. Beim Zinseszins wird der Zins der ersten Periode dem Kapital zugeschlagen und in der nächsten Periode mitverzinst. Aus 10.000 Euro bei fünf Prozent werden nach einem Jahr 10.500 Euro. Im zweiten Jahr werden nicht mehr 10.000 Euro, sondern 10.500 Euro verzinst. Dieser kleine Unterschied summiert sich über Jahrzehnte.</p>
      <p>Der Effekt ist umso stärker, je länger die Laufzeit und je höher die Rendite. Deshalb ist Zeit für den Vermögensaufbau oft wichtiger als der perfekte Einstiegszeitpunkt. Gleichzeitig bedeutet Zinseszins bei Krediten das Gegenteil: Wer Schulden nicht tilgt, zahlt Zinsen auf Zinsen und entfernt sich vom Ziel. Die Formel hilft, beide Richtungen zu verstehen.</p>
      <h2>Die Zinseszins Formel im Überblick</h2>
      <p>Für eine einmalige Anlage ohne weitere Einzahlungen lautet die Formel:</p>
      <p><code>K_n = K_0 × (1 + i)^n</code></p>
      <p>Dabei ist K_0 das Startkapital, i der Zinssatz pro Periode als Dezimalzahl und n die Anzahl der Perioden. Bei einem Jahreszins von fünf Prozent ist i gleich 0,05. Nach 20 Jahren ergibt sich 10.000 × 1,05^20 = 26.532,98 Euro. Aus 10.000 Euro werden also rund 26.533 Euro, ohne dass Sie weitere Beträge einzahlen.</p>
      <p>Die Formel unterstellt, dass der Zins am Ende jeder Periode gutgeschrieben und sofort wieder angelegt wird. In der Praxis kann die Gutschrift anders erfolgen, Gebühren anfallen oder der Zins variabel sein. Für eine erste Schätzung ist die Formel trotzdem nützlich, solange Sie die Annahmen offenlegen.</p>
      <h2>Jährliche, monatliche und unterjährige Verzinsung</h2>
      <p>Viele Produkte verzinsen nicht jährlich, sondern monatlich, vierteljährlich oder täglich. Bei monatlicher Verzinsung wird der Jahreszins durch zwölf geteilt und die Anzahl der Perioden mit zwölf multipliziert. Aus 10.000 Euro bei fünf Prozent werden nach 20 Jahren mit monatlicher Verzinsung rund 27.126 Euro statt 26.533 Euro. Der Unterschied entsteht, weil die Zinsen früher gutgeschrieben und wieder verzinst werden.</p>
      <p>Ein effektiver Jahreszins fasst diesen Effekt zusammen. Er ist nicht dasselbe wie der Nominalzins. Ein Nominalzins von fünf Prozent mit monatlicher Verzinsung ergibt einen effektiven Jahreszins von etwa 5,12 Prozent. Bei Sparprodukten ist der Effektivzins häufig die bessere Vergleichsgröße; bei Krediten enthält er zusätzlich bestimmte Kosten. Achten Sie deshalb immer auf die genaue Definition im Angebot.</p>
      <h2>Beispiel: 10.000 Euro über 20 Jahre</h2>
      <p>Nehmen wir eine einmalige Anlage von 10.000 Euro bei fünf Prozent Jahreszins. Ohne Zinseszins hätten Sie nach 20 Jahren 20.000 Euro, weil jedes Jahr 500 Euro Zinsen anfallen. Mit jährlichem Zinseszins sind es 26.532,98 Euro. Mit monatlicher Verzinsung sind es 27.126,40 Euro. Die Differenz zwischen einfachem Zins und Zinseszins beträgt in diesem Beispiel mehr als 6.500 Euro.</p>
      <p>Das Beispiel zeigt auch, warum Kosten wichtig sind. Eine jährliche Gebühr von 0,5 Prozent reduziert die Rendite deutlich, besonders über lange Zeiträume. Steuern auf Zinsen und Ausschüttungen kommen hinzu. Die Formel beschreibt die Bruttorendite; für die tatsächliche Kaufkraft müssen Sie Kosten, Steuern und Inflation abziehen.</p>
      <h2>Monatliche Sparrate und Sparplan</h2>
      <p>Bei einem Sparplan zahlen Sie regelmäßig zusätzlich ein. Für eine Rate am Ende jedes Monats gilt:</p>
      <p><code>K_n = K_0 × (1 + r)^n + Rate × ((1 + r)^n − 1) / r</code></p>
      <p>Dabei ist r der Monatszins und n die Anzahl der Monate. Bei 200 Euro monatlich, fünf Prozent Jahreszins und 20 Jahren ergibt sich ein Endwert von rund 82.207 Euro, wenn die Rate am Monatsende eingezahlt wird. Würde die Rate am Monatsanfang eingezahlt, fiele das Ergebnis etwas höher aus, weil jeder Beitrag einen Monat länger verzinst wird.</p>
      <p>Für den Vermögensaufbau ist die monatliche Sparrate oft der wichtigste Hebel, weil sie planbar ist. Die Rendite ist unsicherer. Ein Zinseszinsrechner hilft, beide Größen getrennt zu variieren: Was passiert bei 100 statt 200 Euro Rate? Was passiert bei 15 statt 25 Jahren? So sehen Sie, welche Stellschraube in Ihrer Situation den größten Unterschied macht.</p>
      <h2>Zinseszins, Inflation und Steuern in Deutschland</h2>
      <p>Die nominale Endsumme ist nicht dasselbe wie Kaufkraft. Bei zwei Prozent Inflation verliert Geld über 20 Jahre deutlich an Wert. Eine Nominalrendite von fünf Prozent entspricht real nur etwa 2,94 Prozent, wenn die Inflation zwei Prozent beträgt. Für langfristige Ziele sollten Sie deshalb eine Realrendite rechnen und keine Nominalrendite als garantierten Wohlstand interpretieren.</p>
      <p>In Deutschland unterliegen Kapitalerträge grundsätzlich der Abgeltungsteuer von 25 Prozent plus Solidaritätszuschlag und gegebenenfalls Kirchensteuer. Der Sparer-Pauschbetrag liegt seit 2023 bei 1.000 Euro für Alleinstehende und 2.000 Euro für Zusammenveranlagte. Bei Fonds kann die Vorabpauschale eine Rolle spielen. Die konkrete Steuerlast hängt vom Produkt und von Ihrer persönlichen Situation ab; dieser Artikel ist keine Steuerberatung.</p>
      <p>Beim Kredit ist Zinseszins rechtlich nicht unbegrenzt. § 248 BGB beschränkt die vorherige Vereinbarung von Zinseszinsen. Für Verbraucherkredite und Immobiliar-Darlehen gelten zusätzliche Regeln. Wer Schulden vergleicht, sollte nicht nur die Rate, sondern auch den Effektivzins, die Zinsbindung und die Bedingungen für Sondertilgungen prüfen.</p>
      <h2>72er Regel: Verdopplung schnell schätzen</h2>
      <p>Die 72er Regel ist eine Kopfrechenhilfe: 72 geteilt durch den Jahreszins ergibt ungefähr die Jahre bis zur Verdopplung. Bei fünf Prozent sind das 14,4 Jahre. Die exakte Verdopplungszeit liegt bei etwa 14,2 Jahren. Bei zwei Prozent sind es nach der Regel 36 Jahre; exakt sind es etwa 35 Jahre. Je niedriger der Zins, desto ungenauer wird die Näherung.</p>
      <p>Die Regel ist nützlich, um Angebote schnell zu vergleichen, ersetzt aber keine genaue Rechnung. Sie ignoriert Kosten, Steuern und Inflation. Für eine belastbare Planung sollten Sie den Zinseszinsrechner oder eine Tabellenkalkulation mit den tatsächlichen Annahmen verwenden.</p>
      <h2>Häufige Fehler und Checkliste</h2>
      <p>Der erste Fehler ist die Verwechslung von Nominal- und Effektivzins. Der zweite Fehler ist eine inkonsistente Periodenangabe: Ein Jahreszins darf nicht mit einer monatlichen Anzahl von Perioden kombiniert werden, ohne den Zins zuvor zu teilen. Der dritte Fehler ist das Ignorieren von Gebühren, Steuern und Inflation. Der vierte Fehler ist die Annahme, eine vergangene Rendite setze sich unverändert fort.</p>
      <p>Eine einfache Checkliste: Startkapital, Zinssatz, Perioden, Einzahlungszeitpunkt, Kosten, Steuern und Inflation getrennt notieren. Danach zwei Szenarien rechnen, eines vorsichtig und eines optimistisch. Zum Schluss prüfen, ob der Plan auch bei einer niedrigeren Rendite und höheren Ausgaben tragfähig bleibt. So wird aus einer Formel eine belastbare Entscheidungsgrundlage.</p>
      <h2>Quellen und weiterführende Links</h2>
      <p>Für die rechtlichen Grenzen von Zinseszinsen und Krediten sind § 248 BGB und die Verbraucherinformationen der BaFin relevant. Für die Einordnung von Inflation und Kaufkraft bietet das Statistische Bundesamt die Verbraucherpreisindizes. Die Deutsche Bundesbank veröffentlicht Zins- und Finanzmarktdaten. Für die Planung von Krediten und Sparraten können Sie die verlinkten Rechner nutzen.</p>
      <p>Weiterlesen: <a href="/de/tool/emi-calculator">Kreditrechner</a>, <a href="/de/tool/loan-affordability-calculator">Tragfähigkeitsrechner</a>, <a href="/de/tool/mortgage-overpayment-calculator">Sondertilgungsrechner</a> und <a href="/de/tool/debt-calculator">Schuldenrechner</a>. Eine Übersicht finden Sie unter <a href="/de/tools">alle Rechner</a> und im <a href="/de/blog/calculators">Blog für Finanzrechner</a>.</p>
      <p>Für die monatliche Rate nutzen Sie den <a href="/de/tool/emi-calculator">Kreditrechner mit Tilgungsplan</a>; die Zinsersparnis einer Zusatzzahlung zeigt der <a href="/de/tool/mortgage-overpayment-calculator">Sondertilgungsrechner</a>. Notieren Sie Ihre Annahmen und prüfen Sie den Plan jährlich.</p>
      <p>Dieser Leitfaden ist ein Bildungswerkzeug und keine Finanz-, Steuer- oder Rechtsberatung. Prüfen Sie Ihre individuellen Annahmen und lassen Sie sich bei Bedarf unabhängig beraten.</p>
