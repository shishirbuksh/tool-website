# Locale release control (single source of truth for indexability).
#
# Two independent gates must both pass before a non-English URL is advertised:
#   1. The locale is `published` here.
#   2. The specific tool/blog item carries `translation_status: published`
#      inside its `i18n.<locale>` block in tools.yaml / blog.yaml.
#
# Anything else stays crawlable but is served `noindex, follow`, omitted from
# sitemaps and hreflang clusters, and is not listed in robots.txt.
#
# surfaces: optional list of non-item pages that may be indexed once the locale
# is published. Allowed values: home, tools, blog, blog_pillars, hubs, static.
# Empty by default so a locale release cannot accidentally index English chrome.
#
# static_pages: per-page allowlist (bare paths, e.g. /impressum) that is only
# consulted when the `static` surface is also released. Individual legal pages
# can therefore ship one at a time. The code-level safety net still blocks the
# legacy English-fallback pages (/about /contact /privacy /terms /disclaimer).
#
# Rollout order: de+es -> fr -> hi. Do not set `published` until the batch has
# passed native review and scripts/quality_gate.py. For the first DE/ES deploy
# keep `surfaces: []`: the 8 wave-1a tool pages index from their own
# translation_status, while /tools, /blog, the pillar hubs and the blog post
# chrome still render English. Keep the wave-1a blog item at
# `translation_status: review` until post chrome and its related content are
# localized. Add those surfaces only after their templates are localized.

version: 1

locales:
  en:
    status: published
  hi:
    status: quarantined
    surfaces: []
    static_pages: []
  es:
    status: quarantined
    surfaces: []
    static_pages: []
  fr:
    status: quarantined
    surfaces: []
    static_pages: []
  de:
    status: quarantined
    surfaces: []
    static_pages: []
