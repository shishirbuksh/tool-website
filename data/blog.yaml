      primary evidence such as official docs, fee schedules, and transaction records.
      When numbers disagree, trust verified records over remembered outputs, then
      re-simulate with corrected inputs.</p><h2>Volatility and Why Small Samples Mislead</h2><p>Crypto
      prices can move sharply in short periods, so a calm week never represents normal
      conditions. Short samples understate how far outcomes can spread over months
      and years. When you simulate scenarios, include a stressful case with adverse
      moves, higher costs, or delays, and check whether your approach survives it.
      Planning for the uncomfortable case is more informative than admiring the pleasant
      one.</p><p>Volatility also affects behavior. Large swings tempt quick reactions
      that undo careful plans. Pre-committing to review dates, position-review rules,
