    date_published: '2026-09-19'
    date_modified: '2026-09-19'
    image: /static/og-image.webp
    faqs:
    - q: How long should passwords be?
      a: At least fourteen to sixteen characters for important accounts with full
        random mix, longer where allowed. Manager primary secrets deserve twenty plus
        characters or five random words.
    - q: Are generated passwords safe to use?
      a: Random generation in your browser avoids human patterns and is suitable when
        stored in a manager. Safety also depends on storage, phishing caution and
        device security.
    - q: Should I change passwords regularly?
      a: Change on reason such as reuse, phishing, loss or breach notice, prioritising
