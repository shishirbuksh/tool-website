    body_html: '<p><strong>Short answer:</strong> run five light systems that reinforce
      each other: track two habits daily, log spending by category, timebox one focus
      project, list five today tasks and capture notes with tags. Open our free <a
      href="/tool/habit-tracker">habit tracker</a>, <a href="/tool/expense-tracker">expense
