    body_html: '<p><strong>Short answer:</strong> type two names, optionally add birth
      dates or question styles, and receive a playful percentage with a light message
      for dates, parties and chats. Try our free <a href="/tool/love-calculator">love
      calculator</a> for fun, share the score as an icebreaker and plan a kind follow-up
      regardless of the number. This guide explains inputs, scoring flavour, limits
