    body_html: '<p><strong>Short answer:</strong> generate a clean single-column resume
      with standard headings and measurable bullets, then analyse keyword overlap,
      formatting and readability before each application. Draft in our free <a href="/tool/resume-generator">resume
      generator</a> and audit with the <a href="/tool/resume-analyzer">resume analyzer</a>.
      This guide shows ATS-friendly structure, tailoring in twenty minutes and honest
