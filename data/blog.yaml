    howto_steps:
    - title: Normalize Horizon
      desc: Pick one goal horizon such as five years, enter monthly SIP with assumed
        return and FD principal with rate and frequency for the same years.
    - title: Simulate a Range
      desc: Run SIP at 10, 11 and 12 percent assumed and FD at quoted plus senior-citizen
        variant, noting invested versus gains and inflation-adjusted values.
    - title: Overlay Constraints
      desc: Compare risk, liquidity, taxation and certainty needs, copy both dated
