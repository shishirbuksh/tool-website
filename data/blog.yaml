      in 3 Steps</li><li>Formulas and Thresholds</li><li>Weekly Review Rhythm</li><li>Fixing
      Red Metrics</li><li>Frequently Asked Questions</li><li>Try the Free Tools</li></ul><h2>Which
      Seven KPIs Matter</h2><p>Seven numbers run most small businesses without overload.
      Cash collected shows survival. Sales booked shows demand. Gross margin shows
      pricing power. On-time fulfillment shows operations. ROAS shows ad efficiency.
      CPA shows order cost. Repeat rate shows loyalty. Together they answer can we
      pay, can we sell, can we keep, can we deliver, can we acquire profitably and
      will they return. More than ten metrics causes scrolling without action. Fewer
      than five hides leaks.</p><p>Definitions stay simple. Cash collected equals
      receipt totals for the week. Sales equals invoiced plus cash sales. Gross margin
      equals revenue minus cost of goods sold divided by revenue. On-time equals on-time
      jobs or shipments divided by total. ROAS equals revenue divided by ad spend.
      CPA equals spend divided by orders. Repeat rate equals repeat buyers divided
      by total buyers. Compute margin with the <a href="/tool/product-performance-analyzer">product
      performance analyzer</a> and ROAS plus CPA with the <a href="/tool/ad-performance-analyzer">ad
      performance analyzer</a>.</p><p>Learn inputs in <a href="/blog/business-operations/ad-roas-calculator-guide">ROAS
      guide</a>, fulfillment in <a href="/blog/business-operations/job-cards-work-service-orders">job
      docs</a>, billing in <a href="/blog/business-operations/freelancer-billing-stack-guide">billing
      stack</a> and overview in <a href="/blog/business-operations/business-operations-complete-guide">operations
      guide</a>.</p><h2>How to Build the Dashboard in 3 Steps</h2><h3>Step 1 — Enter
