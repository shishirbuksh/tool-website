      by about 2.205, miles to kilometres by multiplying by about 1.609 and Fahrenheit
      to Celsius by subtracting thirty-two then multiplying by five ninths. Round
      display sensibly: one decimal for weights, whole numbers for casual distances
      and exact figures for medication or coaching prescriptions verified with professionals.</p>

      <h3>Travel and coursework</h3>

      <p>Convert road distances, fuel economy, baggage weights and liquid volumes
