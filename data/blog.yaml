    body_html: '<div role="note">Educational content only — not professional tax,
      legal, or financial advice. Verify with a qualified professional. See <a href="/disclaimer">Disclaimer</a>.</div><p><strong>Short
      answer:</strong> Clean numbering uses prefix plus year plus zero-padded sequence
      such as PO-2026-0001, SO-2026-0001 and WO-2026-0001 issued from one log per
      type. Lock numbers after send, void instead of delete, cross-reference purchase
      orders to bills and sales orders to invoices, and trace samples monthly. Use
      the free purchase, sales and work order generators to enforce the scheme.</p><h2>Key
      Takeaways</h2><ul><li>Prefix plus year plus padded sequence keeps sorting and
      audits clean.</li><li>Single source per type plus lock plus void log stops duplicates.</li><li>Trace
      PO to bill to pay and SO to invoice to receipt monthly.</li><li>Use free PO,
      SO and WO generators.</li></ul><h2>Table of Contents</h2><ul><li>Why Numbering
