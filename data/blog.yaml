      section</td></tr></tbody></table>

      <h2>Mistakes That Look Rigged</h2>

      <p>Undisclosed ranges, silent redraws, entries added after cutoff, screenshots
      without timestamps, repeats allowed for winner draws, confusing zero-based versus
      one-based lists and using random picks to avoid judging quality. Each erodes
      trust faster than any prize builds it. Posted rules plus one visible draw solve
      them all.</p>

