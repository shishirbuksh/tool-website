    faqs:
    - q: What is compound interest?
      a: Interest on principal plus prior interest, causing accelerating growth known as the snowball effect. You earn interest on interest over time.
    - q: How to calculate compound interest?
      a: Use A = P x (1+r/n)^(n x t). Add monthly additions via annuity math. A free compound calculator avoids exponent errors and shows year-wise growth.
    - q: What is the difference between simple and compound interest?
      a: Simple pays only on principal. Compound pays on principal plus accumulated interest, so it grows higher over time, for example Rs 80k versus Rs 115k plus in a ten-year illustration.
    - q: Which compounding frequency is best?
      a: Higher frequency estimates slightly more at the same nominal rate, monthly above quarterly above annual. Check effective yield to compare fairly.
    - q: Can I include monthly contributions?
      a: Yes. Enter monthly addition and the tool adds it each period before interest, showing contributions versus interest split.
