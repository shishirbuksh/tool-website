        and name.
    - q: How do prefixes help audits?
      a: Prefixes let anyone tell PO from SO from WO at a glance, filter logs, and
        trace PO to bill to payment and SO to invoice to receipt without opening every
        file. Consistent prefixes cut support time for returns and warranties.
    - q: What if I already have messy numbers?
      a: Freeze old series, start clean series with new prefix or year, map old numbers
