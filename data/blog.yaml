      rate every Monday. Compute margin with the free product performance analyzer
      and ROAS plus CPA with the free ad performance analyzer, show week-over-week
      change, assign one owner per red metric and act on one fix at a time.</p><div
      role="note"><p><strong>Business performance note:</strong> Educational content
      only, not financial or professional advice. ROAS, revenue and KPI examples are
      illustrations to teach calculation and workflow. Confirm decisions with your
      own records or a qualified professional. See <a href="/disclaimer">Disclaimer</a>.</p></div><h2>Key
      Takeaways</h2><ul><li>Seven weekly KPIs beat twenty vanity metrics.</li><li>Margin
      plus ROAS plus CPA reveal true profit per order.</li><li>One page, week-over-week
      change, one owner per red metric.</li><li>Use product plus ad analyzers locally.</li></ul><h2>Table
