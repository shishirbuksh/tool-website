      for most small firms. If you exceed, extend to five digits rather than restarting
      mid-year.</p><table><caption>Table — Number scheme examples</caption><thead><tr><th>Type</th><th>Format
      example</th><th>Reset</th><th>Never do</th></tr></thead><tbody><tr><td>Purchase
      order</td><td>PO-2026-0081</td><td>Yearly with year</td><td>Reuse across suppliers</td></tr><tr><td>Sales
      order</td><td>SO-2026-0145</td><td>Yearly with year</td><td>Share counter with
      PO</td></tr><tr><td>Work order</td><td>WO-2026-0230</td><td>Yearly or continuous</td><td>Hand
      numbers in chat</td></tr><tr><td>Invoice</td><td>INV-2026-0042</td><td>Per policy</td><td>Delete
      to hide gap</td></tr><tr><td>Receipt</td><td>RPT-2026-0201</td><td>Yearly</td><td>Skip
      without void log</td></tr></tbody></table><p>Void discipline preserves trust.
      To cancel, mark void with date, reason and approver, keep the number in the
      log, and issue a replacement with a new number linked to the void. Never delete,
      never reuse, never leave a gap unexplained. Auditors forgive voids with reasons,
      they question gaps without them. Credit notes adjust amounts without breaking
      sequences.</p><h2>Approval and Trace Workflows</h2><p>Numbers enable workflow.
      Buying flow: requisition with budget code, purchase order with approval above
      threshold, supplier confirmation, goods receipt with count, three-way match
      of order to receipt to bill, payment with reference. Selling flow: quote with
      validity, sales order with stock check, pick and pack with scan, shipment with
      proof, invoice copy, receipt on pay. Job flow: request with priority, work order
      authorization, job card execution, sign-off, invoice link. Each step cites the
      prior number, so trace is linear.</p><table><caption>Table — Trace matrix</caption><thead><tr><th>Start</th><th>Middle</th><th>End</th><th>Proves</th></tr></thead><tbody><tr><td>PO-2026-0081</td><td>GRN
      plus bill</td><td>Payment ref</td><td>Spend controlled</td></tr><tr><td>SO-2026-0145</td><td>Shipment
      proof</td><td>INV plus RPT</td><td>Promise kept</td></tr><tr><td>WO-2026-0230</td><td>Job
      card plus parts</td><td>Invoice</td><td>Work billed</td></tr><tr><td>Quote QTN-0091</td><td>SO
      plus job</td><td>Receipt</td><td>Quote to cash</td></tr></tbody></table><p>Fixing
      messy history is straightforward. Freeze old series with an end date, start
      clean series with new year or prefix, build a crosswalk sheet mapping old to
      new for open items only, and close old items within thirty days. Do not renumber
      history. Train the team once, post the one-page policy near dispatch and accounts,
      and enforce generator use. Mistakes are shared counters, manual numbers, editing
      after send, deleting voids and promising without stock checks. See <a href="/blog/business-operations/receipt-templates-small-business">receipts</a>
      and <a href="/blog/business-operations/invoice-generator-freelancers-guide">invoices</a>
