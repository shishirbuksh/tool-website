    date_published: '2026-03-05'
    date_modified: '2026-09-18'
    image: /static/og-image.webp
    faqs:
    - q: How does SIP calculator estimate growth?
      a: Via annuity-due future value at your assumed annual return. It shows invested, estimated gains and year-wise projection. It is a simulation, not a guaranteed return.
    - q: How is FD maturity estimated?
      a: Using A = P x (1+r/n)^(n x t) by frequency. It shows maturity, interest and effective yield, with monthly additions if entered.
