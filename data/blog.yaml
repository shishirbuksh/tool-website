      <li>Frequently asked questions</li>

      </ul>

      <h2>What the Love Calculator Does</h2>

      <p>The love calculator blends the letters of two names through a playful deterministic
      routine and returns a percentage plus a short cheerful message. Same inputs
      give the same score each time, which makes reruns consistent for screenshots
      and rematches. Optional fields such as birth dates or question modes simply
      select message flavour on some versions; the core remains name-based fun rather
      than astrology or psychology. Think of it as a digital fortune cookie with romantic
      wording.</p>

      <p>People enjoy it because numbers spark conversation. A high score invites
      cheering, a middling score invites banter about winning the other half and a
      low score invites jokes about proving the calculator wrong with kindness. The
      tool works best in the first minutes of a party game, date-night chat or classroom
      icebreaker before deeper questions take over. Keep the spotlight short so the
      score opens rather than dominates.</p>

      <p>Privacy keeps it light. Names process locally in the browser without accounts
      or uploads, so silly combinations never travel to servers. Still use first names
      or nicknames in public settings and avoid sensitive full names on shared screens.
      Fun should never cost anyone comfort.</p>

      <h2>How to Enter Names for Best Fun</h2>

      <p>Type preferred names exactly as people introduce themselves, minding capitalisation
      less than spelling. Extra spaces, missing letters and autocorrect swaps alter
      playful outputs, so confirm spellings aloud for laughs. Try variations once
      each: nicknames versus full names, alone versus with surnames, then keep the
      version everyone recognises. One clean run beats five disputed reruns hunting
      for a favoured number.</p>

      <h3>Getting consistent screenshots</h3>

      <p>Run the final pair once on a charged phone with bright text, capture the
      score plus message together and share immediately to the group thread. Note
      the exact spellings in the caption so rematches use identical inputs. Consistent
      captures prevent debates about which version counted.</p>

      <h3>Adding context fields where offered</h3>

      <p>Some versions ask for birth dates, meeting places or question styles. Fill
      them honestly but lightly, knowing they tune messages rather than measure destiny.
      Skip any field that feels intrusive; the core name score already delivers the
      joke. Optional inputs should add flavour, never pressure.</p>

      <h2>What Scores Mean and What They Do Not</h2>

      <p>Scores simply map letter blends to a zero-to-one-hundred scale with cheerful
      bands. High bands suggest fireworks language, middle bands suggest growing connection
      and low bands suggest playful challenge wording. None of these reflect values,
      communication, timing or effort, which decide real relationships. Couples with
      low joke scores often share wonderful partnerships, while perfect joke scores
      guarantee nothing about kindness or reliability.</p>

      <p>Use results as prompts rather than verdicts. Ask what date the pair would
      plan, which song describes them or what small kindness they will try this week.
      Conversations sparked by scores reveal far more than digits. If anyone seems
      uneasy, pivot warmly to friendship or teamwork modes rather than pressing romance.</p>

      <h2>Party, Date and Chat Ideas by Score Band</h2>

      <p>High scores suit celebratory photos, mock award certificates and playlists
      of duets. Middle scores suit would-you-rather questions, dessert votes and mini
      scavenger hunts that build shared stories. Low scores suit comedy roasts with
      affection, kindness dares and rematch challenges where pairs earn bonus points
      through compliments. Every band works when hosts narrate warmly and keep rounds
      brisk.</p>

      <p>For date nights, let the score choose the opener but not the evening. High
      numbers can pick a sunset walk, middles can pick a new cafe to explore and lows
      can pick a board game rematch with playful stakes. End each round by naming
      one genuine appreciation unrelated to the tool. Real attention outshines any
      algorithm.</p>

