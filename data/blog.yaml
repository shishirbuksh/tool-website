      loses money after product and overhead costs. Always judge ROAS against gross
      margin, not alone.</p><h3>How are CTR, CPC and CPA calculated?</h3><p>CTR equals
      clicks divided by impressions times 100. CPC equals spend divided by clicks.
      CPA equals spend divided by conversions. Conversion rate equals conversions
      divided by clicks times 100. The analyzer computes all five from four inputs.</p><h3>Why
      is CPA high even with good CTR?</h3><p>High CTR with high CPA usually points
      to post-click friction such as slow pages, weak offer match or missing tracking.
      Compare CPC against conversion rate to isolate whether traffic cost or on-page
      conversion is the bottleneck.</p><h3>How do I improve ROAS quickly?</h3><p>Tighten
      audience, fix one landing page variable at a time, align ad promise with page
      headline, add social proof near the button, and pause lowest ROAS ad sets first.
      Reallocate 20 percent of spend to the top two performers and retest weekly.</p><h3>How
      does product analysis help ads?</h3><p>Product performance analyzer shows margin
      and return rate by SKU. Promote high-margin, low-return products and pause ads
