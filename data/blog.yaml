  mrr-cac-burn-rate-saas:
    pillar: calculators
    title: 'MRR CAC and Burn Rate SaaS Metrics Calculator: Estimate Growth and Runway'
    meta_title: MRR CAC Burn Rate SaaS Metrics Calculator (2026)
    description: Free MRR, CAC and burn rate calculators for SaaS. Estimate ARR, LTV
      to CAC, payback and runway with examples. No sign-up.
    keywords:
    - mrr cac burn rate SaaS metrics calculator
    - MRR calculator ARR churn
    - CAC LTV payback calculator
    - startup burn rate runway calculator
    date_published: '2026-09-18'
    date_modified: '2026-09-18'
    image: /static/og-image.webp
    faqs:
    - q: How is MRR different from revenue?
      a: MRR is normalized recurring subscription value per month; revenue includes
        one-time fees, services, and timing effects such as deferred annual billings.
        MRR shows momentum while GAAP revenue shows accounting. Track both, and forecast
        cash on collections and growth on MRR.
    - q: How do I annualize MRR to ARR?
      a: ARR equals MRR times 12, using only recurring components and excluding one-time
        items. For annual prepays, divide by 12. For example, 42,265 dollars of MRR
        maps to about 507,180 dollars of ARR estimated.
    - q: What is a good LTV to CAC ratio for SaaS?
      a: A ratio at or above 3 with payback within about 12 months for SMB SaaS is
        commonly cited, but it varies by ACV, sales motion, and cost of capital. Early-stage
        or enterprise companies can differ temporarily. The trend matters more than
        any snapshot.
    - q: How do I lower CAC payback without cutting growth?
      a: Raise ARPU through packaging or annual prepay incentives, improve trial to
        paid conversion, shift mix toward cheaper channels such as PLG and referrals,
        or shorten the sales cycle. As an illustration, a 15 percent ARPU lift cuts
        payback by about 13 percent at the same CAC.
    - q: 'Gross versus net burn: which decides runway?'
      a: Net burn, which is expenses minus revenue, decides runway. Gross burn shows
        the scale of spend. Runway equals cash divided by net burn. If net burn is
        zero or negative, runway is effectively infinite barring shocks, so focus
        shifts to growth efficiency.
    - q: How much runway should a startup target?
      a: A common heuristic is 18 to 24 months after a raise to hit milestones plus
        a 6-month fundraising buffer. Below about 9 to 12 months without a plan forces
        rushed cuts or a bridge round. The burn tool funding calculator sizes the
        raise for your target months.
    - q: What is burn multiple and why track it?
      a: Burn multiple equals net burn divided by net new ARR. It asks how many dollars
        are burned per 1 dollar of ARR added. Below 1 is efficient, 1 to 2 is reasonable,
        and above 3 is inefficient. It unites MRR growth with cash burn in one ratio.
    - q: Can I use these calculators for non-SaaS subscriptions?
      a: Yes, for boxes, memberships, and maintenance retainers if revenue recurs.
        Adjust margin and churn definitions, for example physical COGS lowers margin.
        For one-off e-commerce, use CAC plus contribution margin plus repeat rate
        instead of the MRR and LTV framing.
    howto_steps:
    - title: Estimate momentum with MRR
      desc: Enter customers, ARPU, new, expansion, and churned MRR plus margin to
        get normalized MRR, ARR, net new MRR, churn rate, and LTV preview.
    - title: Estimate efficiency with CAC
      desc: Enter marketing plus sales spend, new customers, ARPU, lifespan, and margin
        to get blended CAC, LTV, LTV to CAC, payback months, and benchmarks.
    - title: Estimate survival with burn
      desc: Enter cash balance, monthly revenue, and monthly expenses to get gross
        and net burn, runway months, break-even revenue, and the 12-month projection.
    body_html: '<h1>MRR, CAC and Burn Rate SaaS Metrics Calculator: Estimate Growth
      and Runway</h1>

      <p>SaaS lives or dies on three numbers: how much recurring revenue you add,
      what each customer costs, and how fast you spend cash. <strong>MRR</strong>
      tells you momentum, <strong>CAC</strong> tells you efficiency, and <strong>burn
      rate</strong> tells you survival time. Miscalculate any one, by counting annual
      prepay as one month of MRR, hiding sales salaries outside CAC, or confusing
      gross burn with net burn, and forecasts mislead investors and hiring plans.
      This guide shows how to estimate all three with free online calculators, gives
      formulas with worked SaaS examples, compares healthy versus risky benchmarks,
      flags common mistakes, and answers FAQs so you can link growth to runway in
      one view.</p>

      <div class="snippet-answer"><p><strong>Quick answer:</strong> MRR equals paying
      customers times ARPU. CAC equals sales plus marketing cost divided by new customers.
      LTV to CAC equals LTV divided by CAC. Gross burn is monthly expenses; net burn
      is expenses minus revenue; runway is cash divided by net burn. Healthy SaaS
      often targets LTV to CAC of 3 or more and CAC payback within 12 months; estimates
      vary by model.</p></div>

      <h2>Key takeaways</h2>

      <ul>

      <li>Track new plus expansion minus churned minus contraction separately; net
      MRR alone hides churn problems.</li>

      <li>Use fully-loaded CAC including salaries, tools, and ads, and compare it
      to gross-margin-adjusted LTV.</li>

      <li>Net burn decides runway; gross burn shows the scale of spend available to
      cut.</li>

      <li>Link the metrics: CAC payback times new customers approximates cash consumed,
      so MRR growth must outpace net burn.</li>

      <li>Re-run monthly; small churn or CAC shifts compound into months of runway
      gained or lost.</li>

      </ul>

      <nav aria-label="Table of Contents"><p><strong>On this page:</strong></p><ol>

      <li><a href="#what-are">What Are MRR, CAC and Burn Rate?</a></li>

      <li><a href="#how-to-use">How to Use the Calculators in 3 Steps</a></li>

      <li><a href="#formula">Formulas + Worked SaaS Example</a></li>

      <li><a href="#comparison">Comparison: Healthy vs. Risky Benchmarks</a></li>

      <li><a href="#mistakes">5 Mistakes That Break SaaS Math</a></li>

      <li><a href="#faq">FAQ</a></li>

      </ol></nav>

      <h2 id="what-are">1. What Are MRR, CAC and Burn Rate?</h2>

      <p><strong>Monthly Recurring Revenue (MRR)</strong> is normalized subscription
      revenue per month. If you have 400 customers paying $49 per month on average
      (ARPU), MRR is about $19,600 and ARR is MRR times 12, or about $235,200. MRR
      movement splits into new logos, expansion from upsell and cross-sell, contraction
      from downgrades, churned from cancellations, and reactivation. Net new MRR equals
      new plus expansion minus contraction minus churned. Two companies with plus
      $3,000 net MRR differ hugely if one added $8,000 and churned $5,000 while the
      other added $3,500 and churned $500; the second business is far healthier.</p>

      <p>Related is NRR, or Net Revenue Retention, which equals starting MRR plus
      expansion minus contraction minus churn, all divided by starting MRR. NRR above
      100 percent means existing customers expand faster than they shrink. Best-in-class
      SMB SaaS often shows 90 to 110 percent with enterprise at 110 to 130 percent
      for illustration.</p>

      <p><strong>Customer Acquisition Cost (CAC)</strong> is fully-loaded sales plus
      marketing spend to win one new customer. Blended CAC equals total sales and
      marketing divided by new customers, while paid CAC isolates ad spend. Fully-loaded
      CAC must include salaries, commissions, tools, content, and events, not just
      ads. CAC alone is meaningless without <strong>LTV</strong> (lifetime value,
      approximately ARPU times gross margin times lifespan) and <strong>payback</strong>
      (months to recover CAC from margin). LTV to CAC at or above 3 with payback within
      12 months is a common venture heuristic for SMB SaaS, longer for enterprise,
      used as a screening lens rather than a rule.</p>

      <p><strong>Burn rate and runway</strong> translate the income statement into
      survival time. Gross burn is total monthly cash out for payroll, rent, software,
      and ads. Net burn is gross burn minus revenue collected. Runway is cash in the
      bank divided by net burn. Example: $900,000 cash with $85,000 expenses and $45,000
      revenue gives $40,000 net burn and about 22.5 months of runway. If net burn
      is zero or negative, you are default-alive or profitable. Break-even revenue
      equals current expenses at current margin, the target that extends runway indefinitely.
      Together the trio connects: MRR growth funds lower net burn, high CAC steepens
      burn, and churn shortens effective runway by eroding revenue. Estimate them
      jointly, not in silos.</p>

      <div class="cta-box"><p><strong>Try them free:</strong> Estimate momentum in
      the <a href="/tool/mrr-calculator">MRR Calculator</a> (ARR, churn impact, LTV),
      efficiency in the <a href="/tool/cac-calculator">CAC Calculator</a> (blended
      CAC, payback, LTV to CAC versus benchmarks), and survival in the <a href="/tool/burn-rate-calculator">Burn
      Rate Calculator</a> (gross and net burn, runway, break-even plus 12-month projection).
      All run in-browser with no sign-up.</p></div>

      <h2 id="how-to-use">2. How to Use the MRR, CAC and Burn Calculators in 3 Steps</h2>

      <p><strong>Step 1: Enter MRR inputs to estimate momentum.</strong> In the MRR
      tool, type customer count, ARPU, new, expansion, and churned amounts or rates,
      plus gross margin percentage. The tool normalizes annual and quarterly plans
      to monthly (annual divided by 12, never counting full prepay as one month of
      MRR), then computes ARR, net new MRR, churn rate, and an LTV preview. Test What-If
      scenarios such as minus one point of churn versus plus 10 percent ARPU; churn
      reduction often wins for compounding.</p>

      <p><strong>Step 2: Enter costs and customers to estimate efficiency.</strong>
      In the CAC tool, type marketing spend plus sales spend including salaries, commissions,
      and tools, new customers won, ARPU, lifespan or churn, and margin. It returns
      blended CAC, LTV, LTV to CAC, payback months, revenue impact, and benchmark
      comparison. Run scenarios such as cutting ad spend 20 percent, raising ARPU
      15 percent, or shortening the sales cycle, and watch payback move instantly.</p>

      <p><strong>Step 3: Enter cash, revenue, and expenses to estimate runway.</strong>
      In the burn tool, type cash balance, monthly revenue, and monthly expenses with
      a payroll split if helpful. It shows gross burn, net burn, runway months plus
      zero-cash date, break-even revenue, funding needed for an 18-month target, and
      a 12-month projection chart. Adjust hiring or pricing and watch runway extend
      or shrink. Copy results for board updates; history stays local. Keep a monthly
      cadence after close and freeze definitions of what counts as sales and marketing
      and what counts as churn, or trends will mislead.</p>

      <h2 id="formula">3. Formulas + Worked SaaS Example</h2>

      <p>MRR equals the sum of normalized recurring contracts. ARR equals MRR times
      12. Churn percentage equals churned MRR divided by starting MRR. CAC equals
      sales and marketing divided by new customers. LTV equals ARPU times margin divided
      by churn rate (or times lifespan). Payback equals CAC divided by ARPU times
      margin. Net burn equals expenses minus revenue. Runway equals cash divided by
      net burn. These are simplified estimates that exclude annual prepay timing,
      expansion nuance, and discounting.</p>

      <p>Core formulas: MRR equals customers times ARPU. ARR equals MRR times 12.
      Net new MRR equals new plus expansion minus contraction minus churned. Logo
      churn equals lost customers divided by starting customers. Revenue churn equals
      churned MRR divided by starting MRR. CAC equals marketing plus sales divided
      by new customers. LTV equals ARPU times gross margin times lifespan months.
      LTV to CAC equals LTV divided by CAC. CAC payback equals CAC divided by ARPU
      times margin. Gross burn is monthly cash expenses. Net burn is expenses minus
      revenue. Runway is cash divided by net burn.</p>

      <p><strong>Worked example, Acme Analytics, SMB SaaS, illustrative:</strong>
      Start with 500 customers times $79 ARPU equals $39,500 MRR ($474,000 ARR). During
      the month: new plus $3,950 (50 customers times $79), expansion plus $790, contraction
      minus $395, churned minus $1,580 (20 customers). Net new equals 3,950 plus 790
      minus 395 minus 1,580, or plus $2,765. Ending MRR is $42,265. Revenue churn
      is 1,580 divided by 39,500, or 4.0 percent monthly (about 38 percent annualized
      if compounded, which is high; target below 2 to 3 percent monthly for SMB and
      below 1 percent for enterprise for illustration).</p>

      <p>CAC math: sales and marketing of $28,000 marketing plus $32,000 sales equals
      $60,000 with 50 new customers, so blended CAC is $1,200. At 80 percent gross
      margin, contribution per customer per month is $79 times 0.8, or $63.20. Payback
      is 1,200 divided by 63.20, or about 19 months (long versus the 12-month heuristic).
      Lifespan is 1 divided by 0.04, or 25 months. LTV is 79 times 0.8 times 25, or
      $1,580. LTV to CAC is about 1.3 times (weak and needing a pricing, churn, or
      CAC fix).</p>

      <p>Burn math: $750,000 cash with $42,000 revenue and $95,000 expenses gives
      $53,000 net burn and about 14.2 months of runway. Break-even needs plus $53,000
      revenue at current spend (about 126 percent growth) or minus $53,000 spend.
      Cutting $15,000 of spend plus improving churn by one point extends runway by
      about 5 to 6 months combined, which you can model in the burn tool What-Ifs.</p>

      <table><caption>Table 1: Illustrative Acme month with MRR, CAC, and burn linked</caption><thead><tr><th>Metric</th><th>Value
      (est.)</th><th>Signal</th></tr></thead><tbody><tr><td>Net new MRR</td><td>+$2,765</td><td>Growing
      but churn-heavy</td></tr><tr><td>Revenue churn</td><td>4.0% per month</td><td>High;
      fix onboarding and retention</td></tr><tr><td>Blended CAC</td><td>$1,200</td><td>Fully-loaded</td></tr><tr><td>LTV
      to CAC</td><td>~1.3x</td><td>Below 3x heuristic</td></tr><tr><td>CAC payback</td><td>~19
      months</td><td>Above 12-month heuristic</td></tr><tr><td>Net burn and runway</td><td>$53k
      and ~14.2 months</td><td>Needs path to 18-month buffer</td></tr></tbody></table>

      <h2 id="comparison">4. Comparison: Healthy vs. Risky Benchmarks</h2>

      <p>Benchmarks are lenses, not laws: product-led growth with $20 ARPU differs
      from enterprise deals at $50,000 ACV. Still, Table 2 gives directional screening
      ranges commonly cited by SaaS operators and investors for illustration, varying
      widely by context.</p>

      <table><caption>Table 2: Illustrative SaaS screening ranges; SMB versus enterprise
      context matters</caption><tr><th>Metric</th><th>Healthy signal (est.)</th><th>Watch
      or risky (est.)</th><th>Lever</th></tr><tr><td>NRR</td><td>100% or more (enterprise
      115% or more)</td><td>Below 85-90%</td><td>Expansion, downgrade saves</td></tr><tr><td>Revenue
      churn per month</td><td>Below 1-2%</td><td>Above 3-5%</td><td>Onboarding, support,
      pricing</td></tr><tr><td>LTV to CAC</td><td>3x or more</td><td>Below 2x</td><td>ARPU,
      margin, CAC mix</td></tr><tr><td>CAC payback</td><td>12 months or less SMB,
      18 or less enterprise</td><td>Above 24 months</td><td>Pricing, sales efficiency</td></tr><tr><td>Gross
      margin</td><td>75-85%</td><td>Below 60%</td><td>Infrastructure, support cost</td></tr><tr><td>Runway</td><td>18-24
      months post-raise</td><td>Below 9-12 months with no plan</td><td>Spend, growth,
      fundraising</td></tr><tr><td>Burn multiple</td><td>Below 1-2x</td><td>Above
      3x</td><td>Net burn divided by net new ARR</td></tr></table>

      <p>Burn multiple equals net burn divided by net new ARR. Example: $53,000 monthly
      burn ($636,000 yearly) divided by $2,765 times 12 ($33,180 ARR added) is about
      19 times, extremely inefficient against a healthy target below 2 times. This
      single ratio links growth spend to growth gained and is favored by investors
      because it punishes growth at any burn. Use the trio together: if LTV to CAC
      is strong but runway is below 12 months, you have efficient growth with too
      little cash, so raise or slow hiring. If runway is long but NRR is below 90
      percent, you have time but a leaky bucket, so fix retention before pouring CAC
      fuel on growth.</p>

      <div class="cta-box"><p><strong>Connect the dots:</strong> After MRR plus CAC,
      paste revenue and expenses into the <a href="/tool/burn-rate-calculator">Burn
      Rate Calculator</a> to see your runway date, break-even point, and funding need.
      Share MRR plus CAC plus burn screenshots as one packet; investors trust linked
      math.</p></div>

      <h2 id="mistakes">5. Five Mistakes That Break SaaS Math</h2>

      <p><strong>1. Counting bookings or annual cash as MRR.</strong> A $12,000 annual
      prepay is $1,000 MRR, not $12,000 MRR. Counting cash spikes MRR, understates
      churn, and overstates LTV. Normalize every contract to monthly recurring value
      and separate one-time services.</p>

      <p><strong>2. Hiding salaries inside CAC.</strong> Claiming $150 CAC from ad
      spend alone while three SDRs plus tools cost $35,000 monthly is fiction. Fully-loaded
      CAC is often 3 to 5 times paid-only CAC. Include salaries, commissions, tools,
      content, and events, and segment blended versus paid versus channel views.</p>

      <p><strong>3. Using revenue instead of margin in LTV and payback.</strong> Seventy-nine
      dollars of ARPU at 60 percent margin contributes $47, not $79. Payback on revenue
      looks about 40 percent faster than reality. Always multiply by gross margin;
      low-margin SaaS with heavy hosting or support needs a higher LTV to CAC to compensate.</p>

      <p><strong>4. Confusing gross burn with net burn.</strong> Saying we burn $95,000
      versus $53,000 net burn implies 7.9 versus 14.2 months on $750,000 cash, a very
      different fundraising urgency. Report both: gross shows the cost-discipline
      target and net decides runway. Growing revenue while holding gross flat extends
      runway fastest.</p>

      <p><strong>5. Averaging away cohort truth.</strong> Blended churn of 2 percent
      can hide new-cohort churn of 8 percent plus old-cohort churn of 0.5 percent.
      Similarly, blended CAC hides $400 product-led versus $4,000 outbound cost. Split
      by cohort, channel, and segment monthly, fix the worst cohort, and double down
      on the best. The calculators scenario modes make this fast when you save baselines
      and compare.</p>

      <h2 id="faq">6. FAQ</h2>

      <p>See the structured FAQ section on this page for concise answers on MRR versus
      revenue, annualizing to ARR, good LTV to CAC levels, lowering payback, gross
      versus net burn, runway targets, burn multiple, and non-SaaS subscription use.
      Each answer uses the same formulas and benchmark logic from the worked example
      above.</p>

      <div class="ymyl-disclaimer"><p><strong>Business and finance notice (YMYL):</strong>
      This guide is business and finance education only, not investment, accounting,
      or legal advice. Benchmarks vary by ACV, motion (PLG versus sales-led), and
      market. Validate with audited financials and qualified advisors before fundraising
      or reporting. See <a href="/disclaimer#financial-crypto">Disclaimer</a>.</p></div>

      <section id="methodology"><h2>Methodology</h2><p>MRR equals the sum of normalized
      recurring contracts; ARR equals MRR times 12. Churn equals churned MRR divided
      by starting MRR. CAC equals sales and marketing divided by new customers. LTV
      equals ARPU times margin divided by churn rate (or times lifespan). Payback
      equals CAC divided by ARPU times margin. Net burn equals expenses minus revenue;
      runway equals cash divided by net burn. Simplified illustrative estimates excluding
      prepay timing, expansion nuance, and discounting.</p></section>

      <p><strong>Keep learning:</strong> Pair with <a href="/blog/calculators/salary-take-home-pay">Salary
      Take-Home Pay Explained</a> for hiring budgets and <a href="/blog/calculators/gst-calculator-india">GST
      Calculator India with Examples</a> for pricing taxes into ARPU.</p>

      '
