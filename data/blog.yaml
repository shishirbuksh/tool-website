  gst-calculator-india:
    pillar: calculators
    title: 'GST Calculator India Online with Examples: Add or Remove GST Correctly'
    meta_title: GST Calculator India Online with Examples (2026)
    description: Free GST calculator India online. Add or remove 0, 5, 12, 18, 28 percent GST, see CGST, SGST, IGST split with examples. No sign-up.
    keywords:
    - gst calculator India online with examples
    - CGST SGST IGST calculator
    - GST inclusive exclusive calculation
    - e-way bill validity calculator
    date_published: '2026-09-18'
    date_modified: '2026-09-18'
    image: /static/og-image.webp
    faqs:
    - q: How do I add 18 percent GST to 10,000 rupees?
      a: Multiply 10,000 by 0.18 to get 1,800 tax, for a total of 11,800. Intra-state show 900 CGST plus 900 SGST; inter-state show 1,800 IGST. Select Exclusive plus 18 percent in the calculator.
    - q: How do I remove GST from an inclusive price?
      a: Divide by one plus the rate. For example, 11,800 inclusive at 18 percent gives 11,800 divided by 1.18 equals 10,000 base and 1,800 tax. Never multiply the inclusive total by the rate percentage.
    - q: What is the difference between CGST, SGST and IGST?
      a: CGST goes to the Centre and SGST to the State on intra-state supplies, split equally. IGST goes to the Centre for inter-state supplies at the full rate. Place of supply decides which applies; the slab percentage is the same.
    - q: What are the current GST slabs in India?
      a: Headline slabs are 0, 5, 12, 18, and 28 percent, plus special rates such as 3 percent on gold in illustrative cases and cess on select demerit goods. Exact applicability depends on HSN and SAC notifications, so check CBIC schedules or your CA for your item.
    - q: How do I show GST on an invoice?
      a: Show base value, CGST and SGST or IGST rate and amount per line, total tax, and gross total, plus GSTINs, HSN or SAC codes, place of supply, and amount in words. The invoice itemizer output maps directly to this format.
    - q: When is an e-way bill required?
      a: Generally for inter-state movement of goods above a threshold value, commonly 50,000 rupees with state and exemption variations, and in specified cases even below. Enter consignment value, distance, and vehicle type in the e-way bill tool to check the requirement, then generate on the official portal.
    - q: Can I claim ITC on all purchases?
      a: No. You generally need a tax invoice, receipt of goods or services, supplier-reported returns reflected in GSTR-2B, and use for business taxable supplies. Blocked credits and personal or exempt use are ineligible. Reconcile your purchase register with 2B before claiming.
    - q: Is GST charged on discounts?
      a: It depends whether the discount is pre-agreed and linked to the invoice, which can reduce taxable value if conditions are met, versus a post-sale incentive. Show eligible discounts before tax and document clearly to avoid disputes.
    howto_steps:
    - title: Enter amount and mode
      desc: Type the amount, then select Exclusive to add GST on top of a base price or Inclusive to extract tax from a total price.
    - title: Pick slab and sale type
      desc: Choose 0, 5, 12, 18, 28 percent or a custom rate, then select intra-state for CGST plus SGST or inter-state for IGST.
    - title: Itemize and verify
      desc: Add multiple invoice lines with different rates, review grand base, total GST, and gross, then copy the breakdown to your invoice.
    body_html: '<h1>GST Calculator India Online with Examples: Add or Remove GST Correctly</h1>

      <p>Whether you quote Rs. 10,000 plus GST or Rs. 10,000 inclusive of GST changes your margin by up to Rs. 2,169 at 28 percent. India Goods and Services Tax uses five main slabs, 0, 5, 12, 18, and 28 percent, split as CGST plus SGST for intra-state sales or IGST for inter-state sales. A free <strong>GST calculator India online</strong> removes guesswork: enter the amount, pick exclusive to add tax or inclusive to remove tax, select the slab, and instantly see net, tax, gross, and split. This guide explains what GST is, gives a 3-step workflow, shows formulas with four worked examples, compares slabs, lists costly mistakes, and answers FAQs.</p>

      <div class="snippet-answer"><p><strong>Quick answer:</strong> To add GST: Tax equals Base times Rate, Gross equals Base plus Tax. To remove GST: Base equals Inclusive divided by one plus Rate, Tax equals Inclusive minus Base. For 18 percent intra-state, split tax equally into 9 percent CGST plus 9 percent SGST. For inter-state, charge 18 percent IGST.</p></div>

      <h2>Key takeaways</h2>

      <ul>

      <li>Exclusive means add tax on top; inclusive means extract tax from the total. Mixing them is the number one pricing error.</li>

      <li>Intra-state means CGST plus SGST at half each; inter-state means IGST at the full rate.</li>

      <li>Common slabs: 5 percent essentials, 12 percent processed goods, 18 percent most services, 28 percent luxury and sin goods.</li>

      <li>Always show Base plus GST plus Gross separately on invoices, and back-calculate to verify supplier quotes.</li>

      <li>Check e-way bill requirement and validity when moving goods above threshold distances.</li>

      </ul>

      <nav aria-label="Table of Contents"><p><strong>On this page:</strong></p><ol>

      <li><a href="#what-is-gst">What Is GST, CGST, SGST and IGST?</a></li>

      <li><a href="#how-to-use">How to Use the GST Calculator in 3 Steps</a></li>

      <li><a href="#formula">Formula + Worked Examples</a></li>

      <li><a href="#comparison">Comparison: What Different Slabs Do to Rs. 10,000</a></li>

      <li><a href="#mistakes">5 Costly GST Mistakes</a></li>

      <li><a href="#faq">FAQ</a></li>

      </ol></nav>

      <h2 id="what-is-gst">1. What Is GST, CGST, SGST and IGST?</h2>

      <p>GST is India destination-based indirect tax levied on the supply of goods and services, subsuming earlier excise, VAT, and service tax. The rate depends on HSN classification for goods or SAC classification for services, as notified by the GST Council. While compensation cess can apply to select items such as tobacco and large vehicles, most everyday calculations use the five headline slabs. Getting the base concept right makes every later calculation faster.</p>

      <p><strong>CGST plus SGST applies intra-state.</strong> If seller and buyer are in the same state, for example Mumbai to Pune, GST is divided equally between the Centre and the State. An 18 percent invoice shows 9 percent CGST plus 9 percent SGST. Your buyer claims Input Tax Credit (ITC) if eligible, which reduces tax cascading along the chain.</p>

      <p><strong>IGST applies inter-state.</strong> If seller and buyer are in different states, for example Delhi to Bengaluru, the full rate is charged as IGST. An 18 percent inter-state supply shows 18 percent IGST with no CGST or SGST. Place-of-supply rules decide which split applies, and using the wrong split is a common return mismatch that delays credits.</p>

      <p><strong>Inclusive versus exclusive changes revenue.</strong> Rs. 50,000 plus GST means a Rs. 50,000 base with tax extra. Rs. 50,000 inclusive means tax is already inside Rs. 50,000, so the base is lower. Retail MRPs are typically inclusive while B2B quotes are typically exclusive. Confusing the two understates revenue or overstates margin, especially at 18 and 28 percent where the wedge is large.</p>

      <div class="cta-box"><p><strong>Try it free:</strong> Calculate instantly with the <a href="/tool/gst-calculator">GST Calculator</a>: toggle exclusive or inclusive, pick 0 to 28 percent or a custom rate, see CGST and SGST versus IGST split, itemize multi-line invoices, and compare slabs. Moving goods? Check the requirement plus validity in the <a href="/tool/eway-bill-calculator">E-Way Bill Calculator</a>.</p></div>

      <h2 id="how-to-use">2. How to Use the GST Calculator in 3 Steps</h2>

      <p><strong>Step 1: Enter the amount and choose mode.</strong> Type the amount and select Exclusive (add GST) if your price is a base, or Inclusive (remove GST) if your price already contains tax. Example: a freelancer quoting Rs. 40,000 exclusive at 18 percent needs different math than a marketplace payout of Rs. 40,000 inclusive, and the toggle handles both without manual algebra.</p>

      <p><strong>Step 2: Pick the slab and sale type.</strong> Choose 0, 5, 12, 18, or 28 percent, or a custom rate such as 3 percent on gold for illustration. Select intra-state (CGST plus SGST) or inter-state (IGST). Results update instantly with net, tax amount, gross, effective rate, and per-component split plus the amount in words for invoice cross-checking.</p>

      <p><strong>Step 3: Itemize and verify.</strong> Use the invoice itemizer to add multiple lines with different rates, for example 5 percent atta plus 12 percent ghee plus an 18 percent service charge. Grand base, total GST, and gross update automatically. Copy the breakdown to your invoice, then batch-compare slabs to test pricing strategy, such as absorbing 12 percent versus passing on 18 percent. History saves recent runs locally for an audit trail.</p>

      <p>Tip: when a supplier says Rs. 25,000 inclusive at 18 percent, back-calculate before comparing to your Rs. 24,000 exclusive quote, because the inclusive base is only about Rs. 21,186, so your quote is actually higher.</p>

      <h2 id="formula">3. Formula + Worked Examples</h2>

      <p>Exclusive mode: Tax equals Base times rate, Gross equals Base times one plus rate. Inclusive mode: Base equals Gross divided by one plus rate, Tax equals Gross minus Base. Split: CGST equals SGST equals Tax divided by 2 for intra-state; IGST equals Tax for inter-state. Rate is 0.05, 0.12, 0.18, or 0.28. Figures are rounded to two decimals and exclude cess, reverse charge, and composition nuances for illustration.</p>

      <p><strong>Example 1, add 18 percent exclusive intra-state in Maharashtra:</strong> Base Rs. 10,000. Tax equals 10,000 times 0.18, or Rs. 1,800. Gross equals Rs. 11,800. Split equals Rs. 900 CGST plus Rs. 900 SGST. The invoice shows Base 10,000 plus CGST 900 plus SGST 900 equals 11,800.</p>

      <p><strong>Example 2, remove 18 percent inclusive inter-state Delhi to Karnataka:</strong> Gross Rs. 11,800 inclusive. Base equals 11,800 divided by 1.18, or Rs. 10,000. Tax equals 11,800 minus 10,000, or Rs. 1,800 as IGST at 18 percent. Same economics as Example 1 with different presentation, so margin analysis must always use base, not gross.</p>

      <p><strong>Example 3, small slab essentials at 5 percent exclusive:</strong> Base Rs. 2,000 for tea and packaged foods for illustration. Tax equals 2,000 times 0.05, or Rs. 100. Gross equals Rs. 2,100. Intra-state split is Rs. 50 plus Rs. 50. A five-point slab change looks small but scales: on Rs. 10 lakh turnover, 12 versus 18 percent is a Rs. 60,000 difference in tax passed or collected.</p>

      <p><strong>Example 4, luxury 28 percent inclusive back-calculation:</strong> Gross Rs. 64,000 inclusive at 28 percent. Base equals 64,000 divided by 1.28, or Rs. 50,000. Tax equals Rs. 14,000, shown as Rs. 7,000 plus Rs. 7,000 intra-state or Rs. 14,000 IGST. If you mistakenly compute 28 percent on gross (64,000 times 0.28 equals Rs. 17,920), you overstate tax by Rs. 3,920, the classic inclusive error the calculator prevents. Reverse check with Effective rate equals Tax divided by Base times 100: if an invoice says Base Rs. 21,186 plus Tax Rs. 3,814, the rate is about 18 percent, which is correct.</p>

      <h2 id="comparison">4. Comparison: What Different Slabs Do to Rs. 10,000</h2>

      <p>Same base with a different slab means very different cash collection and ITC flow. Table 1 uses a Rs. 10,000 exclusive base with intra-state split.</p>

      <table><caption>Table 1: Illustrative GST on Rs. 10,000 base (exclusive) by slab, intra-state</caption><tr><th>Slab</th><th>CGST</th><th>SGST</th><th>Total tax</th><th>Gross collectible</th></tr><tr><td>0%</td><td>Rs. 0</td><td>Rs. 0</td><td>Rs. 0</td><td>Rs. 10,000</td></tr><tr><td>5%</td><td>Rs. 250</td><td>Rs. 250</td><td>Rs. 500</td><td>Rs. 10,500</td></tr><tr><td>12%</td><td>Rs. 600</td><td>Rs. 600</td><td>Rs. 1,200</td><td>Rs. 11,200</td></tr><tr><td>18%</td><td>Rs. 900</td><td>Rs. 900</td><td>Rs. 1,800</td><td>Rs. 11,800</td></tr><tr><td>28%</td><td>Rs. 1,400</td><td>Rs. 1,400</td><td>Rs. 2,800</td><td>Rs. 12,800</td></tr></table>

      <p>For an inclusive starting point, Table 2 shows what Rs. 10,000 inclusive really contains at each slab.</p>

      <table><caption>Table 2: Illustrative base versus tax inside a Rs. 10,000 inclusive total</caption><tr><th>Slab</th><th>Base retained</th><th>Tax inside</th><th>Split intra-state</th></tr><tr><td>5%</td><td>~Rs. 9,523.81</td><td>~Rs. 476.19</td><td>~Rs. 238.10 + ~Rs. 238.10</td></tr><tr><td>12%</td><td>~Rs. 8,928.57</td><td>~Rs. 1,071.43</td><td>~Rs. 535.71 + ~Rs. 535.71</td></tr><tr><td>18%</td><td>~Rs. 8,474.58</td><td>~Rs. 1,525.42</td><td>~Rs. 762.71 + ~Rs. 762.71</td></tr><tr><td>28%</td><td>~Rs. 7,812.50</td><td>~Rs. 2,187.50</td><td>~Rs. 1,093.75 + ~Rs. 1,093.75</td></tr></table>

      <p>Takeaway: absorbing GST versus passing it on changes retained base by 15 to 22 percent at 18 to 28 percent. E-commerce sellers with inclusive MRPs must back-calculate before setting discounts, or a 10 percent off promotion stacks on already-embedded tax and wipes out margin. Use batch slab comparison in the tool to test each pricing choice before publishing rates.</p>

      <div class="cta-box"><p><strong>Invoice plus logistics together:</strong> After totals, open the <a href="/tool/eway-bill-calculator">E-Way Bill Calculator</a> to check whether consignment value and distance trigger an e-way bill and to estimate validity days, then copy both outputs to your dispatch note.</p></div>

      <h2 id="mistakes">5. Five Costly GST Mistakes</h2>

      <p><strong>1. Applying the rate to the inclusive total.</strong> Computing 18 percent times Rs. 11,800 (Rs. 2,124) instead of extracting Rs. 1,800 overstates tax and understates base. Always divide by one plus the rate for inclusive amounts. The mode toggle plus amount-in-words display catches this instantly.</p>

      <p><strong>2. Wrong CGST and SGST versus IGST.</strong> Showing CGST plus SGST on an inter-state supply, or IGST on an intra-state supply, causes GSTR-1 versus e-way bill mismatches and buyer ITC delays. Confirm place of supply before invoicing; the tool sale-type switch labels the split explicitly.</p>

      <p><strong>3. Using the wrong slab for the category.</strong> Five versus 12 versus 18 percent depends on the exact HSN or SAC code and notifications, with nuances across restaurant, catering, and hotel services for illustration. A six-point error on Rs. 5 lakh is Rs. 30,000. Verify the code with the CBIC schedule or your CA and use the custom rate field only after confirmation.</p>

      <p><strong>4. Forgetting ITC eligibility.</strong> Tax collected is not a cost if you can claim ITC on inputs, but blocked credits for motor vehicles, personal use, exempt supplies, or missing GSTR-2B entries are a cost. Price on net tax cost (output minus eligible ITC), not gross tax. Keep vendor GSTINs and match 2B monthly.</p>

      <p><strong>5. Moving goods without a valid e-way bill.</strong> Even with correct GST, transport above threshold without an e-way bill risks detention and penalty. Generate the bill before movement, track validity by distance (about one day per 200 km for illustration, verify the current rule), and extend before expiry if delayed. The e-way calculator gives a distance-based validity estimate for planning.</p>

      <h2 id="faq">6. FAQ</h2>

      <p>See the structured FAQ section on this page for concise answers on adding and removing GST, CGST versus SGST versus IGST, current slabs, invoice format, e-way bill triggers, ITC eligibility, and discount treatment. Each answer follows the exclusive versus inclusive formulas and split rules explained above.</p>

      <div class="ymyl-disclaimer"><p><strong>Tax notice (YMYL):</strong> This guide explains GST arithmetic for education only and is not tax or legal advice. Slabs, HSN and SAC rates, thresholds, and e-way bill rules change through CBIC notifications. Confirm the applicable rate and registration needs with a CA or official guidance before filing. See <a href="/disclaimer#financial-crypto">Disclaimer</a>.</p></div>

      <section id="methodology"><h2>Methodology</h2><p>Exclusive: Tax equals Base times rate; Gross equals Base times one plus rate. Inclusive: Base equals Gross divided by one plus rate; Tax equals Gross minus Base. Split: CGST equals SGST equals Tax divided by 2 intra-state; IGST equals Tax inter-state. Rates 0.05, 0.12, 0.18, 0.28. Rounded to two decimals; illustrative and excludes cess, reverse charge, and composition nuances.</p></section>

      <p><strong>Keep learning:</strong> See <a href="/blog/calculators/emi-calculator-guide">EMI Calculator Guide</a> and <a href="/blog/calculators/salary-take-home-pay">Salary Take-Home Pay Explained</a> for more calculator walkthroughs.</p>

      '
