      <h2>Kindness Rules for Group Fun</h2>

      <p>Keep participation voluntary with easy opt-outs and never pair people who
      signal discomfort. Announce that scores are jokes before starting, limit romantic
      framing for young or mixed groups and offer friendship or team modes as defaults.
      Display only first names, avoid teasing about low scores and rotate pairs quickly
      so nobody lingers in awkward spotlights. Hosts set tone: warm narration plus
      brisk pacing keeps energy safe.</p>

      <p>Watch the room continuously. If laughter turns nervous, switch to trivia
      or snacks, invite volunteers rather than drafting and close the game on a high
      note with group photos. The goal is shared smiles, not viral screenshots at
      someone expense. Kind hosts get invited back.</p>

      <table><caption>Hosting checklist for safe fun</caption><thead><tr><th>Moment</th><th>Action</th><th>What
