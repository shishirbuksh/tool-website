      scenarios help you rehearse decisions without real exposure. Change one input
      at a time, observe which input moves the estimate most, and focus your research
      there. This sensitivity habit turns tools from answer machines into learning
      instruments.</p><h2>Record-Keeping That Makes Estimates Useful</h2><p>An estimate
      you cannot reproduce is just a feeling. For every scenario worth remembering,
