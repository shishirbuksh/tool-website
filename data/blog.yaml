      <p>House rules keep nights fun. Agree before play whether cocked physical dice
      reroll or digital draws decide, how ties resolve and when the log is final.
      Short written rules prevent long midnight arguments. Save funny seeds and outcomes
      for recaps that bring groups back.</p>

      <h2>Sampling and Testing for Study and Work</h2>

      <p>Students sample practice questions by numbering chapters and drawing balanced
