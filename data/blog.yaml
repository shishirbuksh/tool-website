      teaches more than any single analytic snapshot about which structures persisted.</p><table><caption>Table
      of friction effects on illustrated trades</caption><thead><tr><th>Friction</th><th>Where
      it bites</th><th>Illustrative drag</th><th>Mitigation</th></tr></thead><tbody><tr><td>Slippage</td><td>Thin
      books on entries and exits</td><td>Large on size</td><td>Smaller sizes, limit
      discipline</td></tr><tr><td>Network fees</td><td>Congestion windows</td><td>Spikes
      with hype</td><td>Avoid peak windows</td></tr><tr><td>Spreads</td><td>Every
      round trip</td><td>Compounds with frequency</td><td>Fewer, slower actions</td></tr><tr><td>Record
      burden</td><td>Many small trades</td><td>Hours at review</td><td>Observe more,
      trade less</td></tr></tbody></table><p>Net-of-friction simulation is the only
      kind worth reading. Gross moves advertise; net figures inform.</p><h2>Costs
      and Frictions That Erase Paper Moves</h2><p>Thin liquidity converts paper moves
