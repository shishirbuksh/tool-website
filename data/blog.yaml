    faqs:
    - q: How much does AdSense pay per 1000 views?
      a: It varies widely by niche, geography, and season. Illustrative presets range
        from about 2.50 dollars for entertainment to about 8.50 dollars for finance.
        Your actual RPM from AdSense reports is the only reliable input.
    - q: What is the difference between RPM and CPM?
      a: CPM is advertiser cost per 1000 ad impressions while RPM is publisher earnings
        kept per 1000 views after revenue share and non-monetized views. RPM is typically
        lower and is better for income planning.
    - q: How does CTR affect AdSense earnings?
      a: Higher CTR generally means more clicks per 100 views, which at the same CPC
        lifts RPM. But CPC matters equally, so low-CTR finance traffic can out-earn
        high-CTR entertainment due to bid differences.
    - q: How many views do I need to earn 1000 dollars per month?
      a: Views equal 1000 divided by RPM over 1000. At 8.50 RPM about 118k views,
        at 5.00 about 200k, at 2.50 about 400k. Use Revenue Goal to estimate your
        exact number from your RPM.
    - q: Why does the YouTube estimate look lower than views times CPM divided by
        1000?
      a: The tool filters by engagement percent and watch-time ratio to estimate monetized
        playbacks, which is conservative versus raw views times CPM. Adjust engagement
        and watch-time to match your analytics.
    - q: Are AdSense and YouTube estimators accurate?
      a: They are arithmetic estimators from inputs you enter, not predictions. Actual
        earnings vary with auctions, seasonality, policy, invalid-traffic filtering,
        and revenue-share terms.
    - q: Can I count on 5 percent monthly growth for 12 months?
      a: Only as an illustration. Compounding assumes stable RPM, retention, and algorithms.
        Model two to three growth rates and re-forecast monthly with fresh data.
    howto_steps:
    - title: Enter Traffic
      desc: In AdSense add monthly pageviews, sessions per visitor, and growth percent.
        In YouTube Revenue tab add views, CPM, engagement, watch time, and ad pods.
    - title: Pick a Niche Preset
      desc: Select Finance, Tech, Education, or others to autofill illustrative RPM,
