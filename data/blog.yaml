      tickets, rows or transactions for audits with documented ranges and counts that
      others can replicate. Developers generate test integers for boundary checks,
      pagination and sorting demos, noting that edge cases still need deliberate values
      like zero, maximum plus one and empty sets alongside random picks.</p>

      <p>Record method notes for anything shared: range, count, repeat rule, date
      and purpose. Screenshots of inputs plus outputs let reviewers trust samples
      without rerunning. For classroom statistics, pair random draws with manual calculations
      of mean and spread to build intuition about variation.</p>

