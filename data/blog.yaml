    - q: Why does my animation look choppy on mobile?
      a: Usually layout-property animation, oversized blur shadows, or too many simultaneous
        layers. Switch to transforms, cut shadow blur, stagger starts and test on
        real mid-range hardware.
    - q: Are the CSS generators free?
