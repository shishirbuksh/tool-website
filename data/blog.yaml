      <h2>What the Random Number Generator Does</h2>

      <p>The generator produces unbiased integers within your chosen range with options
      for count, uniqueness and sorting. Set minimum to one and maximum to one hundred
      for percentage-style draws, one to six for dice emulation or one to participant
      count for indexed lists. Choose no-repeat for distinct winners and allow repeats
      for dice and resampling demos. Results appear instantly with copy buttons for
      chats, sheets and slides.</p>

      <p>Fairness comes from explicit rules stated before the draw. Announce the range,
      the count, whether repeats are allowed and how ties or absentees are handled,
      then run once on screen or share the timestamped output. Documented rules plus
      visible output defuse most complaints, because participants can verify method
      rather than trust memory. Save the list with date and context for a week in
      case questions arise.</p>

      <p>Browser randomness uses the device cryptographic or pseudo-random source
      depending on implementation and suffices for low-stakes selection, games and
      demonstrations. It does not replace audited lottery systems, regulated gambling
      draws or cryptographic key generation, where certified processes and oversight
      apply. Match the tool to the stakes and say so openly.</p>

      <h2>Giveaways and Contests Without Disputes</h2>

      <p>Number your entries sequentially from one to N in a sheet, publish the entry
      list cutoff time, then draw the required count with no repeats at the announced
      range. Copy the timestamped results into the announcement post with method notes
      such as range 1 to 240, three unique picks. Redraw only for ineligible or duplicate
      entries under the same posted rule, never to favour preferred names. A two-minute
      video of the draw ends most debates before they start.</p>

      <p>For tiered prizes, draw in reverse order with smallest prizes first so tension
      builds fairly. Assign each drawn number to the next prize tier immediately and
      publish the mapping. Keep entry collection transparent with forms that timestamp
      submissions and deduplicate by email or handle. Clear rules plus public output
      protect organisers more than disclaimers.</p>

      <h2>Classrooms and Teams That Feel Fair</h2>

      <p>Teachers assign roll numbers and draw presentation orders, lab groups or
      quiz questions with visible ranges. Shuffling by random numbers avoids predictable
      alphabetical fatigue and gives quiet students equal chances. Display the draw
      live, allow one good-faith redraw for absentees and log groups for the term.
      Students accept outcomes they watched happen.</p>

      <p>Managers rotate on-call slots, demo orders and peer-review pairs with the
      same method. Publish the rotation generated from dated draws and trade only
      by mutual swap logged in chat. Randomness handles equality of opportunity while
      skills decide content quality, a distinction worth stating so draws never excuse
      preparation.</p>

      <h2>Dice, Coins and Game Nights</h2>

      <p>Emulate dice by drawing one to six per die and summing as rules require,
      with repeats allowed. Flip virtual coins by drawing one to two with odd and
      even mapped to heads and tails. Generate encounter tables, trivia orders and
      secret roles by indexing lists with drawn numbers. Keep a visible roll log so
