    - q: How should I format PO, SO and WO numbers?
      a: Use prefix plus year plus zero-padded sequence such as PO-2026-0001, SO-2026-0001
        and WO-2026-0001. Prefix identifies type, year groups audits, and padding
        keeps sorting correct. Generate documents with the linked generators using
        this pattern.
    - q: Should numbering reset every year?
      a: Yearly reset keeps numbers short and audit-friendly, but only if your accounting
        policy allows it and old numbers stay searchable. Many small firms reset yearly
        with the year in the number. If you operate across tax years, consider continuous
        sequences with year prefix instead.
    - q: How do I avoid duplicate numbers?
      a: Issue numbers from one source per type, never by hand in two sheets at once.
        Let the generator plus a simple log assign the next number, lock editing after
        issue, and require a void entry instead of deletion.
    - q: What is a good approval workflow?
      a: Requester creates draft, manager approves above threshold, buyer sends to
