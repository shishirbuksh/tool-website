      fans from historical trends, momentum, and volatility settings you choose. Use
      the free prediction and trend analyzer tools to simulate base and adverse cases,
      read the spread rather than a single line, and verify with independent sources
      and a qualified professional.</p><h2>Key Takeaways</h2><ul><li>Prediction outputs
      are simulated scenario fans that widen with horizon and volatility.</li><li>Describe
      the current regime with the trend analyzer before simulating anything.</li><li>Horizon,
      volatility, history window, and scenario choice move estimates most.</li><li>Always
      run base plus adverse cases and save dated assumptions.</li><li>Models cannot
      foresee regulation, failures, or liquidity shocks.</li><li>Verify narratives
      independently and consult a qualified professional.</li></ul><h2>Table of Contents</h2><ul><li>What
