      the reddest metric, assign fix with date, re-measure next Monday and archive
      snapshots by date. Fixing one at a time compounds faster than chasing five.</p><h2>Formulas
      and Thresholds</h2><p>Thresholds turn numbers into decisions. Cash collected
      must cover next two payrolls plus rent. Margin stable or rising is healthy,
