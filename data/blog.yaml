        cause.
    - q: Is SMS two-factor enough?
      a: It helps more than nothing, but app codes or keys resist interception better.
        Use the strongest second factor each important account offers.
    - q: Can I share passwords by chat?
      a: Avoid it. Use manager sharing or expiring links, confirm receipt, then revoke.
