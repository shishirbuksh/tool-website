      rate</td><td>Repeat buyers over buyers</td><td>Rising</td><td>Orders plus receipts</td></tr></tbody></table><table><caption>Table
      — Example week with actions</caption><thead><tr><th>KPI this week</th><th>Value</th><th>Signal</th><th>Action
      owner</th></tr></thead><tbody><tr><td>Cash collected</td><td>182000</td><td>Green</td><td>None,
      fund stock</td></tr><tr><td>Margin</td><td>42 percent, down 3</td><td>Yellow</td><td>Review
      discount SKU, Priya</td></tr><tr><td>On-time</td><td>91 percent</td><td>Yellow</td><td>Add
      Saturday shift, Omar</td></tr><tr><td>ROAS</td><td>2.8</td><td>Yellow</td><td>Pause
      set C, shift 20 percent</td></tr><tr><td>CPA</td><td>38 percent of order</td><td>Red</td><td>Pause
      low margin SKU ads</td></tr><tr><td>Repeat</td><td>28 percent up 2</td><td>Green</td><td>Ask
      reviews</td></tr></tbody></table><h2>Weekly Review Rhythm</h2><p>Thirty minutes
      every Monday beats three hours monthly. Agenda: cash versus target two minutes,
      sales plus margin five minutes, fulfillment plus backlog five minutes, ads ROAS
      plus CPA eight minutes, repeat plus returns five minutes, one fix assignment
      five minutes. No laptops except the dashboard, no new metrics mid-meeting, no
      blame without data. Note decisions with date and revisit next week. Monthly
      add returns by SKU, discount leakage and fee review. Quarterly add pricing,
      assortment and channel mix.</p><p>Tool tips: save analyzer reports with dates,
      name files KPI-2026-W38, keep four weeks visible for trend, and chart margin
      plus ROAS together to see profit truth. Daily checks cause overreaction to noise.
      Weekly rhythm with fixed thresholds drives steady fixes that compound.</p><h2>Fixing
      Red Metrics</h2><p>Fix in priority order: cash first, fulfillment second, margin
      third, ads fourth. Cash red means chase top three overdue invoices today and
