      <h2>Key Takeaways</h2>

      <ul>

      <li>Use one column, standard fonts and normal headings so parsers extract titles,
      dates, skills and education correctly.</li>

      <li>Lead bullets with strong verbs plus numbers for scope, scale and outcomes
      that hiring managers scan in seconds.</li>

      <li>Mirror job-post vocabulary naturally where truthful to raise keyword overlap
      without stuffing.</li>

      <li>Keep dates continuous with month and year ranges and explain gaps briefly
