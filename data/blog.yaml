      with interest</td><td>Thinning as attention rises</td><td>Depth direction</td></tr><tr><td>Concentration</td><td>Dispersing
      over time</td><td>Few wallets dominate</td><td>Top-holder share</td></tr></tbody></table><p>Structure
      predicts exit quality better than attention predicts direction. Fragile structures
      deserve distance regardless of excitement.</p><p><em>Methodology: figures in
