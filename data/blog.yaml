        scenarios.
    - q: Which estimates higher?
      a: Depends on horizon, assumed SIP return versus contracted FD rate and timing.
        Simulate the same horizon with a return range to see sensitivity.
    - q: Can I add step-up or monthly additions?
      a: Yes. SIP step-up percent yearly and FD monthly addition mode are supported
        for realistic planning.
