      alongside results for a week.</p>

      <p>Repeat the same script for classrooms and standups. Students and teammates
      learn the rhythm quickly: numbered list shown, rules read, one draw, results
      logged. Familiarity breeds acceptance, and acceptance lets randomness do its
      quiet job of distributing turns, questions and small perks without favouritism
      or debate.</p>

      <h2>When Not to Use Simple Randomness</h2>

      <p>Avoid browser draws for passwords and keys, regulated prizes, medical allocation
      and any legally binding selection. Those need cryptographic generators, audited
      procedures or professional oversight with documented chains of custody. Saying
      no to casual draws for serious stakes protects both organisers and participants.
      Use the password generator for secrets and official systems for official draws.</p>

