      order value preserves cash, above 35 percent burns despite sales. Repeat rising
      quarter over quarter signals fit.</p><table><caption>Table — KPI formulas and
      healthy signs</caption><thead><tr><th>KPI</th><th>Formula</th><th>Healthy sign</th><th>Source</th></tr></thead><tbody><tr><td>Cash
      collected</td><td>Receipts total by week</td><td>Covers next payroll</td><td>Receipts</td></tr><tr><td>Gross
