      <h2>Live Demo Script for Transparent Draws</h2>

      <p>Run a ninety-second demo that audiences trust. Share your screen with entries
      numbered visibly, read the posted rules aloud including range, count and no-repeat
      policy, enter the exact values into the generator without editing and click
      draw once. Pause on the results for five seconds, copy them into the announcement
