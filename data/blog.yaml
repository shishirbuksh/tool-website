    title: AdSense YouTube Earnings Estimator — RPM, CTR and CPM Guide
    meta_title: AdSense YouTube Earnings Estimator — RPM, CTR and CPM Guide
    description: Estimate AdSense and YouTube earnings from views, RPM, CTR and CPM.
