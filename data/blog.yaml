    faqs:
    - q: How do I create smooth CSS gradients?
      a: Layer two to four color stops with intentional midpoints, pick linear angles
        or radial shapes deliberately, and test text contrast at every stop since
        light midpoints often fail accessibility.
    - q: What makes a good box shadow?
      a: Soft large-blur ambient shadows with low opacity look modern, while tight
        dark shadows look dated. Layer one ambient plus one contact shadow and keep
        mobile blurs modest for paint performance.
    - q: Which CSS properties animate cheapest?
      a: Transform and opacity composite on the GPU and stay smooth. Animating width,
        height, margins or top and left triggers layout and paint, causing jank on
        mid-range phones.
    - q: How do I respect reduced-motion preferences?
      a: Wrap animations in a prefers-reduced-motion media query that disables or
        simplifies motion, keeping content fully readable and operable with zero animation.
    - q: Can filters replace image editing?
      a: For brightness, contrast, saturation, blur, grayscale and hue shifts, yes,
