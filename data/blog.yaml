      risks</td><td>Market price path</td><td>Difficulty growth plus prices</td><td>Freezing
      difficulty flat</td></tr><tr><td>Exit friction</td><td>Sale spreads and taxes</td><td>Resale
      value plus cleanup</td><td>Assuming full resale value</td></tr></tbody></table><p>Complete
