[project]
name = "storybrain-ai"
version = "1.0.0"
description = "StoryBrain AI — 101 Free Online Tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "gunicorn==26.0.0",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "redis==5.2.1",
    "python-multipart==0.0.32",
    "qrcode==8.2",
    "pillow==12.2.0",
    "numpy==2.4.6",
    "pandas==2.2.3",
    "pyyaml==6.0.3",
    "nh3==0.3.6",
    "requests==2.34.2",
    "fpdf2==2.8.7",
    "yfinance==0.2.54",
    "prometheus_client==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "EM", "G", "T20"]
ignore = ["E501", "EM101", "G004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# ROUND-2: strict already implies disallow_untyped_defs; keep explicit true for gate clarity.
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["venv/", ".git/", "node_modules/", "rust_predictor/"]

[[tool.mypy.overrides]]
module = ["rust_predictor", "yfinance", "prophet", "rembg", "cv2"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
