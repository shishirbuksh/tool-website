[project]
name = "storybrain-ai"
version = "1.0.0"
description = "StoryBrain AI — 126 Free Online Tools"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<7.0",
    "django-environ>=0.12.0",
    "gunicorn==26.0.0",
    "jinja2==3.1.6",
    "redis==5.2.1",
    "qrcode==8.2",
    "pillow==12.3.0",
    "numpy==2.4.6",
    "pandas==2.2.3",
    "pyyaml==6.0.3",
    "nh3==0.3.7",
    "requests==2.34.2",
    "fpdf2==2.8.7",
    "email-validator==2.2.0",
    "yfinance==0.2.54",
    "prometheus_client==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-django>=4.9.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# NOTE: D (pydocstyle) and S (bandit) intentionally not enabled — enabling
# them now would fail CI on existing code; revisit separately.
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "EM", "G", "T20"]
ignore = ["E501", "EM101", "G004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM", "T20"]
# CLI utility scripts print to stdout/stderr by design (dry-run, progress, errors).
"scripts/*" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
# 3.12 target: numpy 2.4+ stubs use PEP 695 `type` statement syntax which mypy
# cannot parse with python_version=3.11. Runtime still supports 3.11+ (we write
# 3.11-compatible code; do NOT use 3.12-only runtime syntax).
python_version = "3.12"
strict = true
ignore_missing_imports = true
# ROUND-2: strict already implies disallow_untyped_defs; keep explicit true for gate clarity.
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["venv/", ".git/", "node_modules/"]

[[tool.mypy.overrides]]
module = ["yfinance", "prophet", "rembg", "cv2", "yaml"]
ignore_missing_imports = true

# numpy 2.4+ stubs use Python 3.12 `type` statement syntax which mypy with
# python_version=3.11 cannot parse (local py3.14 env). Ignore stub syntax errors;
# our code does not rely on numpy type precision.
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_errors = true

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 80
